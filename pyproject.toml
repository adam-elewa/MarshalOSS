[project]
name = "marshaloss"
version = "0.1.0"
description = "Docling ingest + hybrid semantic search + MCP for defense discovery (MarshalOSS)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Elewa", email = "adamelewa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "docling[asr]>=2.50.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=1.26.4",
    "openai>=1.60.0",
    "pillow>=10.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=4.30.0",
    "rich>=15.0.0",
    "typer>=0.19.0,<0.28.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.3.2",
]

[project.scripts]
marshaloss = "marshal_oss.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "marshal_oss"
