# Datashare review plane (LOCAL mode). Requires Docker.
# UI: http://localhost:8100  — pick your project after indexing.
services:
  datashare:
    image: icij/datashare:21.25.0
    hostname: datashare
    ports:
      - "${DATASHARE_PORT:-8100}:8080"
    environment:
      - DS_DOCKER_MOUNTED_DATA_DIR=/home/datashare/data
    volumes:
      - type: bind
        source: ${DATASHARE_DATA_DIR:-./data}
        target: /home/datashare/data
      - type: volume
        source: datashare-models
        target: /home/datashare/dist
      - type: bind
        source: ./plugins
        target: /home/datashare/plugins
    command: >-
      app start
      --dataSourceUrl "jdbc:postgresql://postgresql/datashare?user=${POSTGRES_USER:-datashare}&password=${POSTGRES_PASSWORD:-datashare}"
      --mode LOCAL
      --tcpListenPort 8080
      --bind 0.0.0.0
      --elasticsearchAddress http://elasticsearch:9200
      --redisAddress redis://redis:6379
      --messageBusAddress redis://redis:6379
    depends_on:
      - postgresql
      - redis
      - elasticsearch
    restart: unless-stopped

  elasticsearch:
    # Datashare 21.25 needs ES 8.x (highlight max_analyzed_offset)
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.8
    restart: unless-stopped
    volumes:
      - type: volume
        source: elasticsearch-data
        target: /usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - cluster.name=datashare
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - http.cors.enabled=true
      - http.cors.allow-origin='*'
      - http.cors.allow-methods=OPTIONS, HEAD, GET, POST, PUT, DELETE
      - indices.query.bool.max_clause_count=20000
      - indices.id_field_data.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgresql:
    image: postgres:12-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-datashare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-datashare}
      - POSTGRES_DB=datashare
    volumes:
      - type: volume
        source: postgresql-data
        target: /var/lib/postgresql/data
    restart: unless-stopped

volumes:
  datashare-models:
  elasticsearch-data:
  postgresql-data:
