<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marshal — Bodycam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/bwc/styles.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #f3f5f7; }
    #host { min-height: 100%; }
    .bwc-shell .top { display: none; }
  </style>
</head>
<body>
  <div id="host"></div>
  <script src="/bwc/app.js"></script>
  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const caseId = qs.get("case_id") || "";
      const shell = "<div class=\"bwc-shell\">\n  <div class=\"layout\">\n    <aside class=\"rail picker-card\">\n      <div class=\"picker-controls\">\n        <label class=\"search-wrap\" id=\"searchWrap\">\n          <span class=\"label\">Search transcripts &amp; scenes</span>\n          <div class=\"search-row\">\n            <span class=\"search-icon\" aria-hidden=\"true\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"></circle>\n                <path d=\"M16 16l5 5\"></path>\n              </svg>\n            </span>\n            <input id=\"q\" type=\"search\" placeholder=\"e.g. Mobile Crisis, Randolph, mic\u2026\" autocomplete=\"off\" />\n            <button type=\"button\" class=\"clear-search\" id=\"clearSearch\" hidden>Clear</button>\n          </div>\n        </label>\n        <div class=\"select-field\">\n          <span class=\"select-label\" id=\"officerLabel\">Officer / source</span>\n          <div class=\"select-with-edit\">\n            <div class=\"cselect\" id=\"officerSelect\" data-kind=\"officer\">\n              <button type=\"button\" class=\"cselect-trigger\" id=\"officerTrigger\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-labelledby=\"officerLabel\">\n                <span class=\"cselect-value\" id=\"officerValue\">Select officer / source\u2026</span>\n                <span class=\"cselect-chev\" aria-hidden=\"true\"></span>\n              </button>\n              <div class=\"cselect-menu\" id=\"officerMenu\" role=\"listbox\" hidden></div>\n            </div>\n            <button type=\"button\" class=\"rename-pen\" id=\"renameOfficerPen\" disabled title=\"Rename Officer / Source\" aria-label=\"Rename Officer / Source\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z\"/></svg></button>\n          </div>\n        </div>\n        <div class=\"select-field\">\n          <span class=\"select-label\" id=\"clipLabel\">Recording</span>\n          <div class=\"cselect\" id=\"clipSelect\" data-kind=\"clip\">\n            <button type=\"button\" class=\"cselect-trigger\" id=\"clipTrigger\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-labelledby=\"clipLabel\" disabled>\n              <span class=\"cselect-value\" id=\"clipValue\">Select an officer first\u2026</span>\n              <span class=\"cselect-chev\" aria-hidden=\"true\"></span>\n            </button>\n            <div class=\"cselect-menu\" id=\"clipMenu\" role=\"listbox\" hidden></div>\n          </div>\n        </div>\n      </div>\n      <section class=\"timeline-panel\" aria-labelledby=\"timelineTitle\">\n        <div class=\"timeline-head\">\n          <div class=\"timeline-head-left\">\n            <span class=\"select-label\" id=\"timelineTitle\">Incident timeline</span>\n            <span class=\"timeline-note\" id=\"timelineNote\"></span>\n            <div class=\"timeline-daybar\" id=\"timelineDayBar\" hidden>\n              <span class=\"timeline-day-label\">Date</span>\n              <div class=\"timeline-days\" id=\"timelineDays\" role=\"tablist\" aria-label=\"Timeline day\"></div>\n            </div>\n          </div>\n          <div class=\"timeline-head-tools\">\n            <div class=\"timeline-filter\" id=\"timelineFilterWrap\">\n              <button type=\"button\" class=\"timeline-tool-btn\" id=\"timelineFilterBtn\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-controls=\"timelineFilterMenu\" title=\"Filter officers\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.13L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z\"></path>\n                </svg>\n                <span class=\"timeline-tool-label\">Filter</span>\n                <span class=\"timeline-tool-count\" id=\"timelineFilterCount\" hidden></span>\n              </button>\n              <div class=\"timeline-filter-menu\" id=\"timelineFilterMenu\" hidden role=\"dialog\" aria-label=\"Filter timeline officers\">\n                <div class=\"timeline-filter-actions\">\n                  <button type=\"button\" class=\"timeline-filter-action\" id=\"timelineFilterAll\">Select all</button>\n                  <button type=\"button\" class=\"timeline-filter-action\" id=\"timelineFilterClear\">Clear all</button>\n                </div>\n                <div class=\"timeline-filter-list\" id=\"timelineFilterList\"></div>\n              </div>\n            </div>\n            <div class=\"timeline-offset\" id=\"timelineOffsetWrap\">\n              <button type=\"button\" class=\"timeline-tool-btn\" id=\"timelineAdjustBtn\" aria-pressed=\"false\" title=\"Adjust clip times on the timeline\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M12 6v6l4 2\"></path>\n                  <circle cx=\"12\" cy=\"12\" r=\"9\"></circle>\n                </svg>\n                <span class=\"timeline-tool-label\">Adjust times</span>\n                <span class=\"timeline-tool-count\" id=\"timelineOffsetCount\" hidden></span>\n              </button>\n            </div>\n          </div>\n        </div>\n        <div class=\"timeline-offset-panel\" id=\"timelineOffsetPanel\" hidden>\n          <div class=\"timeline-offset-meta\">\n            <span class=\"timeline-offset-title\" id=\"timelineOffsetTitle\">Select a clip to offset</span>\n            <span class=\"timeline-offset-value\" id=\"timelineOffsetValue\">\u00b10:00</span>\n          </div>\n          <div class=\"timeline-offset-controls\">\n            <button type=\"button\" class=\"timeline-offset-nudge\" data-nudge=\"-3600\" title=\"\u22121 hour\">\u22121h</button>\n            <button type=\"button\" class=\"timeline-offset-nudge\" data-nudge=\"-300\" title=\"\u22125 minutes\">\u22125m</button>\n            <button type=\"button\" class=\"timeline-offset-nudge\" data-nudge=\"-60\" title=\"\u22121 minute\">\u22121m</button>\n            <label class=\"timeline-offset-entry\">\n              <span>Offset</span>\n              <input id=\"timelineOffsetInput\" type=\"text\" inputmode=\"text\" placeholder=\"\u00b1h:mm:ss\" disabled />\n            </label>\n            <button type=\"button\" class=\"timeline-offset-nudge\" data-nudge=\"60\" title=\"+1 minute\">+1m</button>\n            <button type=\"button\" class=\"timeline-offset-nudge\" data-nudge=\"300\" title=\"+5 minutes\">+5m</button>\n            <button type=\"button\" class=\"timeline-offset-nudge\" data-nudge=\"3600\" title=\"+1 hour\">+1h</button>\n            <button type=\"button\" class=\"timeline-offset-reset\" id=\"timelineOffsetReset\" disabled>Reset</button>\n          </div>\n          <p class=\"timeline-offset-hint\" id=\"timelineOffsetHint\">Turn on Adjust times, then drag a colored bar left/right to shift it.</p>\n        </div>\n        <div class=\"timeline-scroll\" id=\"timeline\"></div>\n        <button type=\"button\" class=\"timeline-toggle\" id=\"timelineToggle\" hidden aria-controls=\"timeline\">\n          <span class=\"timeline-toggle-chev\" aria-hidden=\"true\"></span>\n          <span class=\"timeline-toggle-label\" id=\"timelineToggleLabel\"></span>\n        </button>\n      </section>\n      <div class=\"hit-meta\" id=\"hitMeta\"></div>\n    </aside>\n    <main class=\"stage stage-card\">\n      <section class=\"player-panel\">\n        <div class=\"player-head\">\n          <div class=\"player-title-row\">\n            <h1 id=\"activeTitle\">Select a recording</h1>\n            <button type=\"button\" class=\"rename-pen\" id=\"renameTitlePen\" disabled title=\"Rename Officer / Source\" aria-label=\"Rename Officer / Source\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z\"/></svg></button>\n          </div>\n          <div class=\"head-actions\">\n            <div class=\"timebox\">\n              <span id=\"clock\">00:00</span>\n              <span class=\"sep\">/</span>\n              <span id=\"dur\">00:00</span>\n            </div>\n            <a class=\"dl-icon\" id=\"dlMedia\" href=\"#\" download hidden title=\"Download video\" aria-label=\"Download video\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                <path d=\"M12 3v12\"></path>\n                <path d=\"M7 11l5 5 5-5\"></path>\n                <path d=\"M5 20h14\"></path>\n              </svg>\n            </a>\n          </div>\n        </div>\n        <video id=\"player\" controls playsinline preload=\"metadata\"></video>\n        <audio id=\"audio\" controls preload=\"metadata\" hidden></audio>\n        <p class=\"ai-disclaimer\" id=\"aiDisclaimer\" hidden>\n          Transcript and visual analysis are AI-generated. Please review and verify them against the original recording.\n        </p>\n      </section>\n      <section class=\"results-panel\">\n        <div class=\"tabs\">\n          <div class=\"tab-pill\">\n            <button type=\"button\" class=\"tab active\" data-tab=\"transcript\">Transcript</button>\n            <button type=\"button\" class=\"tab-dl\" id=\"dlTranscript\" hidden title=\"Download transcript\" aria-label=\"Download transcript\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                <path d=\"M12 3v12\"></path>\n                <path d=\"M7 11l5 5 5-5\"></path>\n                <path d=\"M5 20h14\"></path>\n              </svg>\n            </button>\n          </div>\n          <div class=\"tab-pill\">\n            <button type=\"button\" class=\"tab\" data-tab=\"vision\">Visual analysis</button>\n            <button type=\"button\" class=\"tab-dl\" id=\"dlVision\" hidden title=\"Download visual analysis\" aria-label=\"Download visual analysis\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                <path d=\"M12 3v12\"></path>\n                <path d=\"M7 11l5 5 5-5\"></path>\n                <path d=\"M5 20h14\"></path>\n              </svg>\n            </button>\n          </div>\n          <button type=\"button\" class=\"tab tab-hits\" data-tab=\"hits\">Show search hits only</button>\n        </div>\n        <div id=\"transcript\" class=\"scroll\"></div>\n        <div id=\"vision\" class=\"scroll\" hidden></div>\n        <div id=\"hits\" class=\"scroll\" hidden></div>\n      </section>\n    </main>\n  </div>\n  <div class=\"rename-modal\" id=\"renameModal\" hidden>\n    <div class=\"rename-modal-backdrop\" data-rename-dismiss=\"1\"></div>\n    <div class=\"rename-modal-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"renameModalTitle\">\n      <div class=\"rename-modal-head\">\n        <h2 id=\"renameModalTitle\">Rename Officer / Source</h2>\n        <button type=\"button\" class=\"rename-modal-close\" id=\"renameModalClose\" aria-label=\"Close\" data-rename-dismiss=\"1\">\u00d7</button>\n      </div>\n      <div class=\"rename-modal-body\">\n        <label class=\"label-field\">\n          <span class=\"select-label\">Name</span>\n          <input id=\"labelInput\" type=\"text\" list=\"labelSuggestions\" placeholder=\"Pick a person or type a name\u2026\" autocomplete=\"off\" />\n          <datalist id=\"labelSuggestions\"></datalist>\n        </label>\n        <div class=\"label-scope\" role=\"radiogroup\" aria-label=\"Label scope\">\n          <label><input type=\"radio\" name=\"labelScope\" value=\"camera\" checked /> All clips from this camera</label>\n          <label><input type=\"radio\" name=\"labelScope\" value=\"clip\" /> This recording only</label>\n        </div>\n        <p class=\"label-hint\">Suggestions are case person/officer entities. Freeform names work too. Default scope renames the whole camera (same Axon serial).</p>\n        <span class=\"label-status\" id=\"labelStatus\" hidden></span>\n      </div>\n      <div class=\"rename-modal-actions\">\n        <button type=\"button\" class=\"label-clear\" id=\"labelClear\">Clear label</button>\n        <div class=\"rename-modal-actions-right\">\n          <button type=\"button\" class=\"label-cancel\" id=\"labelCancel\" data-rename-dismiss=\"1\">Cancel</button>\n          <button type=\"button\" class=\"label-save\" id=\"labelSave\">Save</button>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>";
      document.getElementById("host").innerHTML = shell;
      window.__BWC_INDEX_URL__ = "/api/bwc/index" + (caseId ? ("?case_id=" + encodeURIComponent(caseId)) : "");
      window.__BWC_CASE_ID__ = caseId ? Number(caseId) : null;
      window.startBwcViewer();
    })();
  </script>
</body>
</html>
