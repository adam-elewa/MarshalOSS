      <div class="body">
        <div class="title-row">
          <h2>${esc(title)}</h2>
          <button type="button" class="case-rename-pen" data-rename-case="${c.id}" title="Rename case" aria-label="Rename case">
            ${icoRenamePen()}
          </button>
        </div>
        <div class="grow" aria-hidden="true"></div>
      </div>
      <div class="view-bar">View</div>
    </div>`;
  }).join("");
  return `<div class="home-wrap"><div class="cases-grid">${tiles}</div></div>`;
}

function icoRenamePen() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
}

let caseRenameId = null;
let caseRenamePrev = "";
let caseRenameBusy = false;

function closeCaseRenameModal() {
  const modal = document.getElementById("caseRenameModal");
  if (modal) modal.hidden = true;
  caseRenameId = null;
  caseRenamePrev = "";
  caseRenameBusy = false;
  const status = document.getElementById("caseRenameStatus");
  if (status) {
    status.hidden = true;
    status.textContent = "";
  }
}

function openCaseRenameModal(caseId) {
  const current = (state.cases || []).find(c => c.id === caseId)
    || (state.caseMeta && state.caseMeta.id === caseId ? state.caseMeta : null);
  const prev = (current && (current.display_name || current.slug)) || "";
  const modal = document.getElementById("caseRenameModal");
  const input = document.getElementById("caseRenameInput");
  const status = document.getElementById("caseRenameStatus");
  if (!modal || !input) return;
  caseRenameId = caseId;
  caseRenamePrev = prev;
  input.value = prev;
  if (status) {
    status.hidden = true;
    status.textContent = "";
  }
  modal.hidden = false;
  requestAnimationFrame(() => {
    input.focus();
    input.select();
  });
}

async function saveCaseRename() {
  if (caseRenameBusy || caseRenameId == null) return;
  const input = document.getElementById("caseRenameInput");
  const status = document.getElementById("caseRenameStatus");
  const name = String(input && input.value || "").trim();
  if (!name) {
    if (status) {
      status.hidden = false;
      status.textContent = "Enter a case name.";
    }
    return;
  }
  if (name === caseRenamePrev) {
    closeCaseRenameModal();
    return;
  }
  caseRenameBusy = true;
  if (status) {
    status.hidden = false;
    status.style.color = "var(--muted-strong)";
    status.textContent = "Saving…";
  }
  try {
    const res = await fetch(`/api/cases/${caseRenameId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ display_name: name }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.error || res.statusText);
    const updated = data.case;
    if (updated) {
      state.cases = (state.cases || []).map(c => (c.id === updated.id ? updated : c));
      if (state.caseMeta && state.caseMeta.id === updated.id) state.caseMeta = updated;
    }
    closeCaseRenameModal();
    render();
  } catch (err) {
    if (status) {
      status.hidden = false;
      status.style.color = "var(--danger)";
      status.textContent = err.message || String(err);
    }
    caseRenameBusy = false;
  }
}

function wireCaseRenameModal() {
  const modal = document.getElementById("caseRenameModal");
  if (!modal || modal.dataset.wired) return;
  modal.dataset.wired = "1";
  modal.addEventListener("click", (ev) => {
    if (ev.target.closest && ev.target.closest("[data-case-rename-dismiss]")) {
      closeCaseRenameModal();
    }
  });
  const save = document.getElementById("caseRenameSave");
  if (save) save.addEventListener("click", () => saveCaseRename());
  const input = document.getElementById("caseRenameInput");
  if (input) {
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        saveCaseRename();
      } else if (ev.key === "Escape") {
        ev.preventDefault();
        closeCaseRenameModal();
      }
    });
  }
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && modal && !modal.hidden) closeCaseRenameModal();
  });
}

function renameCase(caseId) {
  openCaseRenameModal(caseId);
}

function statusLabel(status) {
  const raw = String(status || "unknown");
  const key = raw.toLowerCase();
  if (key === "skipped_not_covered" || key === "skipped-not-covered") {
    return "File Type Not Supported";
  }
  if (key === "skipped") return "Skipped";
  if (key === "ready") return "Ready";
  if (key === "pending") return "Pending";
  if (key === "error") return "Error";
  return raw.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

function statusPill(status) {
  const raw = String(status || "unknown");
  const cls = raw.replace(/[^a-z0-9_]/gi, "_").toLowerCase();
  return `<span class="status-pill ${esc(cls)}">${esc(statusLabel(raw))}</span>`;
}

function fileActionIcons(doc) {

  const dlHref = doc?.download_url || null;
  let html = "";
  if (openHref) {

  }

function isLowConfidence(r) {
  return r && r.processed && r.quality_score != null && Number(r.quality_score) < 0.72;
}

function canInlinePreview(doc) {
  if (!doc) return false;
  if (doc.kind === "pdf" || doc.kind === "image" || doc.kind === "video" || doc.kind === "audio") {
    return !!doc.raw_url;
  }
  return !!(doc.text && String(doc.text).trim());
}

function encodeRelPath(rel) {
  return String(rel || "")
    .split("/")
    .filter(Boolean)
    .map((p) => encodeURIComponent(p))
    .join("/");
}

function overviewFileUrls(relPath) {
  const slug = state.caseMeta?.slug;
  if (!slug || !relPath) return { raw_url: null, open_url: null, download_url: null };
  const enc = encodeRelPath(relPath);
  const raw = `/files/${encodeURIComponent(slug)}/${enc}`;
  return {
    raw_url: raw,
    open_url: `/view/${encodeURIComponent(slug)}/${enc}`,
    download_url: `${raw}?dl=1`,
  };
}

function withOverviewUrls(doc, relPath) {
  const fallback = overviewFileUrls(relPath || doc.rel_path);
  const out = { ...doc };
  out.raw_url = relativize(out.raw_url) || fallback.raw_url;
  out.open_url = relativize(out.open_url) || fallback.open_url;
  out.download_url = relativize(out.download_url) || fallback.download_url;
  return out;
}

async function loadOverviewDoc(relPath, { paint = true } = {}) {
  state.overviewDocPath = relPath;
  try {
    const data = await api(
      `/api/files/detail?case_id=${state.caseId}&path=${encodeURIComponent(relPath)}`
    );
    state.overviewDoc = withOverviewUrls(data.file || {}, relPath);
  } catch (e) {
    const row = (state.overview?.manifest || []).find(r => r.rel_path === relPath)
      || (state.overviewEntityFiles || []).find(r => (r.rel_path || r.path) === relPath);
    state.overviewDoc = withOverviewUrls({
      name: row?.name || relPath.split("/").pop(),
      rel_path: relPath,
      size: row?.size,
      kind: "other",
      text: "",
      _not_ingested: true,
      error: e.message || String(e),
    }, relPath);
  }
  if (paint) render();
}

function clearOverviewEntity() {
  state.overviewEntity = null;
  state.overviewEntityFiles = [];
  state.overviewEntityLoading = false;
  state.overviewDocPath = null;
  state.overviewDoc = null;
}

function clearOverviewTag() {
  state.overviewTag = null;
  state.overviewTagFiles = [];
  state.overviewTagLoading = false;
  state.overviewDocPath = null;
  state.overviewDoc = null;
}

function clearOverviewDrill() {
  clearOverviewEntity();
  clearOverviewTag();
}

async function loadOverviewTagMatches(tag) {
  if (state.overviewTag && state.overviewTag === tag) {
    await withViewTransition(() => {
      clearOverviewTag();
      render();
    });
    return;
  }
  clearOverviewEntity();
  state.overviewTag = tag;
  state.overviewTagFiles = [];
  state.overviewTagLoading = true;
  state.tagDocPage = 1;
  state.overviewDocPath = null;
  state.overviewDoc = null;
  render();
  try {
    const params = new URLSearchParams({ case_id: String(state.caseId), tag });
    const data = await api(`/api/files/by-facet?${params}`);
    if (state.overviewTag !== tag) return;
    state.overviewTagFiles = data.entries || [];
  } catch (e) {
    if (state.overviewTag === tag) {
      state.overviewTagFiles = [];
      alert(e.message || String(e));
    }
  } finally {
    if (state.overviewTag === tag) {
      state.overviewTagLoading = false;
      await withViewTransition(() => render());
    }
  }
}

function withViewTransition(update) {
  if (typeof document.startViewTransition === "function") {
    return document.startViewTransition(() => { update(); }).finished.catch(() => {});
  }
  update();
  return Promise.resolve();
}

async function loadOverviewEntityMatches(entity, entityType) {
  if (
    state.overviewEntity
    && state.overviewEntity.entity === entity
    && (state.overviewEntity.entity_type || null) === (entityType || null)
  ) {
    await withViewTransition(() => {
      clearOverviewEntity();
      render();
    });
    return;
  }
  clearOverviewTag();
  state.overviewEntity = { entity, entity_type: entityType || null };
  state.overviewEntityFiles = [];
  state.overviewEntityLoading = true;
  state.entityDocPage = 1;
  state.overviewDocPath = null;
  state.overviewDoc = null;
  render();
  try {
    const params = new URLSearchParams({ case_id: String(state.caseId), entity });
    if (entityType) params.set("entity_type", entityType);
    const data = await api(`/api/files/by-facet?${params}`);
    if (
      state.overviewEntity?.entity !== entity
      || (state.overviewEntity?.entity_type || null) !== (entityType || null)
    ) return;
    state.overviewEntityFiles = data.entries || [];
  } catch (e) {
    if (state.overviewEntity?.entity === entity) {
      state.overviewEntityFiles = [];
      alert(e.message || String(e));
    }
  } finally {
    if (state.overviewEntity?.entity === entity) {
      state.overviewEntityLoading = false;
      await withViewTransition(() => render());
    }
  }
}

function renderOverviewPreview(doc) {
  if (!doc) {
    return `<div class="ap-empty">Select a file to preview it here.</div>`;
  }
  if (doc.kind === "pdf" && doc.raw_url) {
    return `<iframe class="preview-frame" src="${esc(pdfEmbedUrl(doc.raw_url))}" title="${esc(doc.name)}"></iframe>`;
  }
  if (doc.kind === "image" && doc.raw_url) {
    return `<img class="preview-img" src="${esc(doc.raw_url)}" alt="${esc(doc.name)}"/>`;
  }
  if ((doc.kind === "video" || doc.kind === "audio") && doc.raw_url) {
    const tag = doc.kind === "video" ? "video" : "audio";
    return `<${tag} class="preview-frame" controls src="${esc(doc.raw_url)}"></${tag}>`;
  }
  if (doc.text) {
    return `<div class="panel-card" style="margin:12px;border:0;box-shadow:none"><pre class="text-body">${esc(doc.text.slice(0, 8000))}${doc.text.length > 8000 ? "\n…" : ""}</pre></div>`;
  }
  return `<div class="ap-empty">No on-screen preview for this file type.</div>`;
}

function renderOverview() {
  const s = state.overview?.summary || {};
  const e = state.overview?.entities || {};
  const manifest = state.overview?.manifest || [];
  const unprocessed = manifest.filter(r => !r.processed);
  const lowConfidence = manifest.filter(isLowConfidence);
  const filter = state.manifestFilter === "low_confidence" ? "low_confidence" : "unprocessed";
  const fullRows = filter === "low_confidence" ? lowConfidence : unprocessed;
  const pageSize = 20;
  const totalPages = Math.max(1, Math.ceil(fullRows.length / pageSize) || 1);
  const page = Math.min(Math.max(1, state.manifestPage || 1), totalPages);
  state.manifestPage = page;
  const start = (page - 1) * pageSize;
  const shown = fullRows.slice(start, start + pageSize);

  const typeRows = e.by_type || [];
  let browseType = state.entityBrowseType;
  if ((!browseType || !typeRows.some(t => t.type === browseType)) && typeRows.length) {
    browseType = typeRows[0].type;
    state.entityBrowseType = browseType;
  }
  const typedEntities = browseType
    ? ((e.entities_by_type && e.entities_by_type[browseType]) || (e.top_entities || []).filter(x => x.type === browseType))
    : [];
  const entityPageSize = 10;
  const typeTotalPages = Math.max(1, Math.ceil(typeRows.length / entityPageSize) || 1);
  const typePage = Math.min(Math.max(1, state.entityTypePage || 1), typeTotalPages);
  state.entityTypePage = typePage;
  const typeStart = (typePage - 1) * entityPageSize;
  const shownTypes = typeRows.slice(typeStart, typeStart + entityPageSize);
  const nameTotalPages = Math.max(1, Math.ceil(typedEntities.length / entityPageSize) || 1);
  const namePage = Math.min(Math.max(1, state.entityNamePage || 1), nameTotalPages);
  state.entityNamePage = namePage;
  const nameStart = (namePage - 1) * entityPageSize;
  const shownEntities = typedEntities.slice(nameStart, nameStart + entityPageSize);

  const typeUniqueCount = (t) => {
    // Prefer unique-name count; older APIs used mention totals as `count`.
    if (t && t.mentions != null) return t.count;
    const bucket = e.entities_by_type && e.entities_by_type[t.type];
    return bucket ? bucket.length : (t.count || 0);
  };

  const typeCol = typeRows.length
    ? shownTypes.map(t => `
        <li>
          <button type="button" class="entity-col-item ${t.type === browseType ? "active" : ""}" data-browse-type="${esc(t.type)}">
            <span class="label">${esc(prettyType(t.type))}</span>
            <span class="n">${fmtNum(typeUniqueCount(t))}</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </li>`).join("")
    : `<li class="entity-col-empty">No categories yet.</li>`;
  const typePager = typeRows.length > entityPageSize
    ? `<div class="entity-col-foot">
        <span>${fmtNum(typeStart + 1)}–${fmtNum(typeStart + shownTypes.length)} of ${fmtNum(typeRows.length)}</span>
        <div class="manifest-pager">
          <button type="button" class="ghost" data-entity-type-page="prev" ${typePage <= 1 ? "disabled" : ""}>Prev</button>
          <span>${fmtNum(typePage)} / ${fmtNum(typeTotalPages)}</span>
          <button type="button" class="ghost" data-entity-type-page="next" ${typePage >= typeTotalPages ? "disabled" : ""}>Next</button>
        </div>
      </div>`
    : "";

  const selectedEntity = state.overviewEntity;
  const nameCol = browseType
    ? (typedEntities.length
      ? shownEntities.map(row => {
          const active = selectedEntity
            && selectedEntity.entity === row.canonical
            && (selectedEntity.entity_type || null) === (row.type || null);
          return `
          <li>
            <button type="button" class="entity-col-item ${active ? "active" : ""}" data-entity="${esc(row.canonical)}" data-entity-type="${esc(row.type)}" title="${esc(row.canonical)}">
              <span class="label">${esc(row.canonical)}</span>
              <span class="n">${fmtNum(row.count)}</span>
            </button>
          </li>`;
        }).join("")
      : `<li class="entity-col-empty">No names in this category.</li>`)
    : `<li class="entity-col-empty">Select a category.</li>`;
  const namePager = typedEntities.length > entityPageSize
    ? `<div class="entity-col-foot">
        <span>${fmtNum(nameStart + 1)}–${fmtNum(nameStart + shownEntities.length)} of ${fmtNum(typedEntities.length)}</span>
        <div class="manifest-pager">
          <button type="button" class="ghost" data-entity-name-page="prev" ${namePage <= 1 ? "disabled" : ""}>Prev</button>
          <span>${fmtNum(namePage)} / ${fmtNum(nameTotalPages)}</span>
          <button type="button" class="ghost" data-entity-name-page="next" ${namePage >= nameTotalPages ? "disabled" : ""}>Next</button>
        </div>
      </div>`
    : "";

  const entityFiles = state.overviewEntityFiles || [];
  const entityDocPath = state.overviewFocus === "entities" ? state.overviewDocPath : null;
  const docTotalPages = Math.max(1, Math.ceil(entityFiles.length / entityPageSize) || 1);
  const docPage = Math.min(Math.max(1, state.entityDocPage || 1), docTotalPages);
  state.entityDocPage = docPage;
  const docStart = (docPage - 1) * entityPageSize;
  const shownDocs = entityFiles.slice(docStart, docStart + entityPageSize);
  const docsList = selectedEntity
    ? (state.overviewEntityLoading
      ? `<li class="entity-col-empty">Loading…</li>`
      : (entityFiles.length
        ? shownDocs.map(f => {
            const path = f.rel_path || f.path || "";
            const active = path === entityDocPath;
            return `
            <li>
              <button type="button" class="entity-col-item ${active ? "active" : ""}" data-entity-doc="${esc(path)}" title="${esc(path)}">
                <span class="label">${esc(f.name || path.split("/").pop() || path)}</span>
                <span class="n">${fmtSize(f.size)}</span>
              </button>
            </li>`;
          }).join("")
        : `<li class="entity-col-empty">No matching documents.</li>`))
    : "";
  const docsPager = selectedEntity && !state.overviewEntityLoading && entityFiles.length > entityPageSize
    ? `<div class="entity-col-foot">
        <span>${fmtNum(docStart + 1)}–${fmtNum(docStart + shownDocs.length)} of ${fmtNum(entityFiles.length)}</span>
        <div class="manifest-pager">
          <button type="button" class="ghost" data-entity-doc-page="prev" ${docPage <= 1 ? "disabled" : ""}>Prev</button>
          <span>${fmtNum(docPage)} / ${fmtNum(docTotalPages)}</span>
          <button type="button" class="ghost" data-entity-doc-page="next" ${docPage >= docTotalPages ? "disabled" : ""}>Next</button>
        </div>
      </div>`
    : "";

  let entityDrill = "";
  if (selectedEntity && entityDocPath) {
    const previewDoc = state.overviewDoc
      ? withOverviewUrls(state.overviewDoc, entityDocPath)
      : withOverviewUrls({}, entityDocPath);
    const catLabel = browseType ? prettyType(browseType) : "Category";
    entityDrill = `
      <div class="entity-stage">
        <div class="entity-split">
          <div class="entity-docs-pane">
            <div class="entity-toolbar">
              <button type="button" class="entity-back-btn" data-entity-back="docs" aria-label="Back to entity browser">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                Back
              </button>
              <div class="entity-context">${esc(catLabel)} · <strong>${esc(selectedEntity.entity)}</strong></div>
            </div>
            <ul class="entity-col-list">${docsList}</ul>
            ${docsPager}
          </div>
          <aside class="attention-preview">
            <div class="ap-head">
              <div class="ap-head-text">
                ${esc(previewDoc?.name || entityDocPath.split("/").pop() || "Preview")}
                <div class="meta">${esc(previewDoc?.rel_path || entityDocPath)}</div>
              </div>
              <div class="ap-actions">${fileActionIcons(previewDoc)}</div>
            </div>
            <div class="ap-body">${renderOverviewPreview(state.overviewDoc ? previewDoc : null)}</div>
          </aside>
        </div>
      </div>`;
  } else {
    const docsCol = selectedEntity ? `
      <div class="entity-col">
        <div class="entity-col-head">Documents</div>
        <ul class="entity-col-list">${docsList}</ul>
        ${docsPager}
      </div>` : "";
    entityDrill = `
      <div class="entity-stage">
        <div class="entity-cols ${selectedEntity ? "has-docs" : ""}" role="group" aria-label="Entity browser">
          <div class="entity-col">
            <div class="entity-col-head">Category</div>
            <ul class="entity-col-list">${typeCol}</ul>
            ${typePager}
          </div>
          <div class="entity-col">
            <div class="entity-col-head">${browseType ? esc(prettyType(browseType)) : "Names"}</div>
            <ul class="entity-col-list">${nameCol}</ul>
            ${namePager}
          </div>
          ${docsCol}
        </div>
      </div>`;
  }

  // Tags: alphabetical list + letter jumplist + docs column + preview
  const tagPageSize = 10;
  const tagInitial = (t) => {
    const ch = String(prettyLabel(t.tag) || t.tag || "").trim().charAt(0).toUpperCase();
    return ch >= "A" && ch <= "Z" ? ch : "#";
  };
  const allTags = [...(e.top_tags || [])].sort((a, b) =>
    String(prettyLabel(a.tag) || a.tag).localeCompare(String(prettyLabel(b.tag) || b.tag), undefined, { sensitivity: "base" })
  );
  const tagLetterCounts = {};
  allTags.forEach(t => {
    const L = tagInitial(t);
    tagLetterCounts[L] = (tagLetterCounts[L] || 0) + 1;
  });
  if (state.tagLetter && !tagLetterCounts[state.tagLetter]) state.tagLetter = null;
  const filteredTags = state.tagLetter
    ? allTags.filter(t => tagInitial(t) === state.tagLetter)
    : allTags;
  const tagTotalPages = Math.max(1, Math.ceil(filteredTags.length / tagPageSize) || 1);
  const tagPage = Math.min(Math.max(1, state.tagPage || 1), tagTotalPages);
  state.tagPage = tagPage;
  const tagStart = (tagPage - 1) * tagPageSize;
  const shownTags = filteredTags.slice(tagStart, tagStart + tagPageSize);
  const selectedTag = state.overviewFocus === "tags" ? state.overviewTag : null;
  const alphaLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const tagAlpha = `
    <div class="tag-alpha" role="navigation" aria-label="Jump by letter">
      <button type="button" class="tag-alpha-all ${!state.tagLetter ? "active" : ""}" data-tag-letter="">All</button>
      ${alphaLetters.map(L => `
        <button type="button" class="${state.tagLetter === L ? "active" : ""}" data-tag-letter="${L}"
          ${tagLetterCounts[L] ? "" : "disabled"} title="${tagLetterCounts[L] ? `${tagLetterCounts[L]} tag(s)` : "No tags"}">${L}</button>
      `).join("")}
      <button type="button" class="${state.tagLetter === "#" ? "active" : ""}" data-tag-letter="#"
        ${tagLetterCounts["#"] ? "" : "disabled"} title="${tagLetterCounts["#"] ? `${tagLetterCounts["#"]} tag(s)` : "No tags"}">#</button>
    </div>`;
  const tagCol = filteredTags.length
    ? shownTags.map(t => `
        <li>
          <button type="button" class="entity-col-item ${selectedTag === t.tag ? "active" : ""}" data-overview-tag="${esc(t.tag)}" title="${esc(t.tag)}">
            <span class="label">${esc(prettyLabel(t.tag))}</span>
            <span class="n">${fmtNum(t.count)}</span>
          </button>
        </li>`).join("")
    : `<li class="entity-col-empty">${allTags.length ? "No tags for this letter." : "No tags yet."}</li>`;
  const tagPager = filteredTags.length > tagPageSize
    ? `<div class="entity-col-foot">
        <span>${state.tagLetter ? esc(state.tagLetter) + " · " : ""}${fmtNum(tagStart + 1)}–${fmtNum(tagStart + shownTags.length)} of ${fmtNum(filteredTags.length)}</span>
        <div class="manifest-pager">
          <button type="button" class="ghost" data-tag-page="prev" ${tagPage <= 1 ? "disabled" : ""}>Prev</button>
          <span>${fmtNum(tagPage)} / ${fmtNum(tagTotalPages)}</span>
          <button type="button" class="ghost" data-tag-page="next" ${tagPage >= tagTotalPages ? "disabled" : ""}>Next</button>
        </div>
      </div>`
    : (filteredTags.length
      ? `<div class="entity-col-foot"><span>${state.tagLetter ? esc(state.tagLetter) + " · " : ""}${fmtNum(filteredTags.length)} tag${filteredTags.length === 1 ? "" : "s"}</span></div>`
      : "");

  const tagFiles = state.overviewTagFiles || [];
  const tagDocPath = state.overviewFocus === "tags" ? state.overviewDocPath : null;
  const tagDocTotalPages = Math.max(1, Math.ceil(tagFiles.length / tagPageSize) || 1);
  const tagDocPage = Math.min(Math.max(1, state.tagDocPage || 1), tagDocTotalPages);
  state.tagDocPage = tagDocPage;
  const tagDocStart = (tagDocPage - 1) * tagPageSize;
  const shownTagDocs = tagFiles.slice(tagDocStart, tagDocStart + tagPageSize);
  const tagDocsList = selectedTag
    ? (state.overviewTagLoading
      ? `<li class="entity-col-empty">Loading…</li>`
      : (tagFiles.length
        ? shownTagDocs.map(f => {
            const path = f.rel_path || f.path || "";
            const active = path === tagDocPath;
            return `
            <li>
              <button type="button" class="entity-col-item ${active ? "active" : ""}" data-tag-doc="${esc(path)}" title="${esc(path)}">
                <span class="label">${esc(f.name || path.split("/").pop() || path)}</span>
                <span class="n">${fmtSize(f.size)}</span>
              </button>
            </li>`;
          }).join("")
        : `<li class="entity-col-empty">No matching documents.</li>`))
    : "";
  const tagDocsPager = selectedTag && !state.overviewTagLoading && tagFiles.length > tagPageSize
    ? `<div class="entity-col-foot">
        <span>${fmtNum(tagDocStart + 1)}–${fmtNum(tagDocStart + shownTagDocs.length)} of ${fmtNum(tagFiles.length)}</span>
        <div class="manifest-pager">
          <button type="button" class="ghost" data-tag-doc-page="prev" ${tagDocPage <= 1 ? "disabled" : ""}>Prev</button>
          <span>${fmtNum(tagDocPage)} / ${fmtNum(tagDocTotalPages)}</span>
          <button type="button" class="ghost" data-tag-doc-page="next" ${tagDocPage >= tagDocTotalPages ? "disabled" : ""}>Next</button>
        </div>
      </div>`
    : "";

  let tagDrill = "";
  if (selectedTag && tagDocPath) {
    const previewDoc = state.overviewDoc
      ? withOverviewUrls(state.overviewDoc, tagDocPath)
      : withOverviewUrls({}, tagDocPath);
    tagDrill = `
      <div class="entity-stage">
        <div class="entity-split">
          <div class="entity-docs-pane">
            <div class="entity-toolbar">
              <button type="button" class="entity-back-btn" data-tag-back="docs" aria-label="Back to tags">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                Back
              </button>
              <div class="entity-context">Tag · <strong>${esc(prettyLabel(selectedTag))}</strong></div>
            </div>
            <ul class="entity-col-list">${tagDocsList}</ul>
            ${tagDocsPager}
          </div>
          <aside class="attention-preview">
            <div class="ap-head">
              <div class="ap-head-text">
                ${esc(previewDoc?.name || tagDocPath.split("/").pop() || "Preview")}
                <div class="meta">${esc(previewDoc?.rel_path || tagDocPath)}</div>
              </div>
              <div class="ap-actions">${fileActionIcons(previewDoc)}</div>
            </div>
            <div class="ap-body">${renderOverviewPreview(state.overviewDoc ? previewDoc : null)}</div>
          </aside>
        </div>
      </div>`;
  } else {
    const tagDocsCol = selectedTag ? `
      <div class="entity-col">
        <div class="entity-col-head">Documents</div>
        <ul class="entity-col-list">${tagDocsList}</ul>
        ${tagDocsPager}
      </div>` : "";
    tagDrill = `
      <div class="entity-stage">
        <div class="entity-cols ${selectedTag ? "has-docs-2" : "tags-only"}" role="group" aria-label="Tag browser">
          <div class="entity-col">
            <div class="entity-col-head">Tags A–Z</div>
            ${tagAlpha}
            <ul class="entity-col-list">${tagCol}</ul>
            ${tagPager}
          </div>
          ${tagDocsCol}
        </div>
      </div>`;
  }

  const emptyMsg = filter === "low_confidence"
    ? "No low confidence files."
    : "All files in this production are processed.";

  const showNotes = filter !== "low_confidence";
  const showStatus = filter !== "low_confidence";
  const colCount = 3 + (showStatus ? 1 : 0) + (showNotes ? 1 : 0);
  const selectedPath = state.overviewDocPath;
  const manifestRows = shown.map(r => {
    const unmet = !r.processed;
    const low = isLowConfidence(r);
    const active = r.rel_path === selectedPath;
    const flag = [unmet || low ? "flag-unprocessed" : "", active ? "active" : ""].filter(Boolean).join(" ");
    let note = r.error || r.quality_reasons || "";
    if (!note && unmet) note = "Not processed";
    return `<tr class="${flag}" data-path="${esc(r.rel_path)}">
      <td class="file-cell" title="${esc(r.rel_path)}">
        <div class="file-main">
          ${unmet || low ? warnIcon() : ""}
          <span class="path-text">${esc(r.name || r.rel_path)}</span>
        </div>
      </td>
      <td>${esc(r.ext || "")}</td>
      ${showStatus ? `<td>${statusPill(r.ingest_status)}</td>` : ""}
      <td>${fmtSize(r.size)}</td>
      ${showNotes ? `<td class="meta">${esc(note)}</td>` : ""}
    </tr>`;
  }).join("") || `<tr><td colspan="${colCount}" class="placeholder">${emptyMsg}</td></tr>`;

  const rangeLabel = fullRows.length
    ? `Showing ${fmtNum(start + 1)}–${fmtNum(start + shown.length)} of ${fmtNum(fullRows.length)}`
    : "Showing 0";

  const pager = fullRows.length
    ? `<div class="manifest-pager">
        <button type="button" class="ghost" data-manifest-page="prev" ${page <= 1 ? "disabled" : ""}>Previous</button>
        <span>Page ${fmtNum(page)} of ${fmtNum(totalPages)}</span>
        <button type="button" class="ghost" data-manifest-page="next" ${page >= totalPages ? "disabled" : ""}>Next</button>
      </div>`
    : "";

  const attentionCount = unprocessed.length + lowConfidence.length;
  let focus = state.overviewFocus;
  if (focus === "phone_dumps" || focus === "csli_maps") {
    focus = "forensics";
    state.overviewFocus = "forensics";
  }
  const fileCount = s.file_count ?? manifest.length;
  const forensicsSecs = state.forensicsSummary?.sections || {};
  const phoneDumpCount = (forensicsSecs.cellebrite?.sources || []).length;
  const csliCount = (forensicsSecs.csli?.sources || []).length;

  const tiles = [
    {
      id: "files",
      label: "Files",
      value: fmtNum(fileCount),
      blurb: "Everything in this discovery production.",
      warn: false,
    },
    {
      id: "attention",
      label: "Needs attention",
      value: fmtNum(attentionCount),
      blurb: "Files Marshal could not fully read, or read poorly.",
      warn: attentionCount > 0,
    },
    {
      id: "entities",
      label: "Entities",
      value: fmtNum(e.unique_entities),
      blurb: "People, places, and other names found in the documents.",
      warn: false,
    },
    {
      id: "tags",
      label: "Tags",
      value: fmtNum(e.unique_tags),
      blurb: "Short labels on documents — click a tag to find matches.",
      warn: false,
    },
  ];
  const forensicsTotal = phoneDumpCount + csliCount;
  if (forensicsTotal > 0) {
    const bits = [];
    if (phoneDumpCount) bits.push(`${phoneDumpCount} phone dump${phoneDumpCount === 1 ? "" : "s"}`);
    if (csliCount) bits.push(`${csliCount} CSLI source${csliCount === 1 ? "" : "s"}`);
    tiles.push({
      id: "forensics",
      label: "Forensics",
      value: fmtNum(forensicsTotal),
      blurb: bits.join(" · ") || "Phone dumps and cell-site maps.",
      warn: false,
    });
  }

  let detail = "";
  if (focus === "files") {
    detail = `
      <div class="overview-detail" style="padding:12px">
        <div class="files-detail">
          <button type="button" class="files-detail-cta" data-open-explorer="1">
            <svg class="cta-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
            <span class="cta-label">Open Document Explorer</span>
          </button>
          <div class="files-detail-copy">
            <p>Browse the production by folder or category, and open individual documents.</p>
          </div>
        </div>
      </div>`;
  } else if (focus === "forensics") {
    const subs = [];
    if (phoneDumpCount > 0) {
      subs.push(`
        <button type="button" class="forensics-overview-sub phones" data-open-forensics="cellebrite">
          <div class="fos-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
          <div class="fos-title">Phone dumps</div>
          <div class="fos-meta">${fmtNum(phoneDumpCount)} Cellebrite extraction${phoneDumpCount === 1 ? "" : "s"} — pick a phone, then apps and chats.</div>
          <div class="fos-cta">Open phones →</div>
        </button>`);
    }
    if (csliCount > 0) {
      subs.push(`
        <button type="button" class="forensics-overview-sub csli" data-open-forensics="csli">
          <div class="fos-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V8"/><path d="M5 10l7-7 7 7"/><path d="M4 22h16"/><circle cx="12" cy="14" r="2"/></svg></div>
          <div class="fos-title">CSLI maps</div>
          <div class="fos-meta">${fmtNum(csliCount)} tower / location source${csliCount === 1 ? "" : "s"} — call pings and nearby cell sites.</div>
          <div class="fos-cta">Open map →</div>
        </button>`);
    }
    detail = `
      <div class="overview-detail" style="padding:12px">
        <div class="forensics-overview-subs">${subs.join("")}</div>
      </div>`;
  } else if (focus === "attention") {
    const previewDoc = state.overviewDoc;
    const showPreview = !!selectedPath;
    const listBlock = `
      <div class="attention-list">
        <div class="manifest-wrap" style="flex:1">
          <table class="manifest-table">
            <thead>
              <tr>
                <th>File</th><th>Ext</th>${showStatus ? "<th>Status</th>" : ""}<th>Size</th>${showNotes ? "<th>Notes</th>" : ""}
              </tr>
            </thead>
            <tbody>${manifestRows}</tbody>
          </table>
        </div>
        <div class="manifest-foot">
          <span>${esc(rangeLabel)}</span>
          ${pager}
        </div>
      </div>`;
    const previewDocFull = previewDoc
      ? withOverviewUrls(previewDoc, selectedPath || previewDoc.rel_path)
      : (selectedPath ? withOverviewUrls({}, selectedPath) : null);
    const previewBlock = showPreview ? `
      <aside class="attention-preview">
        <div class="ap-head">
          <div class="ap-head-text">
            ${esc(previewDocFull?.name || previewDocFull?.rel_path || selectedPath || "Preview")}
            <div class="meta">${esc(previewDocFull?.rel_path || selectedPath || "")}</div>
          </div>
          <div class="ap-actions">${fileActionIcons(previewDocFull)}</div>
        </div>
        <div class="ap-body">${renderOverviewPreview(previewDoc ? previewDocFull : null)}</div>
      </aside>` : "";
    detail = `
      <div class="overview-detail">
        <div class="filter-bar" style="margin-bottom:10px">
          <div class="seg" id="manifestSeg">
            <button type="button" data-mfilter="unprocessed" class="${filter === "unprocessed" ? "active" : ""}">
              Unprocessed (${fmtNum(unprocessed.length)})
            </button>
            <button type="button" data-mfilter="low_confidence" class="${filter === "low_confidence" ? "active" : ""}">
              Low confidence files (${fmtNum(lowConfidence.length)})
            </button>
          </div>
        </div>
        ${showPreview
          ? `<div class="attention-split">${listBlock}${previewBlock}</div>`
          : listBlock}
      </div>`;
  } else if (focus === "entities") {
    detail = `
      <div class="overview-detail">
        ${entityDrill}
      </div>`;
  } else if (focus === "tags") {
    detail = `
      <div class="overview-detail">
        ${tagDrill}
      </div>`;
  }

  return `
    <div class="overview">
      <div class="overview-intro">
        <h1>Case Overview</h1>
      </div>
      <div class="overview-tiles">
        ${tiles.map(t => `
          <button type="button" class="overview-tile ${t.warn ? "warn" : ""} ${focus === t.id ? "active" : ""}" data-overview-focus="${t.id}">
            <div class="tile-top">
              <div class="tile-label">${esc(t.label)}</div>
              <div class="tile-stat">
                <div class="tile-value">${esc(t.value)}</div>
              </div>
            </div>
            <p class="tile-blurb">${esc(t.blurb)}</p>
          </button>
        `).join("")}
      </div>
      ${detail}
    </div>
  `;
}

function explorerCanGoBack() {
  if (state.selectedPath) return true;
  if (state.browseMode === "categories" && state.category) return true;
  if (state.browseMode === "folders" && state.path) return true;
  return false;
}

/** Keep deep trails short: first + … + last two. */
function collapseTrailParts(parts) {
  if (parts.length <= 4) return parts;
  return [parts[0], { kind: "ellipsis" }, ...parts.slice(-2)];
}

function renderTrailParts(parts) {
  const out = [];
  collapseTrailParts(parts).forEach((p, i) => {
    if (i) out.push(`<span class="crumb-sep">/</span>`);
    if (p.kind === "ellipsis") {
      out.push(`<span class="crumb-ellipsis" title="Path truncated">…</span>`);
      return;
    }
    if (p.kind === "here") {
      out.push(`<span class="crumb-here" title="${esc(p.name)}">${esc(p.name)}</span>`);
      return;
    }
    if (p.kind === "cat") {
      out.push(`<a data-cat="" title="Categories">Categories</a>`);
      return;
    }
    if (p.kind === "cat-keep") {
      out.push(`<a data-cat-keep="${esc(p.id)}" title="${esc(p.name)}">${esc(p.name)}</a>`);
      return;
    }
    out.push(`<a data-path="${esc(p.path || "")}" title="${esc(p.name)}">${esc(p.name)}</a>`);
  });
  return out.join("");
}

function explorerTrailHtml() {
  if (state.facet || Array.isArray(state.hits)) return "";
  if (!explorerCanGoBack()) return "";

  const backBtn = `
    <button type="button" class="entity-back-btn" id="btnExplorerBack" title="Go back one level">
      ${facetBackChevron()}Back
    </button>`;
  const fileName = state.selectedPath
    ? ((state.doc && state.doc.name) || state.selectedPath.split("/").pop())
    : null;

  if (state.browseMode === "categories") {
    if (!state.category) {
      return `<div class="explorer-trail">${backBtn}</div>`;
    }
    const label = (state.breadcrumbs[0] && state.breadcrumbs[0].name) || prettyLabel(state.category);
    const parts = [{ kind: "cat" }];
    if (fileName) {
      parts.push({ kind: "cat-keep", id: state.category, name: label });
      parts.push({ kind: "here", name: fileName });
    } else {
      parts.push({ kind: "here", name: label });
    }
    return `
      <div class="explorer-trail">
        ${backBtn}
        <nav class="crumbs" aria-label="Category path">${renderTrailParts(parts)}</nav>
      </div>`;
  }

  const crumbs = state.breadcrumbs || [];
  if (!state.path && !crumbs.length) {
    return `<div class="explorer-trail">${backBtn}</div>`;
  }

  const parts = [{ kind: "link", name: "All files", path: "" }];
  crumbs.forEach((c, i) => {
    const isLastFolder = i === crumbs.length - 1;
    if (isLastFolder && !fileName) {
      parts.push({ kind: "here", name: c.name });
    } else {
      parts.push({ kind: "link", name: c.name, path: c.path || "" });
    }
  });
  if (fileName) parts.push({ kind: "here", name: fileName });

  return `
    <div class="explorer-trail">
      ${backBtn}
      <nav class="crumbs" aria-label="Folder path">${renderTrailParts(parts)}</nav>
    </div>`;
}

/** Step exactly one level: close doc → leave category → parent folder. */
function explorerGoBack() {
  const tab = state.tab || "preview";
  if (state.selectedPath) {
    navigate({
      name: "case", caseId: state.caseId, module: "explorer",
      browseMode: state.browseMode || "categories",
      category: state.browseMode === "categories" ? state.category : null,
      folder: state.browseMode === "folders" ? (state.path || "") : "",
      docPath: null, tab, facet: null,
    });
    return;
  }
  if (state.browseMode === "categories" && state.category) {
    navigate({
      name: "case", caseId: state.caseId, module: "explorer",
      browseMode: "categories", category: null, folder: "",
      docPath: null, tab, facet: null,
    });
    return;
  }
  if (state.browseMode === "folders" && state.path) {
    const parts = String(state.path).split("/").filter(Boolean);
    parts.pop();
    navigate({
      name: "case", caseId: state.caseId, module: "explorer",
      browseMode: "folders", folder: parts.join("/"), category: null,
      docPath: null, tab, facet: null,
    });
  }
}

function facetLabel() {
  const f = state.facet || {};
  const bits = [];
  if (f.tag) bits.push(`tag: ${prettyLabel(f.tag)}`);
  if (f.entity) bits.push(`entity: ${f.entity}`);
  if (f.entity_type && !f.entity) bits.push(`type: ${prettyType(f.entity_type)}`);
  else if (f.entity_type && f.entity) bits.push(`(${prettyType(f.entity_type)})`);
  return bits.join(" · ") || "filter";
}

function facetBannerHtml(count) {
  const f = state.facet || {};
  let kind = "Filter";
  let name = facetLabel();
  if (f.tag) {
    kind = "Tag";
    name = prettyLabel(f.tag);
  } else if (f.entity) {
    kind = prettyType(f.entity_type || "entity");
    name = f.entity;
  } else if (f.entity_type) {
    kind = "Type";
    name = prettyType(f.entity_type);
  }
  const backLabel = state.facetReturn?.docPath ? "Back" : "Browse";
  return `
    <div class="facet-banner">
      <button type="button" class="entity-back-btn" id="btnClearFacet" title="${esc(backLabel)}">
        ${facetBackChevron()}${esc(backLabel)}
      </button>
      <div class="facet-banner-copy">${esc(kind)} · <strong>${esc(name)}</strong></div>
      <span class="facet-banner-count">${fmtNum(count)} document${count === 1 ? "" : "s"}</span>
    </div>`;
}

function entityLabel(e) {
  if (typeof e === "string") return { type: "other", text: e };
  const text = e.canonical || e.text || e.value || e.name || e.mention || "";
  const aliases = Array.isArray(e.aliases) ? e.aliases.filter(a => a && a !== text) : [];
  return {
    type: e.type || e.label || "other",
    text: text || JSON.stringify(e),
    extra: e.note || e.context || e.snippet || (aliases.length ? "aka: " + aliases.join(", ") : ""),
  };
}

function renderDocTabs() {
  const doc = state.doc;
  if (!doc) {
    return `<div class="doc-empty">${state.facet ? "Select a matching file." : "Select a file to open the document viewer."}</div>`;
  }
  const tabs = [
    ["preview", "Preview"],
    ["text", "Text"],
    ["metadata", "Metadata"],
    ["entities", "Entities"],
    ["tags", "Tags"],
  ];
  const tabBtns = tabs.map(([id, label]) =>
    `<button type="button" class="tab ${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`
  ).join("");

  let body = "";
  const searching = !!(state.hits && state.searchQuery);
  const isMediaPreview = state.tab === "preview" && (
    (doc.kind === "pdf" || doc.kind === "image" || doc.kind === "video" || doc.kind === "audio") && doc.raw_url
  );
  if (state.tab === "preview") {
    const matchStrip = searching ? renderSearchMatchStrip(doc) : "";
    if (doc.kind === "pdf" && doc.raw_url) {
      body = `<div class="preview-stack">${matchStrip}<div class="preview-media"><iframe class="preview-frame" src="${esc(pdfEmbedUrl(doc.raw_url))}" title="${esc(doc.name)}"></iframe></div></div>`;
    } else if (doc.kind === "image" && doc.raw_url) {
      body = `<div class="preview-stack">${matchStrip}<div class="preview-media"><img class="preview-img" src="${esc(doc.raw_url)}" alt="${esc(doc.name)}"/></div></div>`;
    } else if ((doc.kind === "video" || doc.kind === "audio") && doc.raw_url) {
      const tag = doc.kind === "video" ? "video" : "audio";
      body = `<div class="preview-stack">${matchStrip}<div class="preview-media"><${tag} class="preview-frame" controls src="${esc(doc.raw_url)}"></${tag}></div></div>`;
    } else if (doc.text) {
      const q = searching ? state.searchQuery : "";
      body = `<div class="panel-card"><div class="doc-prose">${highlightSearchHtml(doc.text, q, 12000)}</div></div>`;
    } else if (doc.open_url || doc.raw_url) {
      body = `${matchStrip}<div class="panel-card">
        <p>${doc._not_ingested ? "File is on disk but not fully ingested yet." : "No inline preview for this type."}</p>
        <p>${doc.download_url ? `<a href="${esc(doc.download_url)}" download target="_blank" rel="noopener">Download</a>` : ""}</p>
        ${doc.error ? `<p class="err">${esc(doc.error)}</p>` : ""}
      </div>`;
    } else {
      body = `<div class="placeholder">Nothing to preview.</div>`;
    }
  } else if (state.tab === "text") {
    if (doc.text) {
      const q = state.hits ? state.searchQuery : "";
      body = `<div class="panel-card"><div class="doc-prose">${highlightSearchHtml(doc.text, q)}</div>
        <p class="meta" style="margin-top:12px">${doc.chunk_count || 0} chunk(s)</p></div>`;
    } else {
      body = `<div class="panel-card placeholder">No extracted text.</div>`;
    }
  } else if (state.tab === "metadata") {
    const rows = [
      ["Name", doc.name],
      ["Path", doc.rel_path],
      ["Bates", doc.bates],
      ["MIME", doc.mime],
      ["Size", fmtSize(doc.size)],
      ["Status", doc.status],
      ["Kind", doc.kind],
    ];
    if (doc.manifest) {
      rows.push(
        ["Ingest", doc.manifest.ingest_status],
        ["OCR conf.", doc.manifest.quality_score != null ? fmtConf(doc.manifest.quality_score) : null],
        ["Manifest kind", doc.manifest.kind],
        ["Source", doc.manifest.source],
      );
    }
    const metaObj = doc.meta || {};
    const skip = new Set(["entities", "tags"]);
    for (const [k, v] of Object.entries(metaObj)) {
      if (skip.has(k)) continue;
      const val = typeof v === "object" ? JSON.stringify(v, null, 2) : String(v ?? "");
      rows.push([k, val]);
    }
    body = `<div class="panel-card"><table class="meta-table">
      ${rows.filter(([, v]) => v != null && v !== "").map(([k, v]) =>
        `<tr><th>${esc(k)}</th><td><pre class="text-body" style="font-size:12px">${esc(v)}</pre></td></tr>`
      ).join("")}
    </table></div>`;
  } else if (state.tab === "entities") {
    const ents = (doc.entities || []).map(entityLabel);
    const entCounts = (doc.facet_counts && doc.facet_counts.entities) || {};
    if (!ents.length) {
      body = `<div class="panel-card placeholder">No entities extracted for this document.</div>`;
    } else {
      body = `<div class="panel-card"><div class="entity-list">
        ${ents.map(e => {
          const key = `${String(e.type || "other").toLowerCase()}::${e.text}`;
          const n = Number(entCounts[key] || 0);
          const countLabel = n > 0 ? `${fmtNum(n)} doc${n === 1 ? "" : "s"}` : "";
          return `<button type="button" class="entity-row" data-doc-facet-entity="${esc(e.text)}" data-doc-facet-type="${esc(e.type)}" title="Show all documents with this entity">
          <div class="entity-type">${esc(prettyType(e.type))}</div>
          <div class="entity-main">
            <div class="entity-name">${esc(e.text)}</div>
            ${e.extra ? `<div class="meta">${esc(e.extra)}</div>` : ""}
          </div>
          ${countLabel ? `<span class="facet-count">${esc(countLabel)}</span>` : `<span class="facet-count">—</span>`}
        </button>`;
        }).join("")}
      </div></div>`;
    }
  } else if (state.tab === "tags") {
    const tags = doc.tags || [];
    const tagCounts = (doc.facet_counts && doc.facet_counts.tags) || {};
    if (!tags.length) {
      body = `<div class="panel-card placeholder">No tags on this document.</div>`;
    } else {
      body = `<div class="panel-card"><div class="tag-list">
        ${tags.map(t => {
          const raw = typeof t === "string" ? t : (t.name || t.label || t.tag || JSON.stringify(t));
          const n = Number(tagCounts[raw] || tagCounts[String(raw).toLowerCase()] || 0);
          const countLabel = n > 0 ? fmtNum(n) : "—";
          return `<button type="button" class="tag-chip" data-doc-facet-tag="${esc(raw)}" title="Show all documents tagged “${esc(prettyLabel(raw))}”">
            <span>${esc(prettyLabel(raw))}</span>
            <span class="facet-count">${esc(countLabel)}</span>
          </button>`;
        }).join("")}
      </div></div>`;
    }
  }

  return `
    <div class="doc-head">
      <div class="doc-title-row">
        <div>
          <h1>${esc(doc.name)}</h1>
          ${doc.bates ? `<div class="bates">${esc(doc.bates)}</div>` : ""}
          <div class="meta">${esc(doc.rel_path)}</div>
        </div>
        <div class="doc-actions">
          ${fileActionIcons(doc)}
        </div>
      </div>
      <div class="tabs">${tabBtns}</div>
    </div>
    <div class="doc-body ${isMediaPreview ? "is-preview" : ""}">${body}</div>
  `;
}

function renderExplorer() {
  const searching = Array.isArray(state.hits);
  const showPreview = !!(state.selectedPath && state.doc);
  const listEntries = searching ? searchResultEntries() : (state.entries || []);

  const facetBanner = state.facet ? facetBannerHtml(listEntries.length) : "";

  const browseToggle = (state.facet || searching) ? "" : `
    <div class="explorer-browse">
      <div class="seg" id="browseSeg">
        <button type="button" data-browse="categories" class="${state.browseMode !== "folders" ? "active" : ""}">Categories</button>
        <button type="button" data-browse="folders" class="${state.browseMode === "folders" ? "active" : ""}">Native folders</button>
      </div>
    </div>`;

  const showClear = searching || !!(state.searchQuery && String(state.searchQuery).trim());
  const searchRow = state.facet ? "" : `
    <div class="explorer-search${searching ? " is-searching" : ""}">
      <button type="button" class="search-icon" id="btnSearch" title="Search" aria-label="Search">${searchIcon()}</button>
      <input id="q" type="search" placeholder="Search this case…" autocomplete="off" value="${esc(state.searchQuery || "")}"/>
      <button type="button" class="search-clear-btn" id="btnClearHits" title="Clear search" ${showClear ? "" : "hidden"}>Clear</button>
    </div>
    ${searching
      ? `<div class="search-result-meta">${fmtNum(listEntries.length)} result${listEntries.length === 1 ? "" : "s"}</div>`
      : ""}`;
  const trailRow = (!state.facet && !searching) ? explorerTrailHtml() : "";

  const emptyMsg = searching
    ? "No matching files."
    : (state.facet ? "No matching documents." : (state.browseMode === "categories" ? "No categorized documents." : "Empty folder."));

  const listHtml = listEntries.map((e) => {
    const p = e.path || e.rel_path || e.id;
    const typ = e.type || "file";
    if (typ === "category") {
      return `<li data-type="category" data-path="${esc(e.id || p)}">
        <div class="file-name">${esc(e.name)}</div>
        <div class="file-path">${fmtNum(e.count)} document(s)</div>
      </li>`;
    }
    if (typ === "dir") {
      return `<li data-type="dir" data-path="${esc(p)}">
        <div class="file-name">${esc(e.name)}</div>
        <div class="file-path">Folder</div>
      </li>`;
    }
    const sub = e.bates || e.rel_path || p || "";
    const snip = searching && e.snippet
      ? `<p class="file-snip">${highlightSearchHtml(String(e.snippet).slice(0, 220), state.searchQuery)}</p>`
      : "";
    return `<li class="${p === state.selectedPath ? "active" : ""}" data-type="file" data-path="${esc(p)}">
      <div class="file-name">${esc(e.name)}</div>
      ${sub ? `<div class="file-path">${esc(sub)}</div>` : ""}
      ${snip}
    </li>`;
  }).join("") || `<li class="placeholder">${emptyMsg}</li>`;

  return `
    <div class="explorer-stage">
      <div class="explorer ${showPreview ? "has-preview" : ""}">
        <div class="explorer-main">
          <div class="explorer-head">
            ${facetBanner}
            ${browseToggle}
            ${searchRow}
          </div>
          ${trailRow ? `<div class="explorer-nav">${trailRow}</div>` : ""}
          <div class="explorer-list">
            <ul class="file-list">${listHtml}</ul>
          </div>
        </div>
        ${showPreview ? `<section class="doc-pane" id="docPane">${renderDocTabs()}</section>` : ""}
      </div>
    </div>
  `;
}

function forensicsAppStats(chats, showEmpty) {
  const map = new Map();
  for (const c of chats || []) {
    const name = c.source || "Unknown";
    const msgs = Number(c.message_count || 0);
    if (!showEmpty && msgs <= 0) continue;
    const cur = map.get(name) || { name, threads: 0, messages: 0 };
    cur.threads += 1;
    cur.messages += msgs;
    map.set(name, cur);
  }
  return [...map.values()].sort((a, b) => b.threads - a.threads || a.name.localeCompare(b.name));
}

function forensicsChatTitle(c) {
  return (c && (c.title || (c.counterparties && c.counterparties[0]) || c.name)) || "Untitled chat";
}

function forensicsFmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso).slice(0, 16);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const sameYear = d.getFullYear() === now.getFullYear();
  return d.toLocaleDateString([], sameYear
    ? { month: "short", day: "numeric" }
    : { month: "short", day: "numeric", year: "numeric" });
}

function forensicsDayKey(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso).slice(0, 10);
  return d.toDateString();
}

function forensicsIsSent(msg, owners) {
  const st = String(msg?.status || "").toLowerCase();
  if (st === "sent" || st === "outgoing") return true;
  if (st === "read" || st === "unread" || st === "incoming" || st === "received") return false;
  const from = String(msg?.from || "");
  if (!from) return false;
  if (from === "Me" || from.startsWith("Me (")) return true;
  const own = owners || state.forensicsOwners || [];
  return own.some((o) => o && (from === o || from.includes(o) || o.includes(from)));
}

function forensicsFilteredChats() {
  const app = state.forensicsApp;
  const q = String(state.forensicsQuery || "").trim().toLowerCase();
  const showEmpty = !!state.forensicsShowEmpty;
  let list = (state.forensicsChats || []).filter((c) => {
    if (app && (c.source || "Unknown") !== app) return false;
    if (!showEmpty && !(Number(c.message_count) > 0)) return false;
    return true;
  });
  if (q) {
    list = list.filter((c) => {
      const hay = [
        forensicsChatTitle(c),
        c.name,
        c.source,
        ...(c.participants || []),
        ...(c.counterparties || []),
        c.preview || "",
      ].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  return list;
}

function renderForensics() {
  const summary = state.forensicsSummary || {};
  const sections = summary.sections || {};
  const showCellebrite = !!sections.cellebrite?.available;
  const showCsli = !!sections.csli?.available;
  const section = state.forensicsSection;
  const ufdrSources = sections.cellebrite?.sources || [];
  const csliSources = sections.csli?.sources || [];

  if (!section) {
    const cards = [];
    if (showCellebrite) {
      cards.push(`
        <button type="button" class="forensics-hero cellebrite" data-forensics-section="cellebrite">
          <div class="hero-ico">${icoHeroPhone()}</div>
          <h2 class="hero-title">Cellebrite</h2>
          <p class="hero-sub">Phone extractions &amp; chats</p>
          <div class="hero-meta">${fmtNum(ufdrSources.length)} phone${ufdrSources.length === 1 ? "" : "s"}</div>
        </button>`);
    }
    if (showCsli) {
      cards.push(`
        <button type="button" class="forensics-hero csli" data-forensics-section="csli">
          <div class="hero-ico">${icoHeroTower()}</div>
          <h2 class="hero-title">CSLI</h2>
          <p class="hero-sub">Call location movement by day</p>
          <div class="hero-meta">${fmtNum(csliSources.length)} source${csliSources.length === 1 ? "" : "s"}</div>
        </button>`);
    }
    if (!cards.length) {
      return `<div class="forensics"><div class="forensics-empty">No forensic sources in this case.</div></div>`;
    }
    return `<div class="forensics">
      <div class="forensics-landing">
        <div class="forensics-heroes">${cards.join("")}</div>
      </div>
    </div>`;
  }

  const backBar = `
    <div class="forensics-toolbar">
      <button type="button" class="forensics-back" data-forensics-section="">← Forensics</button>
      <strong style="color:var(--fg)">${section === "csli" ? "CSLI" : "Cellebrite"}</strong>
      ${state.forensicsErr ? `<span class="err">${esc(state.forensicsErr)}</span>` : ""}
    </div>`;

  if (section === "csli") {
    const mapData = state.forensicsCsliMap;
    const phones = mapData ? csliPhoneList(mapData) : [];
    const days = mapData ? csliDaysForPhone(mapData, state.csliPhone) : [];
    const dayEvents = mapData ? csliDayEvents() : [];
    const stops = csliMovementStops(dayEvents);
    const phoneOpts = phones.map((p) =>
      `<option value="${esc(p.phone)}" ${state.csliPhone === p.phone ? "selected" : ""}>${esc(csliPhoneLabel(p))} (${fmtNum(p.count)})</option>`
    ).join("");
    const activePhone = phones.find((p) => p.phone === state.csliPhone) || null;
    const phoneHead = csliPhoneDisplayName(state.csliPhone, activePhone?.name)
      || state.csliPhone
      || "Phone";
    const dayOpts = days.map((d) =>
      `<option value="${esc(d)}" ${state.csliDay === d ? "selected" : ""}>${esc(csliFmtDay(d))}</option>`
    ).join("");
    const spanLabel = stops.length
      ? `${csliFmtClock(stops[0].start)} – ${csliFmtClock(stops[stops.length - 1].end)}`
      : "";
    const activePois = csliActivePois();
    const timelineItems = [];
    stops.forEach((s, i) => {
      const inst = csliEventInstant(s.start);
      timelineItems.push({
        kind: "stop",
        sort: inst && !Number.isNaN(inst.getTime()) ? inst.getTime() : i,
        stop: s,
        num: i + 1,
      });
    });
    activePois.forEach((p, i) => {
      const inst = csliParseInZone(p.event_when, "America/New_York");
      timelineItems.push({
        kind: "pin",
        sort: inst && !Number.isNaN(inst.getTime()) ? inst.getTime() : (1e15 + i),
        pin: p,
      });
    });
    timelineItems.sort((a, b) => a.sort - b.sort || (a.kind === "pin" ? 1 : -1));
    const list = timelineItems.map((item) => {
      if (item.kind === "pin") {
        const p = item.pin;
        const active = String(state.csliSelectedPinId) === String(p.id);
        const clock = csliFmtPinClock(p);
        const loc = `${Number(p.lat).toFixed(5)}, ${Number(p.lon).toFixed(5)}`;
        const detail = [p.label, loc].filter(Boolean).join(" · ");
        return `<li class="is-pin${active ? " active" : ""}" data-csli-poi="${esc(p.id)}" data-csli-poi-lat="${esc(p.lat)}" data-csli-poi-lon="${esc(p.lon)}">
          <span class="cast-pin${p.kind === "user" ? " user" : ""}" title="Pin"></span>
          <div class="body">
            <div class="t">${esc(clock)}</div>
            <div class="s">${esc(detail)}</div>
          </div>
          <button type="button" class="case-rename-pen" data-csli-poi-edit="${esc(p.id)}" title="Edit pin" aria-label="Edit pin">${icoRenamePen()}</button>
        </li>`;
      }
      const s = item.stop;
      const active = String(s.id) === String(state.csliSelectedId);
      const clock = s.count > 1
        ? `${csliFmtClock(s.start)} – ${csliFmtClock(s.end)}`
        : csliFmtClock(s.start);
      const bw = csliSectorBeamwidth(s.beamwidth);
      const detail = [
        s.azimuth != null ? `Facing ${Math.round(s.azimuth)}°` : null,
        s.azimuth != null ? `~${Math.round(bw)}° wide` : null,
        s.count > 1 ? `${s.count} hits` : null,
      ].filter(Boolean).join(" · ");
      return `<li class="${active ? "active" : ""}" data-csli-event="${esc(s.id)}">
        <span class="cast-num">${item.num}</span>
        <div class="body">
          <div class="t">${esc(clock)}</div>
          <div class="s">${esc(detail || "Sector hit")}</div>
        </div>
      </li>`;
    }).join("") || `<li class="placeholder" style="display:block;padding:16px;color:var(--muted-strong)">${state.forensicsLoading ? "Loading…" : "No locations for this day."}</li>`;
    const timelineSub = [
      activePhone?.name ? state.csliPhone : null,
      csliFmtDay(state.csliDay) || null,
      csliTzLabel(),
      spanLabel || null,
      `${fmtNum(stops.length)} stop${stops.length === 1 ? "" : "s"}`,
      activePois.length ? `${fmtNum(activePois.length)} pin${activePois.length === 1 ? "" : "s"}` : null,
    ].filter(Boolean).join(" · ");
    return `<div class="forensics">
      <div class="forensics-toolbar">
        <button type="button" class="forensics-back" data-forensics-section="">← Forensics</button>
        <strong style="color:var(--fg)">CSLI</strong>
        ${state.forensicsErr ? `<span class="err">${esc(state.forensicsErr)}</span>` : ""}
      </div>
      <div class="forensics-body">
        ${mapData && (mapData.events || []).length
          ? `<div class="csli-map-host">
              <div class="csli-map-main">
                <div id="csliMap" class="csli-map${state.csliPoiAddMode ? " add-poi" : ""}"></div>
                <div class="csli-tools">
                  <div class="csli-tools-bar">
                    <select id="csliPhone" title="Phone" aria-label="Phone">${phoneOpts || `<option value="">No phones</option>`}</select>
                    <select id="csliDay" title="Date" aria-label="Date" ${days.length ? "" : "disabled"}>${dayOpts || `<option value="">No dates</option>`}</select>
                    <select id="csliTzMode" title="Timezone" aria-label="Timezone">
                      <option value="eastern" ${state.csliTzMode === "eastern" ? "selected" : ""}>ET</option>
                      <option value="utc" ${state.csliTzMode === "utc" ? "selected" : ""}>UTC</option>
                      <option value="source" ${state.csliTzMode === "source" ? "selected" : ""}>Raw</option>
                    </select>
                    <span class="tool-sep" aria-hidden="true"></span>
                    <button type="button" class="tool-btn ${state.csliPoiAddMode ? "active" : ""}" id="csliPoiAdd" title="Drop a pin on the map">
                      ${state.csliPoiAddMode ? "Click map…" : "Pin"}
                    </button>
                    ${state.popout
                      ? ""
                      : `<button type="button" class="open-icon-btn" id="csliPopOut" title="Pop out" aria-label="Pop out">${openIcon()}</button>`}
                  </div>
                  ${state.csliPoiAddMode ? `<div class="csli-tools-hint">Click the map to place a pin</div>` : ""}
                </div>
                <div class="csli-map-chip">
                  <span><span class="cone"></span>Sector used</span>
                  <span><span class="dot num">#</span>Order</span>
                  <span><span class="dot tower"></span>Tower</span>
                  <span><span class="poi"></span>Pin</span>
                </div>
              </div>
              <aside class="csli-timeline">
                <div class="csli-timeline-head">
                  <div class="title">
                    <span class="name">${esc(phoneHead)}</span>
                    ${state.csliPhone
                      ? `<button type="button" class="case-rename-pen" id="csliPhoneRename" title="Rename phone" aria-label="Rename phone">${icoRenamePen()}</button>`
                      : ""}
                  </div>
                  <span class="sub">${esc(timelineSub || "Sectors in time order")}</span>
                </div>
                <ul class="csli-timeline-list">${list}</ul>
              </aside>
            </div>`
          : `<div class="forensics-empty">${state.forensicsLoading ? "Building map…" : "No coordinates found in CSLI exports for this case."}</div>`}
      </div>
    </div>`;
  }

  const sources = ufdrSources;
  if (!sources.length) {
    return `<div class="forensics">${backBar}<div class="forensics-empty">No Cellebrite .ufdr packages found in this case.</div></div>`;
  }

  // Step 2: pick a phone / UFDR
  if (!state.forensicsUfdrPath) {
    const phones = sources.map((s) => {
      const label = String(s.name || "").replace(/\.ufdr$/i, "").replace(/[-_]+/g, " ");
      return `
        <button type="button" class="forensics-phone-card" data-forensics-phone="${esc(s.rel_path)}">
          <div class="pico">${icoHeroPhone()}</div>
          <div>
            <div class="pt">${esc(prettyLabel(label) || s.name)}</div>
            <div class="ps">${esc(s.name)} · ${fmtSize(s.size)}</div>
          </div>
        </button>`;
    }).join("");
    return `<div class="forensics">
      <div class="forensics-toolbar">
        <button type="button" class="forensics-back" data-forensics-section="">← Forensics</button>
        <strong style="color:var(--fg)">Cellebrite</strong>
        <span class="meta">Select a phone</span>
      </div>
      <div class="forensics-landing">
        <div class="forensics-phone-list">${phones}</div>
      </div>
    </div>`;
  }

  const activePhone = sources.find((s) => s.rel_path === state.forensicsUfdrPath) || sources[0];
  const phoneLabel = prettyLabel(String(activePhone?.name || "").replace(/\.ufdr$/i, "").replace(/[-_]+/g, " ")) || activePhone?.name || "Phone";

  const apps = forensicsAppStats(state.forensicsChats, state.forensicsShowEmpty);
  if (!state.forensicsApp && apps.length) state.forensicsApp = apps[0].name;
  const appList = apps.map((a) => `
    <li class="${a.name === state.forensicsApp ? "active" : ""}" data-forensics-app="${esc(a.name)}">
      <span class="count">${fmtNum(a.threads)}</span>
      <div class="t">${esc(a.name)}</div>
      <div class="s">${fmtNum(a.messages)} msgs</div>
    </li>`).join("") || `<li class="placeholder">No apps</li>`;

  const filtered = forensicsFilteredChats();
  const chatList = filtered.map((c) => {
    const title = forensicsChatTitle(c);
    const handle = c.handle ? String(c.handle) : "";
    const when = forensicsFmtWhen(c.last_activity);
    const preview = c.preview ? String(c.preview).replace(/\s+/g, " ").slice(0, 90) : "";
    const secondary = handle
      ? `${handle}${preview ? " · " + preview : ""}`
      : (preview || (Number(c.message_count) ? fmtNum(c.message_count) + " messages" : "No messages"));
    return `
    <li class="${String(c.id) === String(state.forensicsChatId) ? "active" : ""}" data-forensics-chat="${esc(c.id)}">
      <div class="t">${esc(title)}</div>
      <div class="s">${esc(secondary)}</div>
      <div class="row-meta"><span>${fmtNum(c.message_count || 0)} msgs</span><span>${esc(when)}</span></div>
    </li>`;
  }).join("") || `<li class="placeholder">${state.forensicsLoading ? "Parsing UFDR…" : "No conversations match."}</li>`;

  const owners = state.forensicsOwners || [];
  const activeTitle = state.forensicsChat
    ? forensicsChatTitle(state.forensicsChat)
    : "Conversation";
  const activeSub = state.forensicsChat
    ? [
        state.forensicsChat.source,
        state.forensicsChat.handle || null,
        (!state.forensicsChat.handle && (state.forensicsChat.counterparties || []).length)
          ? (state.forensicsChat.counterparties || []).slice(0, 4).join(", ")
          : null,
      ].filter(Boolean).join(" · ")
    : "";

  let thread = `<div class="forensics-empty">${state.forensicsLoading ? "Loading…" : "Select a conversation."}</div>`;
  if (state.forensicsChat) {
    const msgs = state.forensicsChat.messages || [];
    if (!msgs.length) {
      thread = `<div class="forensics-empty">No messages in this conversation.</div>`;
    } else {
      let lastDay = null;
      const parts = [];
      for (const m of msgs) {
        const day = forensicsDayKey(m.timestamp);
        if (day && day !== lastDay) {
          lastDay = day;
          const label = (() => {
            const d = new Date(m.timestamp);
            if (Number.isNaN(d.getTime())) return day;
            return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" });
          })();
          parts.push(`<div class="chat-day">${esc(label)}</div>`);
        }
        const sent = forensicsIsSent(m, owners);
        const who = m.from || (sent ? "Me" : "Unknown");
        const time = forensicsFmtWhen(m.timestamp);
        parts.push(`
          <div class="chat-bubble ${sent ? "sent" : "recv"}">
            <div class="meta">${esc(who)}${time ? " · " + esc(time) : ""}${m.status ? " · " + esc(m.status) : ""}</div>
            <div class="body">${esc(m.body || "")}</div>
          </div>`);
      }
      thread = parts.join("");
    }
  }

  const nonempty = (state.forensicsChats || []).filter((c) => Number(c.message_count) > 0).length;

  return `
    <div class="forensics">
      <div class="forensics-toolbar">
        <button type="button" class="forensics-back" id="forensicsBackPhones">← Phones</button>
        <strong style="color:var(--fg)">${esc(phoneLabel)}</strong>
        <input type="search" id="forensicsSearch" placeholder="Search name, number, preview…" value="${esc(state.forensicsQuery || "")}" />
        <label class="chk"><input type="checkbox" id="forensicsShowEmpty" ${state.forensicsShowEmpty ? "checked" : ""} /> Show empty threads</label>
        <span class="meta">${fmtNum(nonempty)} with messages · ${fmtNum((state.forensicsChats || []).length)} total</span>
        ${summary.ufedlib === false ? `<span class="err">Install ufedlib-py on the server to parse UFDRs.</span>` : ""}
        ${state.forensicsErr ? `<span class="err">${esc(state.forensicsErr)}</span>` : ""}
      </div>
      <div class="forensics-body">
        <div class="forensics-split">
          <div class="forensics-pane">
            <div class="forensics-pane-head"><strong>Apps</strong></div>
            <ul class="forensics-list forensics-apps">${state.forensicsLoading && !apps.length ? `<li class="placeholder">Parsing…</li>` : appList}</ul>
          </div>
          <div class="forensics-pane">
            <div class="forensics-pane-head">
              <strong>${esc(state.forensicsApp || "Conversations")}</strong>
              <span class="sub">${fmtNum(filtered.length)} thread${filtered.length === 1 ? "" : "s"}</span>
            </div>
            <ul class="forensics-list">${chatList}</ul>
          </div>
          <div class="forensics-pane">
            <div class="forensics-pane-head">
              <strong>${esc(activeTitle)}</strong>
              ${activeSub ? `<span class="sub">${esc(activeSub)}</span>` : ""}
            </div>
            <div class="chat-thread">${thread}</div>
          </div>
        </div>
      </div>
    </div>`;
}
