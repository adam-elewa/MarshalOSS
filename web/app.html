      <input id="csliPhoneRenameInput" type="text" autocomplete="off" placeholder="e.g. Gede" />
      <p class="pin-meta">Clears back to the number if left blank.</p>
      <p class="case-rename-status" id="csliPhoneRenameStatus" hidden></p>
    </div>
    <div class="case-rename-actions">
      <button type="button" class="ghost" data-csli-phone-rename-dismiss="1">Cancel</button>
      <button type="button" class="primary" id="csliPhoneRenameSave">Save</button>
    </div>
  </div>
</div>

<script>
const state = {
  route: { name: "home" },
  cases: [],
  active: null,
  caseId: null,
  caseMeta: null,
  module: "overview",
  overview: null,
  manifestFilter: "unprocessed", // unprocessed | low_confidence
  manifestPage: 1,
  entityBrowseType: null, // null = type list; string = drill into that type
  entityTypePage: 1,
  entityNamePage: 1,
  entityDocPage: 1,
  overviewEntity: null, // { entity, entity_type } selected in overview
  overviewEntityFiles: [],
  overviewEntityLoading: false,
  overviewTag: null, // tag string selected in overview
  overviewTagFiles: [],
  overviewTagLoading: false,
  tagPage: 1,
  tagDocPage: 1,
  tagLetter: null, // null = all | "A".."Z" | "#"
  overviewFocus: "files", // null | attention | entities | tags | files | forensics
  overviewDocPath: null,
  overviewDoc: null,
  overviewOpen: {}, // section id -> bool; default collapsed
  browseMode: "categories", // categories | folders
  category: null, // category id when drilling in
  path: "",
  entries: [],
  breadcrumbs: [],
  selectedPath: null,
  doc: null,
  tab: "preview",
  hits: null,
  searchQuery: "",
  facet: null, // { tag?, entity?, entity_type? }
  facetReturn: null, // { docPath, tab, browseMode, category, path } when drilling from a doc
  notebookPages: [],
  notebookPath: "Home",
  notebookPage: null,
  notebookDraftTitle: "",
  notebookDraftBody: "",
  notebookDirty: false,
  notebookMode: "preview", // edit | preview
  notebookExpanded: {}, // path -> bool for tree twisties
  notebookDocPath: null, // discovery file open in side viewer
  notebookDoc: null,
  notebookDocTab: "preview",
  forensicsSummary: null, // from /api/forensics/summary
  forensicsSection: null, // null=landing | cellebrite | csli
  forensicsUfdrPath: null,
  forensicsChats: [],
  forensicsOwners: [],
  forensicsApp: null, // selected messaging app / source
  forensicsQuery: "",
  forensicsShowEmpty: false,
  forensicsChatId: null,
  forensicsChat: null,
  forensicsCsliMap: null,
  csliDay: null,
  csliPhone: null,
  csliSelectedId: null,
  csliSelectedPinId: null,
  csliTzMode: (typeof localStorage !== "undefined" && localStorage.getItem("marshaloss.csliTzMode")) || "eastern",
  csliPois: [], // user pins [{id,label,lat,lon,note,event_when}]
  csliPhoneLabels: {}, // { digits: displayName }
  csliPoiAddMode: false,
  csliPoiDraft: null, // {lat, lon} create, or {id, lat, lon, ...} edit
  popout: false, // fullscreen CSLI (or other) window without case chrome
  _csliMap: null,
  _csliPathLayer: null,
  _csliPoiLayer: null,
  forensicsLoading: false,
  forensicsErr: null,
  err: null,
};

function esc(s) {
  return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
/** Escape text and wrap query tokens in <mark class="search-hit">. */
function highlightSearchHtml(text, query, maxLen) {
  let raw = String(text || "");
  if (maxLen && raw.length > maxLen) raw = raw.slice(0, maxLen) + "\n…";
  const q = String(query || "").trim();
  if (!q) return esc(raw);
  const tokens = [...new Set(q.split(/\s+/).filter((t) => t.length > 1))].slice(0, 8);
  if (!tokens.length) return esc(raw);
  const re = new RegExp(
    "(" + tokens.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")",
    "gi"
  );
  let out = "";
  let last = 0;
  let m;
  while ((m = re.exec(raw)) !== null) {
    out += esc(raw.slice(last, m.index));
    out += `<mark class="search-hit">${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
    if (!m[0].length) re.lastIndex++;
  }
  out += esc(raw.slice(last));
  return out;
}
function searchResultEntries() {
  const seen = new Set();
  const out = [];
  for (const h of state.hits || []) {
    const p = h.rel_path;
    if (!p || seen.has(p)) continue;
    seen.add(p);
    out.push({
      type: "file",
      path: p,
      rel_path: p,
      name: h.name || p.split("/").pop(),
      bates: h.bates,
      snippet: h.snippet || h.text || "",
      size: h.size,
    });
  }
  return out;
}
function clearSearchResults() {
  state.hits = null;
  state.searchQuery = "";
  state.selectedPath = null;
  state.doc = null;
  render();
}
function extractMatchWindows(text, query, limit = 2) {
  const raw = String(text || "");
  const tokens = [...new Set(String(query || "").trim().split(/\s+/).filter((t) => t.length > 1))].slice(0, 8);
  if (!raw || !tokens.length) return [];
  const re = new RegExp(
    tokens.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"),
    "gi"
  );
  const out = [];
  let m;
  while ((m = re.exec(raw)) !== null && out.length < limit) {
    const start = Math.max(0, m.index - 90);
    const end = Math.min(raw.length, m.index + m[0].length + 90);
    let snip = raw.slice(start, end).replace(/\s+/g, " ").trim();
    if (start > 0) snip = "…" + snip;
    if (end < raw.length) snip += "…";
    out.push(snip);
    if (!m[0].length) re.lastIndex++;
  }
  return out;
}
function searchSnippetsForDoc(doc) {
  if (!doc || !state.searchQuery || !state.hits) return [];
  const path = doc.rel_path;
  const seen = new Set();
  const snips = [];
  for (const h of state.hits) {
    if (h.rel_path !== path) continue;
    const s = String(h.snippet || h.text || "").replace(/\s+/g, " ").trim();
    if (!s || seen.has(s)) continue;
    seen.add(s);
    snips.push(s);
    if (snips.length >= 3) break;
  }
  if (!snips.length && doc.text) {
    return extractMatchWindows(doc.text, state.searchQuery, 2);
  }
  return snips;
}
function renderSearchMatchStrip(doc) {
  const snips = searchSnippetsForDoc(doc);
  if (!snips.length) return "";
  return `<div class="search-match-strip">
    <div class="search-match-label">Match in document</div>
    ${snips.map((s) => `<p class="search-match-snip">${highlightSearchHtml(s, state.searchQuery)}</p>`).join("")}
  </div>`;
}
function fmtSize(n) {
  if (n == null || n === "") return "—";
  n = Number(n);
  if (!Number.isFinite(n)) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function fmtNum(n) {
  if (n == null) return "—";
  return Number(n).toLocaleString();
}
/** Viewer label: essex_county / New_Jersey → Essex County / New Jersey */
function prettyLabel(s) {
  return String(s ?? "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/\b([a-zA-Z])/g, (ch) => ch.toUpperCase());
}
function prettyType(s) {
  return prettyLabel(s);
}
function fmtConf(score) {
  if (score == null || score === "") return "—";
  const n = Number(score);
  if (!Number.isFinite(n)) return "—";
  return (n * 100).toFixed(0) + "%";
}
function confClass(score) {
  if (score == null || score === "") return "";
  const n = Number(score);
  if (n < 0.72) return "low";
  if (n >= 0.85) return "high";
  return "";
}
async function api(path, opts) {
  const init = opts ? { ...opts } : undefined;
  if (init?.body && !init.headers) {
    init.headers = { "Content-Type": "application/json" };
  } else if (init?.body && init.headers && !init.headers["Content-Type"]) {
    init.headers = { ...init.headers, "Content-Type": "application/json" };
  }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = data.detail;
    const msg = typeof detail === "string" ? detail
      : Array.isArray(detail) ? detail.map(d => d.msg || JSON.stringify(d)).join("; ")
      : (data.error || res.statusText);
    throw new Error(msg);
  }
  return data;
}

function parseHash() {
  const h = (location.hash || "#/").replace(/^#/, "") || "/";
  const [pathPart, queryPart] = h.split("?");
  const parts = pathPart.split("/").filter(Boolean);
  const qs = new URLSearchParams(queryPart || "");
  if (parts[0] === "cases" && parts[1]) {
    const caseId = Number(parts[1]);
    const docPath = qs.get("doc") || null;
    const tab = qs.get("tab") || "preview";
    const folder = qs.get("path") || "";
    const tag = qs.get("tag") || null;
    const entity = qs.get("entity") || null;
    const entity_type = qs.get("entity_type") || null;
    const browseMode = qs.get("browse") === "folders" ? "folders" : "categories";
    const category = qs.get("category") || null;
    const notebookPath = qs.get("page") || "Home";
    const view = qs.get("view") || "overview";
    const hasFacet = !!(tag || entity || entity_type);
    let module = "overview";
    if (view === "notebook") module = "notebook";
    else if (view === "bwc" || view === "bodycam") module = "bwc";
    else if (view === "forensics") module = "forensics";
    else if (view === "explorer" || docPath || folder || category || hasFacet) module = "explorer";
    const facet = hasFacet ? { tag, entity, entity_type } : null;
    const forensicsSection = qs.get("section") || null;
    const forensicsUfdr = qs.get("ufdr") || null;
    const forensicsChat = qs.get("chat") || null;
    const forensicsCsli = qs.get("csli") || null;
    const popout = qs.get("popout") === "1";
    const csliPhone = qs.get("phone") || null;
    const csliDay = qs.get("day") || null;
    const csliTz = qs.get("tz") || null;
    return {
      name: "case", caseId, module, docPath, tab, folder, facet, browseMode, category, notebookPath,
      forensicsSection, forensicsUfdr, forensicsChat, forensicsCsli,
      popout, csliPhone, csliDay, csliTz,
    };
  }
  return { name: "home" };
}

function setHash(route) {
  if (route.name === "home") {
    history.replaceState(null, "", "#/");
    return;
  }
  const qs = new URLSearchParams();
  qs.set("view", route.module || "overview");
  if (route.module === "explorer") {
    const browseMode = route.browseMode || "categories";
    if (browseMode === "folders") qs.set("browse", "folders");
    else qs.set("browse", "categories");
    if (browseMode === "folders" && route.folder) qs.set("path", route.folder);
    if (browseMode === "categories" && route.category) qs.set("category", route.category);
    if (route.docPath) qs.set("doc", route.docPath);
    if (route.tab && route.tab !== "preview") qs.set("tab", route.tab);
    if (route.facet?.tag) qs.set("tag", route.facet.tag);
    if (route.facet?.entity) qs.set("entity", route.facet.entity);
    if (route.facet?.entity_type) qs.set("entity_type", route.facet.entity_type);
  }
  if (route.module === "notebook") {
    qs.set("page", route.notebookPath || state.notebookPath || "Home");
  }
  if (route.module === "forensics") {
    if (route.forensicsSection) qs.set("section", route.forensicsSection);
    if (route.forensicsUfdr) qs.set("ufdr", route.forensicsUfdr);
    if (route.forensicsChat) qs.set("chat", route.forensicsChat);
    if (route.forensicsCsli) qs.set("csli", route.forensicsCsli);
    if (route.forensicsSection === "csli" || state.forensicsSection === "csli") {
      const phone = route.csliPhone || state.csliPhone;
      const day = route.csliDay || state.csliDay;
      const tz = route.csliTz || state.csliTzMode;
      if (phone) qs.set("phone", phone);
      if (day) qs.set("day", day);
      if (tz) qs.set("tz", tz);
    }
  }
  if (route.popout || state.popout) qs.set("popout", "1");
  history.replaceState(null, "", `#/cases/${route.caseId}?${qs.toString()}`);
}

function csliSyncHash() {
  if (state.module !== "forensics" || state.forensicsSection !== "csli" || !state.caseId) return;
  state.route = {
    ...(state.route || {}),
    name: "case",
    caseId: state.caseId,
    module: "forensics",
    forensicsSection: "csli",
    forensicsCsli: "1",
    popout: !!state.popout,
    csliPhone: state.csliPhone,
    csliDay: state.csliDay,
    csliTz: state.csliTzMode,
  };
  setHash(state.route);
}

function popOutCsli() {
  if (!state.caseId) return;
  const qs = new URLSearchParams({
    view: "forensics",
    section: "csli",
    csli: "1",
    popout: "1",
  });
  if (state.csliPhone) qs.set("phone", state.csliPhone);
  if (state.csliDay) qs.set("day", state.csliDay);
  if (state.csliTzMode) qs.set("tz", state.csliTzMode);
  const url = `${location.origin}${location.pathname}#/cases/${state.caseId}?${qs.toString()}`;
  window.open(url, `marshal-csli-${state.caseId}`, "noopener,noreferrer,width=1440,height=920");
}

function navigate(route) {
  state.route = route;
  setHash(route);
  render();
  loadForRoute();
}

async function loadForRoute() {
  state.err = null;
  try {
    if (state.route.name === "home") {
      const data = await api("/api/cases");
      state.cases = data.cases || [];
      state.active = data.active || null;
      state.doc = null;
      state.hits = null;
      state.overview = null;
      state.facet = null;
      render();
      return;
    }

    state.caseId = state.route.caseId;
    state.module = state.route.module || "overview";
    state.path = state.route.folder || "";
    state.tab = state.route.tab || "preview";
    state.selectedPath = state.route.docPath || null;
    state.facet = state.route.facet || null;
    state.browseMode = state.route.browseMode || "categories";
    state.category = state.route.category || null;
    state.notebookPath = state.route.notebookPath || state.notebookPath || "Home";
    state.forensicsSection = state.route.forensicsSection || null;
    state.forensicsUfdrPath = state.route.forensicsUfdr || state.forensicsUfdrPath || null;
    state.forensicsChatId = state.route.forensicsChat || state.forensicsChatId || null;
    state.forensicsCsliMap = state.forensicsCsliMap || null;
    state.popout = !!state.route.popout;
    if (state.route.csliTz && ["eastern", "utc", "source"].includes(state.route.csliTz)) {
      state.csliTzMode = state.route.csliTz;
      try { localStorage.setItem("marshaloss.csliTzMode", state.csliTzMode); } catch {}
    }
    if (state.route.csliPhone) state.csliPhone = state.route.csliPhone;
    if (state.route.csliDay) state.csliDay = state.route.csliDay;

    const casesData = await api("/api/cases");
    state.cases = casesData.cases || [];
    state.active = casesData.active || null;
    state.caseMeta = state.cases.find(c => c.id === state.caseId) || null;

    try {
      state.forensicsSummary = await api(`/api/forensics/summary?case_id=${state.caseId}`);
    } catch {
      state.forensicsSummary = null;
    }

    if (state.module === "overview") {
      const ov = await api(`/api/cases/${state.caseId}/overview`);
      state.overview = ov;
      if (!state.caseMeta) state.caseMeta = ov.case;
      state.doc = null;
      state.hits = null;
      state.searchQuery = "";
      render();
      return;
    }

    if (state.module === "notebook") {
      await loadNotebook(state.notebookPath, false);
      render();
      return;
    }

    if (state.module === "forensics") {
      await loadForensicsView(false);
      render();
      return;
    }

    // Browse / facet navigation exits search-results mode.
    state.hits = null;
    state.searchQuery = "";
    // Hard route loads don't keep the soft "back to doc" stack from facet drills.
    state.facetReturn = null;

    if (state.facet) {
      const params = new URLSearchParams({ case_id: String(state.caseId) });
      if (state.facet.tag) params.set("tag", state.facet.tag);
      if (state.facet.entity) params.set("entity", state.facet.entity);
      if (state.facet.entity_type) params.set("entity_type", state.facet.entity_type);
      const data = await api(`/api/files/by-facet?${params}`);
      state.entries = data.entries || [];
      state.breadcrumbs = [];
      if (!state.caseMeta) state.caseMeta = data.case;
    } else if (state.browseMode === "folders") {
      const dir = await api(`/api/files/list?case_id=${state.caseId}&path=${encodeURIComponent(state.path)}`);
      if (!state.caseMeta) state.caseMeta = dir.case || null;
      state.entries = dir.entries || [];
      state.breadcrumbs = dir.breadcrumbs || [];
      state.path = dir.path || state.path;
    } else {
      const params = new URLSearchParams({ case_id: String(state.caseId) });
      if (state.category) params.set("category", state.category);
      const data = await api(`/api/files/categories?${params}`);
      if (!state.caseMeta) state.caseMeta = data.case;
      state.entries = data.entries || [];
      state.breadcrumbs = state.category
        ? [{ name: data.category_label || state.category, path: state.category }]
        : [];
    }

    if (state.selectedPath) {
      await loadDoc(state.selectedPath, false);
    } else {
      state.doc = null;
    }
    render();
  } catch (e) {
    state.err = e.message || String(e);
    render();
  }
}

/** Clean full-frame PDF embed (hide Chrome/Edge thumbnail sidebar + toolbar). */
function pdfEmbedUrl(url) {
  if (!url) return url;
  const base = String(url).split("#")[0];
  return `${base}#toolbar=0&navpanes=0&scrollbar=0&view=FitH`;
}

function relativize(url) {
  if (!url) return url;
  try {
    const u = new URL(url, location.origin);
    return u.pathname + u.search;
  } catch {
    return url;
  }
}

async function loadDoc(relPath, push) {
  state.selectedPath = relPath;
  state.module = "explorer";
  const searching = !!(state.searchQuery && state.hits);
  if (push !== false) {
    state.route = {
      name: "case",
      caseId: state.caseId,
      module: "explorer",
      browseMode: state.browseMode || "categories",
      category: state.facet ? null : state.category,
      folder: state.facet || state.browseMode !== "folders" ? "" : state.path,
      docPath: relPath,
      tab: "preview",
      facet: state.facet,
    };
    setHash(state.route);
  }
  try {
    const data = await api(
      `/api/files/detail?case_id=${state.caseId}&path=${encodeURIComponent(relPath)}`
    );
    state.doc = data.file;
    state.doc.raw_url = relativize(state.doc.raw_url);
    state.doc.open_url = relativize(state.doc.open_url);
    state.doc.download_url = relativize(state.doc.download_url);
    if (searching) {
      state.tab = (!state.doc.text && state.doc.kind === "other" && !state.doc.raw_url)
        ? "metadata"
        : "preview";
    } else if (!state.route.tab || state.route.tab === "preview") {
      if (!state.doc.text && state.doc.kind === "other") state.tab = "metadata";
      else state.tab = "preview";
    } else {
      state.tab = state.route.tab;
    }
  } catch (e) {
    const pool = searching ? searchResultEntries() : state.entries;
    const entry = (pool || []).find(x => (x.path || x.rel_path) === relPath);
    state.doc = {
      name: entry?.name || relPath.split("/").pop(),
      rel_path: relPath,
      bates: entry?.bates || null,
      mime: entry?.mime || null,
      size: entry?.size,
      kind: "other",
      meta: {},
      entities: [],
      tags: [],
      text: "",
      chunks: [],
      chunk_count: 0,
      open_url: relativize(entry?.open_url),
      raw_url: relativize(entry?.raw_url || entry?.open_url),
      download_url: relativize(entry?.download_url),
      _not_ingested: true,
      error: e.message,
    };
    state.tab = "preview";
  }
  render();
}

async function runSearch() {
  const qEl = document.getElementById("q");
  const q = (qEl && qEl.value || "").trim();
  if (!q || !state.caseId) return;
  try {
    const data = await api(
      `/api/search?q=${encodeURIComponent(q)}&case_id=${state.caseId}&mode=hybrid`
    );
    state.searchQuery = q;
    state.hits = data.hits || [];
    state.selectedPath = null;
    state.doc = null;
    render();
  } catch (e) {
    state.err = e.message || String(e);
    render();
  }
}

function searchIcon() {
  // Heroicons outline magnifying-glass
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>`;
}

function setTab(tab) {
  state.tab = tab;
  state.route = { ...state.route, tab, module: "explorer", facet: state.facet };
  setHash(state.route);
  render();
}

function setModule(module) {
  navigate({
    name: "case",
    caseId: state.caseId,
    module,
    browseMode: state.browseMode || "categories",
    category: module === "explorer" && !state.facet ? state.category : null,
    folder: module === "explorer" && state.browseMode === "folders" && !state.facet ? (state.path || "") : "",
    docPath: module === "explorer" ? state.selectedPath : null,
    tab: state.tab || "preview",
    facet: module === "explorer" ? state.facet : null,
    notebookPath: module === "notebook" ? (state.notebookPath || "Home") : null,
    forensicsSection: null,
    forensicsUfdr: null,
    forensicsChat: null,
  });
  if (module === "forensics") {
    state.forensicsSection = null;
    state.forensicsChatId = null;
    state.forensicsChat = null;
    state.forensicsCsliMap = null;
    if (state._csliMap) {
      try { state._csliMap.remove(); } catch {}
      state._csliMap = null;
    }
  }
}

function openForensicsSection(section) {
  state.forensicsSection = section || null;
  state.forensicsUfdrPath = null;
  state.forensicsChatId = null;
  state.forensicsChat = null;
  state.forensicsApp = null;
  state.forensicsCsliMap = null;
  if (state._csliMap) {
    try { state._csliMap.remove(); } catch {}
    state._csliMap = null;
  }
  if (state._csliMapRo) {
    try { state._csliMapRo.disconnect(); } catch {}
    state._csliMapRo = null;
  }
  state._csliPathLayer = null;
  state._csliPoiLayer = null;
  state.csliPoiAddMode = false;
  navigate({
    name: "case",
    caseId: state.caseId,
    module: "forensics",
    forensicsSection: section || null,
    forensicsUfdr: null,
    forensicsChat: null,
  });
}

async function loadForensicsCsli(push) {
  state.forensicsLoading = true;
  render();
  try {
    state.forensicsCsliMap = await api(
      `/api/forensics/csli/map?case_id=${state.caseId}`
    );
    state.forensicsErr = null;
    initCsliTimeFilter(state.forensicsCsliMap);
    csliApplyPhoneLabels(state.forensicsCsliMap.phone_labels || {});
    csliApplyPinsFromServer(state.forensicsCsliMap.pins || []);
    await csliMigrateLocalPoisIfNeeded();
    // reload pins if migration added any
    if ((state.csliPois || []).length !== (state.forensicsCsliMap.pins || []).length) {
      const pinned = await api(`/api/forensics/map/pins?case_id=${state.caseId}`);
      csliApplyPinsFromServer(pinned.pins || []);
      state.forensicsCsliMap.pins = state.csliPois;
    }
  } catch (e) {
    state.forensicsErr = e.message || String(e);
    state.forensicsCsliMap = null;
  } finally {
    state.forensicsLoading = false;
  }
  if (push) {
    state.route = {
      ...state.route,
      module: "forensics",
      forensicsSection: "csli",
    };
    setHash(state.route);
  }
  render();
  mountCsliMap();
}

/** Display zone for unified clocks. Pins are always Eastern wall times. */
function csliDisplayZone() {
  const mode = state.csliTzMode || "eastern";
  if (mode === "utc") return "UTC";
  if (mode === "source") return null;
  return "America/New_York";
}

function csliTzLabel() {
  const mode = state.csliTzMode || "eastern";
  if (mode === "utc") return "UTC";
  if (mode === "source") return "Raw";
  return "ET";
}

function csliEventSourceTz(e) {
  const tagged = String(e?.source_tz || "").trim();
  if (tagged) return tagged;
  const c = String(e?.carrier || "").toUpperCase();
  if (c.includes("AT&T") || c === "ATT") return "UTC";
  return "America/New_York";
}

function csliParseWallParts(raw) {
  const s = String(raw || "").replace("T", " ").trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ ]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return null;
  return {
    y: Number(m[1]), mo: Number(m[2]), d: Number(m[3]),
    h: Number(m[4] || 0), mi: Number(m[5] || 0), s: Number(m[6] || 0),
  };
}

/** Interpret a wall-clock string in `timeZone` as a Date (UTC instant). */
function csliParseInZone(raw, timeZone) {
  const p = csliParseWallParts(raw);
  if (!p) return null;
  if (!timeZone || timeZone === "UTC") {
    return new Date(Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s));
  }
  const want = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23",
  });
  const read = (ms) => {
    const parts = Object.fromEntries(
      fmt.formatToParts(new Date(ms))
        .filter((x) => x.type !== "literal")
        .map((x) => [x.type, x.value])
    );
    return Date.UTC(
      Number(parts.year), Number(parts.month) - 1, Number(parts.day),
      Number(parts.hour), Number(parts.minute), Number(parts.second)
    );
  };
  let guess = want;
  for (let i = 0; i < 3; i++) {
    const shown = read(guess);
    guess -= (shown - want);
  }
  return new Date(guess);
}

function csliEventInstant(e) {
  const raw = e?.ts || e?.when || "";
  return csliParseInZone(raw, csliEventSourceTz(e));
}

function csliFormatParts(date, timeZone) {
  if (!date || Number.isNaN(date.getTime())) return null;
  const zone = timeZone || "UTC";
  return Object.fromEntries(
    new Intl.DateTimeFormat("en-US", {
      timeZone: zone,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hourCycle: "h23",
      timeZoneName: "short",
    }).formatToParts(date)
      .filter((x) => x.type !== "literal")
      .map((x) => [x.type, x.value])
  );
}

function csliEventDay(e) {
  const zone = csliDisplayZone();
  if (!zone) {
    const ts = String(e?.ts || e?.when || "");
    return ts.length >= 10 ? ts.slice(0, 10) : null;
  }
  const inst = csliEventInstant(e);
  const parts = csliFormatParts(inst, zone);
  if (!parts) return null;
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function csliFmt12(hour24, minute, second, withSeconds) {
  let h = Number(hour24);
  const mi = String(minute ?? "00").padStart(2, "0");
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  if (h === 0) h = 12;
  if (withSeconds) {
    const s = String(second ?? "00").padStart(2, "0");
    return `${h}:${mi}:${s} ${ampm}`;
  }
  return `${h}:${mi} ${ampm}`;
}

function csliFmtClock(e, opts) {
  const withSeconds = !!(opts && opts.withSeconds);
  const zone = csliDisplayZone();
  if (!zone) {
    const ts = String(e?.ts || e?.when || "");
    const m = ts.match(/\b(\d{1,2}):(\d{2})(?::(\d{2}))?\b/);
    if (!m) return ts || "—";
    return csliFmt12(m[1], m[2], m[3] || "00", withSeconds);
  }
  const parts = csliFormatParts(csliEventInstant(e), zone);
  if (!parts) return "—";
  return csliFmt12(parts.hour, parts.minute, parts.second, withSeconds);
}

/** Pin event_when is Eastern wall time — clock in the active display zone. */
function csliFmtPinClock(pin, opts) {
  const withSeconds = !!(opts && opts.withSeconds);
  const raw = pin?.event_when || "";
  const zone = csliDisplayZone();
  if (!zone) {
    const m = String(raw).match(/\b(\d{1,2}):(\d{2})(?::(\d{2}))?\b/);
    if (!m) return raw ? "All day" : "—";
    return csliFmt12(m[1], m[2], m[3] || "00", withSeconds);
  }
  const inst = csliParseInZone(raw, "America/New_York");
  if (!inst) return raw ? "All day" : "—";
  const parts = csliFormatParts(inst, zone);
  if (!parts) return "—";
  return csliFmt12(parts.hour, parts.minute, parts.second, withSeconds);
}

function csliFmtDay(day) {
  if (!day) return "";
  const m = String(day).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return day;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[Number(m[2]) - 1]} ${Number(m[3])}, ${m[1]}`;
}

function setCsliTzMode(mode) {
  const next = (mode === "utc" || mode === "source") ? mode : "eastern";
  state.csliTzMode = next;
  try { localStorage.setItem("marshaloss.csliTzMode", next); } catch {}
  // Remap selected day into the new zone's day list
  const days = csliDaysForPhone(state.forensicsCsliMap, state.csliPhone);
  if (!days.includes(state.csliDay)) state.csliDay = days[0] || null;
  state.csliSelectedId = null;
  state.csliSelectedPinId = null;
}

function csliPhoneList(data) {
  if (Array.isArray(data?.phones) && data.phones.length) {
    return data.phones.map((p) => ({
      phone: String(p.phone || "").trim(),
      count: Number(p.count) || 0,
      name: String(p.name || "").trim(),
      device: String(p.device || "").trim(),
      carrier: String(p.carrier || "").trim(),
      is_target: !!p.is_target,
    })).filter((p) => p.phone);
  }
  const byPhone = new Map();
  for (const e of (data?.events || [])) {
    const phone = String(e.phone || "").trim();
    if (!phone) continue;
    const cur = byPhone.get(phone);
    if (!cur) {
      byPhone.set(phone, {
        phone,
        count: 1,
        name: String(e.name || "").trim(),
        device: String(e.device || "").trim(),
        carrier: String(e.carrier || "").trim(),
      });
    } else {
      cur.count += 1;
      if (!cur.name && e.name) cur.name = String(e.name).trim();
      if (!cur.device && e.device) cur.device = String(e.device).trim();
      if (!cur.carrier && e.carrier) cur.carrier = String(e.carrier).trim();
    }
  }
  return [...byPhone.values()].sort((a, b) => b.count - a.count || a.phone.localeCompare(b.phone));
}

function csliDeviceUseful(device) {
  const d = String(device || "").trim();
  if (!d) return "";
  const low = d.toLowerCase();
  if (low.includes("unknown") || low.includes("undetermined")) return "";
  return d;
}

function csliPhoneAlias(phone) {
  const dig = csliPhoneDigits(phone);
  const labels = state.csliPhoneLabels || {};
  return (dig && labels[dig]) || labels[String(phone || "")] || "";
}

function csliPhoneDisplayName(phone, fallbackName) {
  return csliPhoneAlias(phone) || String(fallbackName || "").trim() || "";
}

function csliPhoneLabel(p) {
  if (!p) return "";
  const mark = p.is_target ? "★ " : "";
  const name = csliPhoneDisplayName(p.phone, p.name);
  if (name) return `${mark}${name} · ${p.phone}`;
  const device = csliDeviceUseful(p.device);
  if (device) return `${mark}${p.phone} · ${device}`;
  return `${mark}${p.phone}`;
}

function csliApplyPhoneLabels(labels) {
  const out = {};
  if (labels && typeof labels === "object") {
    for (const [k, v] of Object.entries(labels)) {
      const dig = csliPhoneDigits(k);
      const name = String(v || "").trim();
      if (dig && name) out[dig] = name;
    }
  }
  state.csliPhoneLabels = out;
}

function csliDaysForPhone(data, phone) {
  const days = new Set();
  for (const e of (data?.events || [])) {
    if (phone && String(e.phone || e.label || "").trim() !== phone) continue;
    const d = csliEventDay(e);
    if (d) days.add(d);
  }
  return [...days].sort();
}

function initCsliTimeFilter(data) {
  if (!data) return;
  const phones = csliPhoneList(data);
  const primary = String(data.primary_phone || "").trim();
  const preferred = phones.find((p) => p.phone === primary && p.count > 0)
    || phones.find((p) => p.is_target && p.count > 0)
    || phones.find((p) => p.count > 0)
    || phones[0];
  if (!state.csliPhone || !phones.some((p) => p.phone === state.csliPhone)) {
    state.csliPhone = preferred?.phone || null;
  }
  const days = csliDaysForPhone(data, state.csliPhone);
  if (!state.csliDay || !days.includes(state.csliDay)) {
    state.csliDay = days[0] || null;
  }
  state.csliSelectedId = null;
  state.csliSelectedPinId = null;
  csliSyncHash();
}

/** Pings for selected phone + day, chronological (display-zone day). */
function csliDayEvents() {
  const data = state.forensicsCsliMap;
  if (!data) return [];
  const day = state.csliDay;
  const phone = state.csliPhone;
  return (data.events || [])
    .filter((e) => {
      if (phone && String(e.phone || e.label || "").trim() !== phone) return false;
      if (day && csliEventDay(e) && csliEventDay(e) !== day) return false;
      return true;
    })
    .slice()
    .sort((a, b) => {
      const ia = csliEventInstant(a)?.getTime() ?? 0;
      const ib = csliEventInstant(b)?.getTime() ?? 0;
      if (ia !== ib) return ia - ib;
      return String(a.ts || a.when || "").localeCompare(String(b.ts || b.when || ""));
    });
}

/**
 * Collapse consecutive near-duplicate tower/sector hits into movement stops.
 * Key includes azimuth so a sector change at the same site stays distinct.
 */
function csliMovementStops(events) {
  const stops = [];
  for (const e of events) {
    const az = e.azimuth != null ? Math.round(Number(e.azimuth)) : "";
    const key = `${Number(e.lat).toFixed(4)}|${Number(e.lon).toFixed(4)}|${az}`;
    const prev = stops[stops.length - 1];
    if (prev && prev.key === key) {
      prev.count += 1;
      prev.end = e;
      prev.whenEnd = e.ts || e.when || prev.whenEnd;
      continue;
    }
    const beam = Number(e.beamwidth);
    stops.push({
      id: e.id,
      key,
      lat: e.lat,
      lon: e.lon,
      count: 1,
      start: e,
      end: e,
      whenStart: e.ts || e.when || "",
      whenEnd: e.ts || e.when || "",
      label: e.label || "",
      cell: e.cell || "",
      sector: e.sector || "",
      azimuth: e.azimuth != null ? Number(e.azimuth) : null,
      beamwidth: Number.isFinite(beam) && beam > 0 ? beam : null,
    });
  }
  return stops;
}

/** Destination point: bearing degrees clockwise from north, distance meters. */
function csliDestPoint(lat, lon, bearingDeg, distM) {
  const R = 6371000;
  const br = (bearingDeg * Math.PI) / 180;
  const φ1 = (lat * Math.PI) / 180;
  const λ1 = (lon * Math.PI) / 180;
  const δ = distM / R;
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(br));
  const λ2 = λ1 + Math.atan2(
    Math.sin(br) * Math.sin(δ) * Math.cos(φ1),
    Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2)
  );
  return [(φ2 * 180) / Math.PI, (((λ2 * 180) / Math.PI + 540) % 360) - 180];
}

/**
 * Sector wedge: tower at apex, azimuth ± beamwidth/2.
 * Missing/-1 beamwidth → 120° (typical 3-sector site).
 * Wedge shows sector direction — not a hard coverage boundary.
 */
function csliSectorBeamwidth(beamwidthDeg) {
  let bw = Number(beamwidthDeg);
  if (!Number.isFinite(bw) || bw <= 0) bw = 120;
  return Math.min(360, Math.max(10, bw));
}

function csliSectorRing(lat, lon, azimuthDeg, beamwidthDeg, radiusM) {
  const az = Number(azimuthDeg);
  if (!Number.isFinite(az) || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  const bw = csliSectorBeamwidth(beamwidthDeg);
  const half = bw / 2;
  const start = az - half;
  const end = az + half;
  const step = Math.max(1, Math.min(3, bw / 20));
  const ring = [[lat, lon]];
  for (let a = start; a <= end + 0.001; a += step) {
    ring.push(csliDestPoint(lat, lon, a, radiusM));
  }
  ring.push(csliDestPoint(lat, lon, end, radiusM));
  ring.push([lat, lon]);
  return ring;
}

/** Sector rays + outer arc (arc length is illustrative, not an RF edge). */
function csliSectorOpenParts(lat, lon, azimuthDeg, beamwidthDeg, radiusM) {
  const az = Number(azimuthDeg);
  if (!Number.isFinite(az) || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  const bw = csliSectorBeamwidth(beamwidthDeg);
  const half = bw / 2;
  const start = az - half;
  const end = az + half;
  const left = csliDestPoint(lat, lon, start, radiusM);
  const right = csliDestPoint(lat, lon, end, radiusM);
  const mid = csliDestPoint(lat, lon, az, radiusM);
  const arc = [];
  const step = Math.max(1, Math.min(3, bw / 20));
  for (let a = start; a <= end + 0.001; a += step) {
    arc.push(csliDestPoint(lat, lon, a, radiusM));
  }
  arc.push(csliDestPoint(lat, lon, end, radiusM));
  return { left, right, mid, arc, start, end, az, bw };
}

/** Distinct colors for numbered stops (readable on street basemap). */
function csliCastColor(i, n) {
  const palette = [
    "#1d4ed8", "#b45309", "#047857", "#7c3aed", "#be123c",
    "#0e7490", "#a16207", "#4338ca", "#c2410c", "#166534",
  ];
  return palette[i % palette.length];
}

/** Built-in scene markers — only on matching phone + event day/time. */
const CSLI_SCENE_MARKERS = [
  {
    id: "scene-hope-manor-shooting",
    label: "Hope Manor shooting",
    lat: 40.490502,
    lon: -74.442727,
    note: "3 Hope Manor Drive, New Brunswick · 8/1/2020 01:14 EDT · NBPD 20NB04410",
    phones: ["7329972985"],
    event_when: "2020-08-01 01:14:00",
    kind: "scene",
  },
];

function csliPhoneDigits(phone) {
  return String(phone || "").replace(/\D/g, "");
}

function csliPoiStorageKey() {
  return `marshaloss.csliPois.${state.caseId || "0"}`;
}

function csliEventWhenDay(when) {
  const s = String(when || "").replace("T", " ");
  return s.length >= 10 ? s.slice(0, 10) : "";
}

function csliEventWhenMins(when) {
  const s = String(when || "").replace("T", " ");
  const m = s.match(/\b(\d{1,2}):(\d{2})(?::(\d{2}))?\b/);
  if (!m) return null;
  return Number(m[1]) * 60 + Number(m[2]) + (Number(m[3] || 0) / 60);
}

function csliNormalizePin(p) {
  if (!p || !Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lon))) return null;
  const event_when = p.event_when ? String(p.event_when) : (p.when ? String(p.when) : "");
  return {
    id: String(p.id),
    label: String(p.label || "Point"),
    lat: Number(p.lat),
    lon: Number(p.lon),
    note: p.note ? String(p.note) : "",
    phone: p.phone ? String(p.phone) : "",
    source_path: p.source_path ? String(p.source_path) : "",
    event_when,
    event_day: csliEventWhenDay(event_when) || (p.event_day ? String(p.event_day) : ""),
    kind: p.kind === "scene" ? "scene" : "user",
  };
}

function csliApplyPinsFromServer(pins) {
  state.csliPois = (Array.isArray(pins) ? pins : [])
    .map(csliNormalizePin)
    .filter(Boolean);
}

async function csliMigrateLocalPoisIfNeeded() {
  const key = csliPoiStorageKey();
  const migratedKey = `${key}.migrated`;
  try {
    if (localStorage.getItem(migratedKey)) return;
    const raw = localStorage.getItem(key);
    if (!raw) {
      localStorage.setItem(migratedKey, "1");
      return;
    }
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr) || !arr.length) {
      localStorage.setItem(migratedKey, "1");
      return;
    }
    for (const p of arr) {
      if (!Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lon))) continue;
      try {
        await api(`/api/forensics/map/pins`, {
          method: "POST",
          body: JSON.stringify({
            case_id: state.caseId,
            label: p.label || "Point of interest",
            lat: Number(p.lat),
            lon: Number(p.lon),
            note: p.note || "",
            phone: p.phone || null,
            source_path: p.source_path || null,
          }),
        });
      } catch {}
    }
    localStorage.setItem(migratedKey, "1");
    localStorage.removeItem(key);
  } catch {}
}

async function csliLoadUserPois() {
  try {
    await csliMigrateLocalPoisIfNeeded();
    const fromMap = state.forensicsCsliMap?.pins;
    if (Array.isArray(fromMap) && fromMap.length) {
      csliApplyPinsFromServer(fromMap);
      return;
    }
    const data = await api(`/api/forensics/map/pins?case_id=${state.caseId}`);
    csliApplyPinsFromServer(data.pins || []);
    if (state.forensicsCsliMap) state.forensicsCsliMap.pins = state.csliPois;
  } catch {
    state.csliPois = state.csliPois || [];
  }
}

function csliScenePoisForPhone(phone) {
  const digits = csliPhoneDigits(phone);
  if (!digits) return [];
  // Prefer server pin with same coords/label day over duplicate built-in
  const server = state.csliPois || [];
  return CSLI_SCENE_MARKERS.filter((m) => {
    if (!(m.phones || []).some((p) => csliPhoneDigits(p) === digits)) return false;
    const day = csliEventWhenDay(m.event_when);
    const dup = server.some((p) =>
      Math.abs(Number(p.lat) - m.lat) < 1e-5
      && Math.abs(Number(p.lon) - m.lon) < 1e-5
      && (!day || csliEventWhenDay(p.event_when) === day)
    );
    return !dup;
  }).map((m) => csliNormalizePin({ ...m, kind: "scene" })).filter(Boolean);
}

function csliPinVisibleForPhone(pin, phone) {
  if (!pin?.phone) return true;
  const want = csliPhoneDigits(phone);
  if (!want) return true;
  return csliPhoneDigits(pin.phone) === want;
}

/** Pin visible for current phone + selected day (whole date view, not filtered by ping). */
function csliPinVisibleNow(pin) {
  if (!csliPinVisibleForPhone(pin, state.csliPhone)) return false;
  const day = state.csliDay;
  // Pin event_when is Eastern; map to the active display zone's calendar day
  let pinDay = "";
  if (pin.event_when) {
    const zone = csliDisplayZone();
    if (!zone || zone === "America/New_York") {
      pinDay = csliEventWhenDay(pin.event_when) || pin.event_day || "";
    } else {
      const inst = csliParseInZone(pin.event_when, "America/New_York");
      const parts = csliFormatParts(inst, zone);
      pinDay = parts ? `${parts.year}-${parts.month}-${parts.day}` : csliEventWhenDay(pin.event_when);
    }
  } else {
    pinDay = pin.event_day || "";
  }
  if (pinDay) {
    if (!day || pinDay !== day) return false;
  } else if (day) {
    // Untimed pins stay hidden once days are in play — force date on create
    return false;
  }
  return true;
}

/** Zoom map to the selected ping sector or pin. */
function csliFocusSelection() {
  const map = state._csliMap;
  if (!map || state.csliPoiAddMode) return;

  if (state.csliSelectedPinId) {
    const pin = csliActivePois().find((p) => String(p.id) === String(state.csliSelectedPinId));
    if (!pin || !Number.isFinite(pin.lat) || !Number.isFinite(pin.lon)) return;
    try {
      map.setView([pin.lat, pin.lon], 16, { animate: false });
    } catch {}
    return;
  }

  if (!state.csliSelectedId) return;
  const hit = csliMovementStops(csliDayEvents()).find((s) => String(s.id) === String(state.csliSelectedId));
  if (!hit) return;
  const coneRadiusM = 1800;
  const est = csliPingEstimate(hit, coneRadiusM);
  const latlngs = [[hit.lat, hit.lon], est];
  if (hit.azimuth != null && Number.isFinite(Number(hit.azimuth))) {
    const az = Number(hit.azimuth);
    const bw = csliSectorBeamwidth(hit.beamwidth);
    latlngs.push(csliDestPoint(hit.lat, hit.lon, az, coneRadiusM * 0.75));
    latlngs.push(csliDestPoint(hit.lat, hit.lon, az - bw / 2, coneRadiusM * 0.65));
    latlngs.push(csliDestPoint(hit.lat, hit.lon, az + bw / 2, coneRadiusM * 0.65));
  }
  try {
    map.fitBounds(latlngs, { padding: [56, 56], maxZoom: 15, animate: false });
  } catch {
    try { map.setView(est, 14, { animate: false }); } catch {}
  }
}

/** Scene + server pins for the current phone/day/(optional) stop. */
function csliActivePois() {
  const user = (state.csliPois || []).filter((p) => csliPinVisibleNow(p));
  const scenes = csliScenePoisForPhone(state.csliPhone).filter((p) => csliPinVisibleNow(p));
  return [...scenes, ...user];
}

async function csliAddUserPoi({ label, lat, lon, note, phone, source_path, event_when }) {
  const body = {
    case_id: state.caseId,
    label: String(label || "Point of interest").trim() || "Point of interest",
    lat: Number(lat),
    lon: Number(lon),
    note: note ? String(note).trim() : "",
    phone: phone || state.csliPhone || null,
    source_path: source_path || null,
    event_when: event_when || null,
  };
  if (!Number.isFinite(body.lat) || !Number.isFinite(body.lon)) return null;
  const data = await api(`/api/forensics/map/pins`, {
    method: "POST",
    body: JSON.stringify(body),
  });
  const pin = csliNormalizePin(data.pin);
  if (pin) {
    state.csliPois = [...(state.csliPois || []), pin];
    if (state.forensicsCsliMap) {
      state.forensicsCsliMap.pins = state.csliPois;
    }
  }
  return pin;
}

async function csliUpdateUserPoi(id, { label, lat, lon, note, phone, event_when }) {
  const body = {
    case_id: state.caseId,
    pin_id: id,
    label: String(label || "Point of interest").trim() || "Point of interest",
    lat: Number(lat),
    lon: Number(lon),
    note: note != null ? String(note).trim() : "",
    phone: phone || state.csliPhone || null,
    event_when: event_when || null,
  };
  const data = await api(`/api/forensics/map/pins`, {
    method: "PATCH",
    body: JSON.stringify(body),
  });
  const pin = csliNormalizePin(data.pin);
  if (pin) {
    state.csliPois = (state.csliPois || []).map((p) => String(p.id) === String(pin.id) ? pin : p);
    if (state.forensicsCsliMap) state.forensicsCsliMap.pins = state.csliPois;
  }
  return pin;
}

  if (modal) modal.hidden = true;
  state.csliPoiDraft = null;
  state.csliPoiAddMode = false;
  const status = document.getElementById("csliPinStatus");

  if (del) del.hidden = true;
  const mapEl = document.getElementById("csliMap");
  if (mapEl) mapEl.classList.remove("add-poi");

function csliFillPinModalFields({ lat, lon, labelVal, noteVal, day, time, title, showDelete }) {
  const modal = document.getElementById("csliPinModal");
  if (!modal) return null;
  const titleEl = document.getElementById("csliPinTitle");
  if (titleEl) titleEl.textContent = title || "Pin location";
  const coords = document.getElementById("csliPinCoords");
  if (coords) coords.textContent = `${Number(lat).toFixed(6)}, ${Number(lon).toFixed(6)}`;
  const label = document.getElementById("csliPinLabel");
  const note = document.getElementById("csliPinNote");
  const dateEl = document.getElementById("csliPinDate");
  const timeEl = document.getElementById("csliPinTime");
  const status = document.getElementById("csliPinStatus");
  const del = document.getElementById("csliPinDelete");
  if (label) label.value = labelVal || "";
  if (note) note.value = noteVal || "";
  if (dateEl) dateEl.value = day || "";
  if (timeEl) timeEl.value = time || "";
  if (status) { status.hidden = true; status.textContent = ""; }
  if (del) del.hidden = !showDelete;
  const save = document.getElementById("csliPinSave");
  if (save) save.textContent = showDelete ? "Save changes" : "Save pin";
  modal.hidden = false;
  modal.removeAttribute("hidden");
  setTimeout(() => { try { label?.focus(); label?.select(); } catch {} }, 30);
  return modal;
}

function openCsliPinModal({ lat, lon }) {
  const la = Number(lat);
  const lo = Number(lon);
  if (!Number.isFinite(la) || !Number.isFinite(lo)) return;
  // Leaflet + DOM click can both fire for one press
  const now = Date.now();
  if (state._csliPinOpenAt && now - state._csliPinOpenAt < 400) return;
  state._csliPinOpenAt = now;
  state.csliPoiDraft = { mode: "create", lat: la, lon: lo };
  state.csliPoiAddMode = false;
  syncCsliPinModeUi();
  let day = state.csliDay || "";
  let time = "";
  if (state.csliSelectedId) {
    const stop = csliMovementStops(csliDayEvents()).find((s) => String(s.id) === String(state.csliSelectedId));
    const when = stop?.whenStart || stop?.start?.ts || stop?.start?.when || "";
    const d = csliEventWhenDay(when);
    if (d) day = d;
    const m = String(when).match(/\b(\d{2}:\d{2}(?::\d{2})?)\b/);
    if (m) time = m[1].length === 5 ? `${m[1]}:00` : m[1];
  }
  csliFillPinModalFields({
    lat: la, lon: lo, labelVal: "", noteVal: "", day, time,
    title: "Pin location", showDelete: false,
  });
}

function csliPinIsEditableUser(pin) {
  if (!pin || pin.kind === "scene") return false;
  const id = String(pin.id || "");
  if (!id || id.startsWith("scene-")) return false;
  return true;
}

function openCsliPinEditModal(pin) {
  if (!pin) return;
  const la = Number(pin.lat);
  const lo = Number(pin.lon);
  if (!Number.isFinite(la) || !Number.isFinite(lo)) return;
  state.csliPoiAddMode = false;
  syncCsliPinModeUi();
  const isUser = csliPinIsEditableUser(pin);
  // Scene markers aren't in DB — save creates a user pin (replaces scene on map)
  state.csliPoiDraft = isUser
    ? { mode: "edit", id: pin.id, lat: la, lon: lo, phone: pin.phone || state.csliPhone || null }
    : { mode: "create", lat: la, lon: lo, phone: state.csliPhone || null };
  let day = csliEventWhenDay(pin.event_when) || pin.event_day || state.csliDay || "";
  let time = "";
  const m = String(pin.event_when || "").match(/\b(\d{2}:\d{2}(?::\d{2})?)\b/);
  if (m) time = m[1].length === 5 ? `${m[1]}:00` : m[1];
  csliFillPinModalFields({
    lat: la, lon: lo,
    labelVal: pin.label || "",
    noteVal: pin.note || "",
    day, time,
    title: "Edit pin",
    showDelete: isUser,
  });
}

/** Map-container click while Pin mode is armed (bypasses overlay hit-testing). */
function csliPinMapDomClick(ev) {
  if (!state.csliPoiAddMode || !state._csliMap) return;
  if (ev.target.closest(".leaflet-control, .csli-tools, .csli-map-chip")) return;
  // Ignore pure drag-end
  if (state._csliPinDragMoved) return;
  try {
    const latlng = state._csliMap.mouseEventToLatLng(ev);
    if (!latlng) return;
    openCsliPinModal({ lat: latlng.lat, lon: latlng.lng });
  } catch (e) {
    console.warn("pin click failed", e);
  }
}

function csliBindPinMapClicks(map, el) {
  if (!map || !el) return;
  if (el.dataset.csliPinBound === "1") return;
  el.dataset.csliPinBound = "1";
  let down = null;
  el.addEventListener("pointerdown", (ev) => {
    if (!state.csliPoiAddMode) return;
    down = { x: ev.clientX, y: ev.clientY };
    state._csliPinDragMoved = false;
  });
  el.addEventListener("pointermove", (ev) => {
    if (!down || !state.csliPoiAddMode) return;
    if (Math.abs(ev.clientX - down.x) + Math.abs(ev.clientY - down.y) > 6) {
      state._csliPinDragMoved = true;
    }
  });
  el.addEventListener("click", csliPinMapDomClick, true);
}

function wireCsliPinModal() {
  const modal = document.getElementById("csliPinModal");
  if (!modal || modal.dataset.wired) return;
  modal.dataset.wired = "1";
  modal.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-csli-pin-dismiss]")) {
      closeCsliPinModal();
      render();
      mountCsliMap();
    }
  });
  const save = document.getElementById("csliPinSave");
  if (save) {
    save.onclick = async () => {
      const draft = state.csliPoiDraft;
      const status = document.getElementById("csliPinStatus");
      if (!draft) return;
      const label = (document.getElementById("csliPinLabel")?.value || "").trim();
      const note = (document.getElementById("csliPinNote")?.value || "").trim();
      const day = (document.getElementById("csliPinDate")?.value || "").trim();
      const time = (document.getElementById("csliPinTime")?.value || "").trim();
      if (!label) {
        if (status) { status.hidden = false; status.textContent = "Label is required."; }
        return;
      }
      if (!day) {
        if (status) { status.hidden = false; status.textContent = "Event date is required — pins only show on that day."; }
        return;
      }
      const event_when = time ? `${day} ${time.length === 5 ? `${time}:00` : time}` : day;
      save.disabled = true;
      try {
        if (draft.mode === "edit" && draft.id != null) {
          await csliUpdateUserPoi(draft.id, {
            label,
            lat: draft.lat,
            lon: draft.lon,
            note,
            phone: draft.phone,
            event_when,
          });
        } else {
          await csliAddUserPoi({
            label,
            lat: draft.lat,
            lon: draft.lon,
            note,
            event_when,
          });
        }
        closeCsliPinModal();
        render();
        mountCsliMap();
      } catch (e) {
        if (status) { status.hidden = false; status.textContent = e.message || String(e); }
      } finally {
        save.disabled = false;
      }
    };
  }
  const del = document.getElementById("csliPinDelete");
  if (del) {
    del.onclick = async () => {
      const draft = state.csliPoiDraft;
      if (!draft || draft.mode !== "edit" || draft.id == null) return;
      if (!confirm("Delete this pin?")) return;
      del.disabled = true;
      try {
        await csliRemoveUserPoi(draft.id);
        state.csliSelectedPinId = null;
        closeCsliPinModal();
        render();
        mountCsliMap();
      } catch (e) {
        const status = document.getElementById("csliPinStatus");
        if (status) { status.hidden = false; status.textContent = e.message || String(e); }
      } finally {
        del.disabled = false;
      }
    };
  }
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && modal && !modal.hidden) {
      closeCsliPinModal();
      render();
      mountCsliMap();
    }
  });
}

function csliLerpColor(t) {
  // green → amber → red over the day
  const stops = [
    [34, 197, 94],
    [245, 158, 11],
    [239, 68, 68],
  ];
  const x = Math.max(0, Math.min(1, t));
  const seg = x < 0.5 ? 0 : 1;
  const local = x < 0.5 ? x * 2 : (x - 0.5) * 2;
  const a = stops[seg];
  const b = stops[seg + 1];
  const r = Math.round(a[0] + (b[0] - a[0]) * local);
  const g = Math.round(a[1] + (b[1] - a[1]) * local);
  const bl = Math.round(a[2] + (b[2] - a[2]) * local);
  return `rgb(${r},${g},${bl})`;
}

/**
 * Label anchor inside the sector (along azimuth) for numbered time markers.
 * Not a GPS fix — only “phone used this sector.”
 */
function csliPingEstimate(s, coneRadiusM) {
  if (s.azimuth != null && Number.isFinite(Number(s.azimuth))) {
    return csliDestPoint(s.lat, s.lon, Number(s.azimuth), coneRadiusM * 0.55);
  }
  return [s.lat, s.lon];
}

function paintCsliPath(opts = {}) {
  const map = state._csliMap;
  const layer = state._csliPathLayer;
  if (!map || !layer) return;
  layer.clearLayers();

  const events = csliDayEvents();
  const stops = csliMovementStops(events);
  const selected = state.csliSelectedId;
  const pinning = !!state.csliPoiAddMode;
  const n = stops.length;
  // Illustrative wedge length (arc ≠ measured coverage)
  const coneRadiusM = 1800;
  const fitSig = `fit|${state.csliPhone || ""}|${state.csliDay || ""}|${n}|${(state.csliPois || []).length}`;
  const shouldFit = opts.fit === true || state._csliFitSig !== fitSig;

  const placePinAt = (latlng) => {
    if (!latlng) return;
    openCsliPinModal({ lat: latlng.lat, lon: latlng.lng });
  };

  if (!stops.length) {
    if (shouldFit) {
      try {
        const pois = csliActivePois();
        if (pois.length) {
          map.fitBounds(pois.map((p) => [p.lat, p.lon]), { padding: [40, 40], maxZoom: 15 });
        }
      } catch {}
      state._csliFitSig = fitSig;
    }
    return;
  }

  const estimates = stops.map((s) => csliPingEstimate(s, coneRadiusM));
  // Wedges/lines are decorative — never steal map clicks (needed for Pin mode)
  const deco = { interactive: false, bubblingMouseEvents: false };

  // 1) Sector wedges (orientation), under everything
  stops.forEach((s, i) => {
    if (s.azimuth == null || !Number.isFinite(Number(s.azimuth))) return;
    const active = selected && String(s.id) === String(selected);
    const col = csliCastColor(i, n);
    const parts = csliSectorOpenParts(s.lat, s.lon, s.azimuth, s.beamwidth, coneRadiusM);
    const ring = csliSectorRing(s.lat, s.lon, s.azimuth, s.beamwidth, coneRadiusM);
    if (!parts || !ring) return;
    L.polygon(ring, {
      ...deco,
      color: active ? "#0f172a" : col,
      weight: 0,
      fillColor: col,
      fillOpacity: active ? 0.34 : 0.2,
      opacity: 1,
    }).addTo(layer);
    // Radial edges (open wedge)
    L.polyline([[s.lat, s.lon], parts.left], {
      ...deco,
      color: active ? "#0f172a" : col, weight: active ? 2.5 : 2, opacity: 0.95,
    }).addTo(layer);
    L.polyline([[s.lat, s.lon], parts.right], {
      ...deco,
      color: active ? "#0f172a" : col, weight: active ? 2.5 : 2, opacity: 0.95,
    }).addTo(layer);
    // Center azimuth tick
    L.polyline([[s.lat, s.lon], parts.mid], {
      ...deco,
      color: active ? "#0f172a" : col, weight: 1, opacity: 0.55, dashArray: "4 5",
    }).addTo(layer);
    // Outer arc dashed — range is illustrative only
    L.polyline(parts.arc, {
      ...deco,
      color: active ? "#0f172a" : col, weight: 1.5, opacity: 0.7, dashArray: "6 5",
    }).addTo(layer);
  });

  // 2) Light sequence path between numbered labels
  for (let i = 0; i < n - 1; i++) {
    L.polyline([estimates[i], estimates[i + 1]], {
      ...deco,
      color: "#475569",
      weight: 2,
      opacity: 0.55,
      dashArray: "3 6",
      lineJoin: "round",
    }).addTo(layer);
  }

  // 3) Towers (black dots) + numbered call markers
  stops.forEach((s, i) => {
    const active = !pinning && selected && String(s.id) === String(selected);
    const num = i + 1;
    const col = csliCastColor(i, n);
    const [plat, plon] = estimates[i];
    const bw = csliSectorBeamwidth(s.beamwidth);
    const clock = `${csliFmtClock(s.start)}${s.count > 1 ? `–${csliFmtClock(s.end)}` : ""}`;

    const tower = L.circleMarker([s.lat, s.lon], {
      radius: active ? 5 : 4,
      color: "#fff",
      weight: 1.5,
      fillColor: "#0f172a",
      fillOpacity: 1,
      interactive: true,
    }).addTo(layer);
    if (pinning) {
      tower.on("click", (ev) => {
        L.DomEvent.stopPropagation(ev);
        placePinAt(ev.latlng);
      });
    } else {
      tower.bindPopup(
        [
          `<strong>Cell site</strong>`,
          s.cell ? `Cell ${esc(s.cell)}` : "",
          s.azimuth != null ? `Azimuth ${Math.round(s.azimuth)}° · sector width ~${Math.round(bw)}°` : "",
          `${Number(s.lat).toFixed(5)}, ${Number(s.lon).toFixed(5)}`,
        ].filter(Boolean).join("<br>")
      );
    }

    const icon = L.divIcon({
      className: "csli-poi-marker",
      html: `<div class="csli-cast-num${active ? " active" : ""}" style="${active ? "" : `background:${col}`}">${num}</div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12],
    });
    const m = L.marker([plat, plon], { icon, zIndexOffset: 500 + num });
    if (pinning) {
      m.on("click", (ev) => {
        L.DomEvent.stopPropagation(ev);
        placePinAt(ev.latlng);
      });
    } else {
      m.bindPopup([
        `<strong>#${num} · ${esc(clock)}</strong> · ${esc(csliTzLabel())}`,
        "Not a GPS fix — the phone used this tower sector.",
        "The wedge shows which way that sector faces. The phone was somewhere in that direction from the tower (exact distance unknown).",
        s.azimuth != null
          ? `Facing ${Math.round(s.azimuth)}° · ~${Math.round(bw)}° wide`
          : "No sector direction in this record",
        s.count > 1 ? `${s.count} records on this sector` : "1 record",
        s.cell ? `Cell ${esc(s.cell)}` : "",
      ].filter(Boolean).join("<br>"));
      m.on("click", () => {
        state.csliSelectedId = s.id;
        state.csliSelectedPinId = null;
        render();
        mountCsliMap();
      });
    }
    m.addTo(layer);
    if (active) {
      try { m.openPopup(); } catch {}
    }
  });

  if (shouldFit) {
    try {
      const latlngs = [];
      stops.forEach((s, i) => {
        latlngs.push([s.lat, s.lon], estimates[i]);
        if (s.azimuth != null) {
          latlngs.push(csliDestPoint(s.lat, s.lon, Number(s.azimuth), coneRadiusM));
          const bw = csliSectorBeamwidth(s.beamwidth);
          latlngs.push(csliDestPoint(s.lat, s.lon, Number(s.azimuth) - bw / 2, coneRadiusM));
          latlngs.push(csliDestPoint(s.lat, s.lon, Number(s.azimuth) + bw / 2, coneRadiusM));
        }
      });
      csliActivePois().forEach((p) => latlngs.push([p.lat, p.lon]));
      if (latlngs.length) map.fitBounds(latlngs, { padding: [48, 48], maxZoom: 14 });
    } catch {}
    state._csliFitSig = fitSig;
  }
}

function syncCsliPinModeUi() {
  const btn = document.getElementById("csliPoiAdd");
  if (btn) {
    btn.classList.toggle("active", !!state.csliPoiAddMode);

function mountCsliMap() {
  const el = document.getElementById("csliMap");
  if (!el || typeof L === "undefined") return;
  const data = state.forensicsCsliMap;
  if (!data) return;
  const sig = `path|${data.event_count}|${state.csliPhone || ""}|${state.csliDay || ""}|${state.csliTzMode || "eastern"}|${(state.csliPois || []).length}`;

  if (!(state._csliMap && state._csliMapSig === sig && el._leaflet_id)) {
    if (state._csliMap) {
      try { state._csliMap.remove(); } catch {}
      state._csliMap = null;
    }
    if (state._csliMapRo) {
      try { state._csliMapRo.disconnect(); } catch {}
      state._csliMapRo = null;
    }
    state._csliPathLayer = null;
    state._csliPoiLayer = null;
    state._csliFitSig = null;
    delete el.dataset.csliPinBound;
    el.innerHTML = "";

    const center = data.center || { lat: 40.49, lon: -74.45 };
    const map = L.map(el, {
      zoomControl: false,
      attributionControl: true,
      fadeAnimation: false,
    });
    state._csliMap = map;
    state._csliMapSig = sig;
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 19,
      updateWhenZooming: false,
      keepBuffer: 2,
    }).addTo(map);

    state._csliPathLayer = L.layerGroup().addTo(map);
    state._csliPoiLayer = L.layerGroup().addTo(map);
    map.setView([center.lat, center.lon], 13);
    csliBindPinMapClicks(map, el);

    const fixSize = () => { try { map.invalidateSize({ animate: false }); } catch {} };
    requestAnimationFrame(() => {
      fixSize();
      setTimeout(fixSize, 80);
      setTimeout(fixSize, 300);
    });
    if (typeof ResizeObserver !== "undefined") {
      state._csliMapRo = new ResizeObserver(() => fixSize());
      state._csliMapRo.observe(el);
    }
  }

  el.classList.toggle("add-poi", !!state.csliPoiAddMode);
  paintCsliPath();
  paintCsliPois();
  csliFocusSelection();
}

async function loadForensicsView(push) {
  state.forensicsErr = null;
  const section = state.forensicsSection;
  if (!section) {
    state.forensicsChats = [];
    state.forensicsChat = null;
    state.forensicsCsliMap = null;
    return;
  }
  if (section === "csli") {
    state.forensicsChats = [];
    state.forensicsChat = null;
    await loadForensicsCsli(push);
    return;
  }
  if (section !== "cellebrite") return;
  const sources = state.forensicsSummary?.sections?.cellebrite?.sources || [];
  if (!sources.length) {
    state.forensicsChats = [];
    state.forensicsChat = null;
    return;
  }
  // Phone picker step — wait until a UFDR / phone is chosen
  if (!state.forensicsUfdrPath) {
    state.forensicsChats = [];
    state.forensicsChat = null;
    state.forensicsLoading = false;
    return;
  }
  state.forensicsLoading = true;
  render();
  try {
    const data = await api(
      `/api/forensics/cellebrite/chats?case_id=${state.caseId}&path=${encodeURIComponent(state.forensicsUfdrPath)}`
    );
    state.forensicsChats = data.chats || [];
    state.forensicsOwners = data.owners || [];
    state.forensicsNote = data.note || null;
    const apps = forensicsAppStats(state.forensicsChats, state.forensicsShowEmpty);
    if (!state.forensicsApp || !apps.some((a) => a.name === state.forensicsApp)) {
      state.forensicsApp = apps[0]?.name || null;
    }
    if (state.forensicsChatId) {
      const selected = (state.forensicsChats || []).find((c) => String(c.id) === String(state.forensicsChatId));
      if (selected?.source) state.forensicsApp = selected.source;
      const chatData = await api(
        `/api/forensics/cellebrite/chat?case_id=${state.caseId}&path=${encodeURIComponent(state.forensicsUfdrPath)}&chat_id=${encodeURIComponent(state.forensicsChatId)}`
      );
      state.forensicsChat = chatData.chat || null;
    } else {
      state.forensicsChat = null;
    }
  } catch (e) {
    state.forensicsErr = e.message || String(e);
    state.forensicsChats = [];
    state.forensicsOwners = [];
    state.forensicsChat = null;
  } finally {
    state.forensicsLoading = false;
  }
  if (push) {
    state.route = {
      ...state.route,
      module: "forensics",
      forensicsSection: state.forensicsSection,
      forensicsUfdr: state.forensicsUfdrPath,
      forensicsChat: state.forensicsChatId,
    };
    setHash(state.route);
  }
}

async function openForensicsChat(chatId) {
  state.forensicsChatId = chatId;
  state.forensicsLoading = true;
  render();
  try {

async function loadNotebook(path, push) {
  const list = await api(`/api/notebook/pages?case_id=${state.caseId}`);
  state.notebookPages = list.pages || [];
  if (!state.caseMeta) state.caseMeta = list.case;
  const target = path || "Home";
  let page;
  try {
    const data = await api(`/api/notebook/page?case_id=${state.caseId}&path=${encodeURIComponent(target)}`);
    page = data.page;
  } catch {
    page = { path: target, title: target.split("/").pop(), body: "", id: null };
  }
  state.notebookPath = page.path;
  state.notebookPage = page;
  state.notebookDraftTitle = page.title || "";
  state.notebookDraftBody = page.body || "";
  state.notebookDirty = false;
  if (push !== false) {
    state.route = {
      name: "case",
      caseId: state.caseId,
      module: "notebook",
      notebookPath: page.path,
    };
    setHash(state.route);
  }
}

async function saveNotebook() {
  const res = await fetch("/api/notebook/page", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      case_id: state.caseId,
      path: state.notebookPath,
      title: state.notebookDraftTitle,
      body: state.notebookDraftBody,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || res.statusText);
  state.notebookPage = data.page;
  state.notebookDirty = false;
  const list = await api(`/api/notebook/pages?case_id=${state.caseId}`);
  state.notebookPages = list.pages || [];
  render();
}

async function deleteNotebookPage() {
  if (!state.notebookPath || state.notebookPath === "Home") {
    alert("Home page cannot be deleted.");
    return;
  }
  if (!confirm(`Delete notebook page “${state.notebookPath}”?`)) return;
  const res = await fetch(
    `/api/notebook/page?case_id=${state.caseId}&path=${encodeURIComponent(state.notebookPath)}`,
    { method: "DELETE" }
  );
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  await loadNotebook("Home", true);
  render();
}

function renderNotebookDocPane() {
  const doc = state.notebookDoc;
  if (!doc) {
    return `<aside class="nb-doc"><div class="nb-doc-empty">Select a <code>[[doc:]]</code> link to open discovery beside the wiki.</div></aside>`;
  }
  const tab = state.notebookDocTab || "preview";
  const tabs = [
    ["preview", "Preview"],
    ["text", "Text"],
    ["metadata", "Metadata"],
  ];
  const tabBtns = tabs.map(([id, label]) =>
    `<button type="button" class="tab ${tab === id ? "active" : ""}" data-nb-doc-tab="${id}">${label}</button>`
  ).join("");
  let body = "";
  if (tab === "preview") {
    if (doc.kind === "pdf" && doc.raw_url) {
      body = `<iframe class="preview-frame" src="${esc(pdfEmbedUrl(doc.raw_url))}" title="${esc(doc.name)}"></iframe>`;
    } else if (doc.kind === "image" && doc.raw_url) {
      body = `<img class="preview-img" src="${esc(doc.raw_url)}" alt="${esc(doc.name)}"/>`;
    } else if ((doc.kind === "video" || doc.kind === "audio") && doc.raw_url) {
      const tag = doc.kind === "video" ? "video" : "audio";
      body = `<${tag} class="preview-frame" controls src="${esc(doc.raw_url)}"></${tag}>`;
    } else if (doc.text) {
      body = `<div class="panel-card"><pre class="text-body">${esc(doc.text.slice(0, 8000))}${doc.text.length > 8000 ? "\n…" : ""}</pre></div>`;
    } else if (doc.open_url || doc.raw_url) {
      body = `<div class="panel-card">
        <p>${doc._not_ingested ? "File is on disk but not fully ingested yet." : "No inline preview for this type."}</p>
        <p>${doc.download_url ? `<a href="${esc(doc.download_url)}" download target="_blank" rel="noopener">Download</a>` : ""}</p>
        ${doc.error ? `<p class="err">${esc(doc.error)}</p>` : ""}
      </div>`;
    } else {
      body = `<div class="placeholder">Nothing to preview.</div>`;
    }
  } else if (tab === "text") {
    body = doc.text
      ? `<div class="panel-card"><pre class="text-body">${esc(doc.text)}</pre></div>`
      : `<div class="panel-card placeholder">No extracted text.</div>`;
  } else {
    const rows = [
      ["Name", doc.name],
      ["Path", doc.rel_path],
      ["Bates", doc.bates],
      ["MIME", doc.mime],
      ["Size", fmtSize(doc.size)],
      ["Kind", doc.kind],
    ];
    body = `<div class="panel-card"><table class="meta-table">
      ${rows.filter(([, v]) => v != null && v !== "").map(([k, v]) =>
        `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`
      ).join("")}
    </table></div>`;
  }
  return `
    <aside class="nb-doc">
      <div class="doc-head">
        <div class="doc-title-row">
          <div>
            <h1>${esc(doc.name)}</h1>
            ${doc.bates ? `<div class="bates">${esc(doc.bates)}</div>` : ""}
            <div class="meta">${esc(doc.rel_path)}</div>
          </div>
          <div class="doc-actions">
            ${fileActionIcons(doc)}
            <button type="button" class="ghost" id="btnNbDocClose">Close</button>
          </div>
        </div>
        <div class="tabs">${tabBtns}</div>
      </div>
      <div class="doc-body">${body}</div>
    </aside>
  `;
}

/** Minimal Markdown + wiki links → HTML (no external deps). */
function renderMarkdown(src) {
  let text = String(src || "");
  // fenced code
  const fences = [];
  text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
    const i = fences.length;
    fences.push(`<pre><code>${esc(code.replace(/^\n/, ""))}</code></pre>`);
    return `\u0000FENCE${i}\u0000`;
  });
  // wiki doc / page links before generic markdown links
  text = text.replace(/\[\[doc:([^\]|]+)(?:\|([^\]]+))?\]\]/gi, (_, path, label) => {
    const lab = label || path.split("/").pop();
    return `<a class="doc-link" href="#" data-doc="${esc(path.trim())}">${esc(lab.trim())}</a>`;
  });
  text = text.replace(/\[\[page:([^\]|]+)(?:\|([^\]]+))?\]\]/gi, (_, path, label) => {
    const lab = label || path.split("/").pop();
    return `<a class="page-link" href="#" data-page="${esc(path.trim())}">${esc(lab.trim())}</a>`;
  });
  // markdown links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, lab, url) =>
    `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(lab)}</a>`
  );
  // tables (simple)
  text = text.replace(/(^|\n)((?:\|.+\|\n)+)/g, (m, pre, block) => {
    const rows = block.trim().split("\n").filter(Boolean);
    if (rows.length < 2) return m;
    const parseRow = (r) => r.split("|").slice(1, -1).map(c => c.trim());
    const head = parseRow(rows[0]);
    const bodyRows = rows.slice(2).map(parseRow);
    let html = "<table><thead><tr>" + head.map(h => `<th>${esc(h)}</th>`).join("") + "</tr></thead><tbody>";
    for (const r of bodyRows) html += "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>";
    html += "</tbody></table>";
    return pre + html;
  });
  // headings / lists / paragraphs — line based
  const lines = text.split("\n");
  const out = [];
  let inUl = false, inOl = false;
  const closeLists = () => {
    if (inUl) { out.push("</ul>"); inUl = false; }
    if (inOl) { out.push("</ol>"); inOl = false; }
  };
  const inline = (s) => {
    // Protect existing HTML anchors from escaping
    const slots = [];
    let t = String(s).replace(/<a\b[^>]*>[\s\S]*?<\/a>/gi, (m) => {
      slots.push(m);
      return `\u0000A${slots.length - 1}\u0000`;
    });
    t = esc(t)
      .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
    t = t.replace(/\u0000A(\d+)\u0000/g, (_, i) => slots[Number(i)]);
    return t;
  };
  for (const line of lines) {
    if (line.startsWith("\u0000FENCE")) {
      closeLists();
      const i = Number(line.replace(/\u0000FENCE(\d+)\u0000/, "$1"));
      out.push(fences[i] || "");
      continue;
    }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) {
      closeLists();
      const n = h[1].length;
      out.push(`<h${n}>${inline(h[2])}</h${n}>`);
      continue;
    }
    const ul = /^[-*]\s+(.*)$/.exec(line);
    if (ul) {
      if (inOl) { out.push("</ol>"); inOl = false; }
      if (!inUl) { out.push("<ul>"); inUl = true; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }
    const ol = /^(\d+)\.\s+(.*)$/.exec(line);
    if (ol) {
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (!inOl) { out.push("<ol>"); inOl = true; }
      out.push(`<li>${inline(ol[2])}</li>`);
      continue;
    }
    closeLists();
    if (!line.trim()) { out.push(""); continue; }
    if (line.startsWith("<table") || line.startsWith("<pre")) {
      out.push(line);
    } else {
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  closeLists();
  return `<div class="md">${out.join("\n")}</div>`;
}

function setBrowseMode(mode) {
  navigate({
    name: "case",
    caseId: state.caseId,
    module: "explorer",
    browseMode: mode,
    category: null,
    folder: "",
    docPath: null,
    tab: state.tab || "preview",
    facet: null,
  });
}

function facetBackChevron() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>`;
}

function captureFacetReturn() {
  if (!state.selectedPath) return state.facetReturn;
  return {
    docPath: state.selectedPath,
    tab: state.tab || "preview",
    browseMode: state.browseMode || "categories",
    category: state.category,
    path: state.path || "",
  };
}

async function fetchBrowseEntries({ browseMode, category, path } = {}) {
  const mode = browseMode || "categories";
  if (mode === "folders") {
    const dir = await api(
      `/api/files/list?case_id=${state.caseId}&path=${encodeURIComponent(path || "")}`
    );
    return {
      entries: dir.entries || [],
      breadcrumbs: dir.breadcrumbs || [],
      path: dir.path || path || "",
      category: null,
      browseMode: "folders",
    };
  }
  const params = new URLSearchParams({ case_id: String(state.caseId) });
  if (category) params.set("category", category);
  const data = await api(`/api/files/categories?${params}`);
  return {
    entries: data.entries || [],
    breadcrumbs: category
      ? [{ name: data.category_label || category, path: category }]
      : [],
    path: "",
    category: category || null,
    browseMode: "categories",
  };
}

async function fetchDocDetail(relPath) {
  const data = await api(
    `/api/files/detail?case_id=${state.caseId}&path=${encodeURIComponent(relPath)}`
  );
  const doc = data.file;
  doc.raw_url = relativize(doc.raw_url);
  doc.open_url = relativize(doc.open_url);
  doc.download_url = relativize(doc.download_url);
  return doc;
}

async function openFacet({ tag = null, entity = null, entity_type = null } = {}) {
  if (!state.caseId) return;
  if (!tag && !entity && !entity_type) return;
  const returning = captureFacetReturn();
  const params = new URLSearchParams({ case_id: String(state.caseId) });
  if (tag) params.set("tag", tag);
  if (entity) params.set("entity", entity);
  if (entity_type) params.set("entity_type", entity_type);
  let data;
  try {
    data = await api(`/api/files/by-facet?${params}`);
  } catch (e) {
    alert(e.message || String(e));
    return;
  }
  const facet = { tag, entity, entity_type };
  await withViewTransition(() => {
    state.facetReturn = returning;
    state.facet = facet;
    state.hits = null;
    state.searchQuery = "";
    state.entries = data.entries || [];
    state.breadcrumbs = [];
    state.selectedPath = null;
    state.doc = null;
    state.tab = "preview";
    state.module = "explorer";
    state.route = {
      name: "case",
      caseId: state.caseId,
      module: "explorer",
      browseMode: state.browseMode || "categories",
      category: null,
      folder: "",
      docPath: null,
      tab: "preview",
      facet,
    };
    setHash(state.route);
    render();
  });
}

async function clearFacet() {
  const ret = state.facetReturn;
  const browseMode = ret?.browseMode || state.browseMode || "categories";
  const category = ret?.category ?? null;
  const path = ret?.path || "";
  const targetDoc = ret?.docPath || null;
  const targetTab = ret?.tab || "preview";

  let browse;
  let doc = null;
  try {
    browse = await fetchBrowseEntries({ browseMode, category, path });
    if (targetDoc) {
      try {
        doc = await fetchDocDetail(targetDoc);
      } catch {
        doc = null;
      }
    }
  } catch (e) {
    alert(e.message || String(e));
    return;
  }

  await withViewTransition(() => {
    state.facet = null;
    state.facetReturn = null;
    state.hits = null;
    state.searchQuery = "";
    state.browseMode = browse.browseMode;
    state.category = browse.category;
    state.path = browse.path;
    state.entries = browse.entries;
    state.breadcrumbs = browse.breadcrumbs;
    state.selectedPath = doc ? targetDoc : null;
    state.doc = doc;
    state.tab = doc
      ? ((!doc.text && doc.kind === "other" && !doc.raw_url) ? "metadata" : targetTab)
      : "preview";
    state.module = "explorer";
    state.route = {
      name: "case",
      caseId: state.caseId,
      module: "explorer",
      browseMode: browse.browseMode,
      category: browse.browseMode === "categories" ? browse.category : null,
      folder: browse.browseMode === "folders" ? browse.path : "",
      docPath: doc ? targetDoc : null,
      tab: state.tab,
      facet: null,
    };
    setHash(state.route);
    render();
  });
}

function renderHome() {

    return `
