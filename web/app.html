<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Marshal</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css"/>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --muted: #94a3b8;
    --muted-strong: #64748b;
    --border: #e2e8f0;
    --hover: #f1f5f9;
    --panel: #fff;
    --ink: #020617;
    --danger: #b42318;
    --warn: #b45309;
    --ok: #166534;
  }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body {
    font: 14px/1.45 Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
  }
  a { color: var(--fg); text-decoration: none }
  a:hover { text-decoration: underline }

  header.app-bar { background: var(--panel); border-bottom: 1px solid var(--border) }
  header .inner {
    max-width: 90rem; margin: 0 auto; padding: 8px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  header .brand {
    font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
    cursor: pointer; border: 0; background: none; padding: 0; color: var(--fg);
  }

  select, button, input {
    font: inherit; border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; background: #fff; color: var(--fg);
  }
  button { cursor: pointer }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink) }
  button.ghost { background: transparent }
  button.ghost.danger { color: #b91c1c }
  button.ghost.danger:hover { background: #fef2f2; color: #991b1b }
  button.tab {
    border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    background: transparent; padding: 10px 14px; color: var(--muted-strong); font-weight: 600;
  }
  button.tab.active { color: var(--fg); border-bottom-color: var(--ink) }
  button.linkish {
    border: 0; background: transparent; padding: 0; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  button.linkish:hover { text-decoration: underline }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column }

  .home-wrap { flex: 1; overflow: auto; padding: 20px 32px 40px }
  .cases-grid {
    max-width: 90rem; margin: 0 auto; display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); align-items: stretch;
  }
  .case-tile {
    display: flex; flex-direction: column; width: 100%; max-width: 24rem;
    overflow: hidden; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    padding: 0; text-align: left; cursor: pointer; transition: box-shadow 0.15s ease;
  }
  .case-tile:hover { box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1) }
  .case-tile .body { flex: 1; display: flex; flex-direction: column; padding: 20px 24px }
  .case-tile .title-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .case-tile h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--fg); min-width: 0 }
  .case-tile .grow { flex: 1 }
  .case-rename-pen {
    flex: 0 0 auto; border: 0; background: transparent; color: var(--muted-strong);
    cursor: pointer; padding: 2px; border-radius: 4px; line-height: 0;
  }
  .case-rename-pen:hover { color: var(--fg); background: var(--hover) }
  .case-rename-pen svg { width: 14px; height: 14px; display: block }
  .case-rename-modal[hidden] { display: none !important }
  .case-rename-modal {
    position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
    padding: 1.25rem;
  }
  .case-rename-backdrop {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.42);
  }
  .case-rename-card {
    position: relative; z-index: 1; width: min(24rem, 100%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18); padding: 1rem 1.1rem 1.05rem;
  }
  .case-rename-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    margin-bottom: 0.85rem;
  }
  .case-rename-head h2 {
    margin: 0; font-size: 15px; font-weight: 650; color: var(--fg);
  }
  .case-rename-close {
    border: 0; background: transparent; color: var(--muted-strong);
    font-size: 1.35rem; line-height: 1; cursor: pointer; padding: 0.1rem 0.35rem;
  }
  .case-rename-close:hover { color: var(--fg) }
  .case-rename-body { display: grid; gap: 0.35rem }
  .case-rename-body input,
  .case-rename-body textarea {
    width: 100%; padding: 0.55rem 0.7rem; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; font: inherit; color: var(--fg);
  }
  .case-rename-body textarea { min-height: 4.2rem; resize: vertical }
  .case-rename-body label {
    font-size: 11.5px; font-weight: 650; color: var(--muted-strong); margin-top: 0.35rem;
  }
  .case-rename-body label:first-child { margin-top: 0 }
  .case-rename-body .pin-meta {
    font-size: 11.5px; color: var(--muted-strong); line-height: 1.35;
  }
  .case-rename-body .pin-when-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
  }
  .case-rename-status {
    margin: 0.55rem 0 0; font-size: 12px; color: var(--danger); min-height: 1.1em;
  }
  .case-rename-actions {
    display: flex; justify-content: flex-end; gap: 0.45rem; margin-top: 1rem;
  }
  .case-rename-card.pin-card { width: min(28rem, 100%) }
  .case-tile .view-bar {
    display: flex; align-items: center; justify-content: center;
    background: #020617; color: #fff; padding: 16px; font-size: 14px; font-weight: 500;
  }
  .case-tile:hover .view-bar { background: #000 }
  .empty-cases {
    max-width: 36rem; margin: 24px auto 0; border: 1px solid #fde68a;
    background: #fffbeb; border-radius: 12px; padding: 24px;
  }
  .empty-cases h2 { margin: 0; color: #78350f; font-size: 16px }
  .empty-cases p { margin: 8px 0 0; color: #92400e; font-size: 14px; line-height: 1.5 }

  .case-shell {
    display: grid; grid-template-columns: 15rem 1fr; height: 100%; min-height: 0;
  }
  .case-nav {
    border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .case-nav-head { border-bottom: 1px solid var(--border); padding: 16px }
  .case-nav-head .all {
    font-size: 11px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); cursor: pointer;
    border: 0; background: none; padding: 0;
  }
  .case-nav-head .all:hover { color: var(--muted-strong) }
  .case-nav-head h1 { margin: 8px 0 0; font-size: 14px; font-weight: 600; line-height: 1.35 }
  .case-nav-list { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px }
  .case-nav-list button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 0; border-radius: 8px; padding: 8px 12px; text-align: left;
    background: transparent; color: #334155; font-size: 14px;
  }
  .case-nav-list button:hover { background: var(--hover) }
  .case-nav-list button.active { background: var(--ink); color: #fff }
  .case-nav-list .nav-ico { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85 }
  .case-content { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg) }
  .bwc-host { flex: 1; min-height: 0; display: flex; flex-direction: column }
  .bwc-host iframe { flex: 1; width: 100%; border: 0; background: #f3f5f7 }
  .forensics {
    display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--bg);
  }
  .forensics-subnav {
    flex-shrink: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid #cbd5e1; background: #f8fafc;
  }
  .forensics-subnav button {
    border: 1px solid var(--border); background: #fff; color: var(--fg);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 650;
    cursor: pointer;
  }
  .forensics-subnav button:hover { background: var(--hover) }
  .forensics-subnav button.active { background: var(--ink); color: #fff; border-color: var(--ink) }
  .forensics-body { flex: 1; min-height: 0; display: flex; flex-direction: column }
  .forensics-toolbar {
    flex-shrink: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .forensics-toolbar input[type="search"] {
    flex: 1; min-width: 10rem; max-width: 22rem; font: inherit; font-size: 13px;
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  .forensics-toolbar label.chk {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-strong);
    cursor: pointer; user-select: none;
  }
  .forensics-split {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(140px, 168px) minmax(240px, 32%) minmax(0, 1fr);
  }
  .forensics-pane {
    min-width: 0; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  .forensics-pane:last-child { border-right: 0 }
  .forensics-pane-head {
    flex-shrink: 0; padding: 10px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted-strong);
  }
  .forensics-pane-head strong { color: var(--fg); font-weight: 700 }
  .forensics-pane-head .sub { display: block; margin-top: 2px; font-weight: 500; color: var(--muted-strong) }
  .forensics-list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1 }
  .forensics-list li {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .forensics-list li:hover { background: var(--hover) }
  .forensics-list li.active { background: #e8eef7; box-shadow: inset 3px 0 0 var(--ink) }
  .forensics-list .t { font-weight: 650; font-size: 13px; line-height: 1.3 }
  .forensics-list .s { margin-top: 3px; font-size: 12px; color: var(--muted-strong); line-height: 1.35 }
  .forensics-list .row-meta {
    display: flex; justify-content: space-between; gap: 8px; margin-top: 4px;
    font-size: 11px; color: var(--muted);
  }
  .forensics-apps li { padding: 11px 12px }
  .forensics-apps .t { font-size: 12.5px }
  .forensics-apps .count {
    float: right; font-size: 11px; font-weight: 650; color: var(--muted-strong);
    background: #eef2f7; border-radius: 999px; padding: 1px 7px;
  }
  .forensics-apps li.active .count { background: #dbe6f5; color: var(--ink) }
  .chat-thread {
    flex: 1; min-height: 0; overflow: auto; padding: 16px 18px 28px;
    background: #eef2f6; display: flex; flex-direction: column; gap: 8px;
  }
  .chat-day {
    align-self: center; margin: 10px 0 4px; padding: 3px 10px;
    font-size: 11px; font-weight: 650; color: var(--muted-strong);
    background: rgba(255,255,255,0.85); border-radius: 999px; border: 1px solid var(--border);
  }
  .chat-bubble {
    max-width: min(36rem, 88%); padding: 8px 12px; border-radius: 14px;
    background: #fff; border: 1px solid var(--border); box-shadow: 0 1px 0 rgba(15,23,42,0.04);
  }
  .chat-bubble.sent {
    align-self: flex-end; background: #dbeafe; border-color: #bfdbfe;
  }
  .chat-bubble.recv { align-self: flex-start }
  .chat-bubble .meta { font-size: 11px; color: var(--muted-strong); margin-bottom: 3px }
  .chat-bubble .body { font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word }
  .chat-bubble .body:empty::after { content: "(no text)"; color: var(--muted); font-style: italic }
  .forensics-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: var(--muted-strong); text-align: center;
  }
  .forensics-landing {
    flex: 1; min-height: 0; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px 48px;
  }
  .forensics-heroes {
    display: grid; gap: 28px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 280px));
    width: min(640px, 100%);
    justify-content: center;
  }
  .forensics-hero {
    appearance: none; border: 1px solid var(--border); background: #fff;
    border-radius: 18px; padding: 28px 22px 22px; cursor: pointer; text-align: center;
    box-shadow: 0 1px 0 rgba(15,23,42,0.04);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .forensics-hero:hover {
    border-color: #94a3b8; box-shadow: 0 8px 24px rgba(15,23,42,0.08);
    transform: translateY(-2px);
  }
  .forensics-hero .hero-ico {
    width: 88px; height: 88px; margin: 0 auto 16px;
    display: grid; place-items: center;
    border-radius: 22px; background: #f1f5f9; color: var(--ink);
  }
  .forensics-hero .hero-ico svg { width: 52px; height: 52px }
  .forensics-hero.cellebrite .hero-ico { background: #e8eef7 }
  .forensics-hero.csli .hero-ico { background: #eef6f0 }
  .forensics-hero .hero-title {
    margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg);
  }
  .forensics-hero .hero-sub {
    margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted-strong);
    word-break: break-word;
  }
  .forensics-hero .hero-meta {
    margin: 12px 0 0; font-size: 11px; font-weight: 650; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .forensics-phone-list {
    display: flex; flex-direction: column; gap: 10px;
    width: min(420px, 100%); margin: 0 auto;
  }
  .forensics-phone-card {
    appearance: none; width: 100%; text-align: left; cursor: pointer;
    border: 1px solid var(--border); background: #fff; border-radius: 14px;
    padding: 16px 16px 14px; display: grid; grid-template-columns: 48px 1fr; gap: 14px;
    align-items: center;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .forensics-phone-card:hover {
    border-color: #94a3b8; box-shadow: 0 6px 18px rgba(15,23,42,0.07);
  }
  .forensics-phone-card .pico {
    width: 48px; height: 48px; border-radius: 12px; background: #e8eef7;
    display: grid; place-items: center; color: var(--ink);
  }
  .forensics-phone-card .pico svg { width: 26px; height: 26px }
  .forensics-phone-card .pt { font-size: 15px; font-weight: 700; letter-spacing: -0.02em }
  .forensics-phone-card .ps { margin-top: 3px; font-size: 12px; color: var(--muted-strong); line-height: 1.35 }
  .forensics-back {
    border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px;
    font-weight: 650; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 4px;
  }
  .forensics-back:hover { text-decoration: underline }
  .csli-map-host {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
    background: #e8eef3;
  }
  html.popout-mode, html.popout-mode body {
    height: 100%; overflow: hidden;
  }
  html.popout-mode header.app-bar { display: none }
  html.popout-mode #main {
    height: 100vh; max-width: none; margin: 0; padding: 0;
  }
  html.popout-mode .case-shell {
    grid-template-columns: 1fr; height: 100vh;
  }
  html.popout-mode .case-nav { display: none }
  html.popout-mode .case-content { height: 100vh; min-height: 0 }
  html.popout-mode .forensics { height: 100%; }
  html.popout-mode .forensics-toolbar { display: none }
  html.popout-mode .forensics-body { height: 100%; }
  html.popout-mode .csli-map-host {
    height: 100%;
    grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
  }
  html.popout-mode .csli-map { min-height: 0; }
  .csli-map-main {
    min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative;
  }
  .csli-map { flex: 1; min-height: 320px; width: 100%; }
  .csli-tools {
    position: absolute; z-index: 600; top: 12px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .csli-tools > * { pointer-events: auto }
  .csli-tools-bar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 6px 8px; border-radius: 12px;
    background: rgba(255,255,255,0.96); border: 1px solid rgba(15,23,42,0.1);
    box-shadow: 0 4px 16px rgba(15,23,42,0.12); backdrop-filter: blur(8px);
  }
  .csli-tools-bar select {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--fg);
    border: 1px solid transparent; border-radius: 8px;
    padding: 6px 8px; background: #f1f5f9; max-width: 200px;
  }
  .csli-tools-bar select:hover, .csli-tools-bar select:focus {
    border-color: #cbd5e1; outline: none; background: #fff;
  }
  .csli-tools-bar .tool-sep {
    width: 1px; height: 22px; background: #e2e8f0; margin: 0 2px;
  }
  .csli-tools-bar .tool-btn {
    font: inherit; font-size: 12.5px; font-weight: 700;
    border: 1px solid transparent; border-radius: 8px;
    padding: 6px 12px; background: #f1f5f9; color: var(--fg); cursor: pointer;
  }
  .csli-tools-bar .tool-btn:hover { background: #e2e8f0 }
  .csli-tools-bar .tool-btn.active {
    background: #0f172a; color: #fff;
  }
  .csli-tools-hint {
    padding: 6px 12px; border-radius: 999px;
    background: #0f172a; color: #fff; font-size: 12px; font-weight: 650;
    box-shadow: 0 2px 8px rgba(15,23,42,0.2);
  }
  .csli-map-chip {
    position: absolute; z-index: 500; left: 12px; bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,0.94);
    border: 1px solid rgba(15,23,42,0.08); font-size: 11px; color: #475569;
    box-shadow: 0 2px 10px rgba(15,23,42,0.08); pointer-events: none;
  }
  .csli-map-chip .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
    vertical-align: middle;
  }
  .csli-map-chip .dot.tower { background: #0f172a }
  .csli-map-chip .dot.num {
    background: #1e3a8a; color: #fff; width: 14px; height: 14px;
    font: 700 9px/14px ui-sans-serif, system-ui, sans-serif; text-align: center;
  }
  .csli-map-chip .line {
    display: inline-block; width: 14px; height: 2px; margin-right: 5px;
    vertical-align: middle; background: #64748b;
  }
  .csli-map-chip .cone {
    display: inline-block; width: 0; height: 0; margin-right: 5px; vertical-align: middle;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 10px solid rgba(37, 99, 235, 0.5);
  }
  .csli-map-chip .poi {
    display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: middle;
    background: #9f1239; transform: rotate(45deg); border: 1px solid #fff;
    box-shadow: 0 0 0 1px #9f1239;
  }
  .csli-cast-num {
    width: 24px; height: 24px; margin-left: -12px; margin-top: -12px;
    border-radius: 50%; background: #1e3a8a; color: #fff;
    font: 700 11px/24px ui-sans-serif, system-ui, sans-serif;
    text-align: center; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(15,23,42,0.4);
  }
  .csli-cast-num.active { background: #b91c1c; width: 28px; height: 28px; margin-left: -14px; margin-top: -14px; line-height: 28px; font-size: 12px }
  .csli-map.add-poi { cursor: crosshair !important }
  /* Pin mode: let clicks reach the map (wedges/markers otherwise swallow them) */
  .csli-map.add-poi .leaflet-overlay-pane,
  .csli-map.add-poi .leaflet-marker-pane,
  .csli-map.add-poi .leaflet-shadow-pane,
  .csli-map.add-poi .leaflet-tooltip-pane,
  .csli-map.add-poi .leaflet-popup-pane {
    pointer-events: none !important;
  }
  .csli-poi-marker { background: transparent !important; border: 0 !important }
  .csli-poi-pin {
    width: 16px; height: 16px; margin-left: -8px; margin-top: -8px;
    background: #9f1239; transform: rotate(45deg);
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(15,23,42,0.35);
  }
  .csli-poi-pin.user {
    background: #c2410c; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    width: 16px; height: 16px; margin-left: -8px; margin-top: -16px;
  }
  .csli-timeline {
    min-height: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: #fafbfc;
  }
  .csli-timeline-head {
    flex-shrink: 0; padding: 14px 14px 12px; border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .csli-timeline-head .title {
    display: flex; align-items: center; gap: 6px;

    display: grid; grid-template-columns: minmax(180px, 22%) minmax(280px, 1fr);
    height: 100%; min-height: 0;
  }
  .notebook.nb-split {
    grid-template-columns: minmax(160px, 18%) minmax(240px, 1fr) minmax(280px, 38%);

  .nb-side {
    border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .nb-tree { list-style: none; margin: 0; padding: 8px 0; overflow: auto; flex: 1 }
  .nb-tree .nb-item {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 10px; cursor: pointer; font-size: 13px; border: 0; width: 100%;
    background: transparent; text-align: left; color: inherit; border-radius: 0;
  }
  .nb-tree .nb-item:hover, .nb-tree .nb-item.active { background: var(--hover) }
  .nb-tree .nb-item.active { font-weight: 650 }
  .nb-tree .nb-item.nb-root {
    margin-top: 2px; padding-top: 9px; padding-bottom: 9px;
    font-size: 13.5px; font-weight: 750; color: var(--ink); letter-spacing: -0.01em;
  }
  .nb-tree > li:first-child > .nb-item.nb-root { margin-top: 0 }
  .nb-tree .nb-item.nb-root .nb-label { font-weight: 750 }
  .nb-tree .nb-item.nb-root.active {
    background: #e8eef7; box-shadow: inset 3px 0 0 var(--ink);
  }
  .nb-tree .nb-kids { list-style: none; margin: 0; padding: 0 }
  .nb-tree .nb-twisty {
    width: 16px; flex-shrink: 0; border: 0; background: transparent; cursor: pointer;
    color: var(--muted-strong); padding: 0; font-size: 10px; line-height: 1;
  }
  .nb-tree .nb-ico {
    flex: 0 0 15px; width: 15px; height: 15px; color: var(--muted-strong);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .nb-tree .nb-ico svg { width: 15px; height: 15px; display: block }
  .nb-tree .nb-item.nb-root:hover .nb-ico,
  .nb-tree .nb-item.nb-root.active .nb-ico { color: var(--fg) }
  .nb-tree .nb-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .nb-tree .nb-section {
    margin: 8px 10px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  .nb-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg) }
  .nb-nav {
    flex-shrink: 0; padding: 10px 12px;
    border-bottom: 1px solid #cbd5e1; background: #fff;
    overflow: hidden; min-width: 0;
  }
  .nb-toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .nb-toolbar input.title {
    flex: 1; min-width: 140px; font-weight: 650; border: 1px solid transparent;
    background: transparent; padding: 6px 8px;
  }
  .nb-toolbar input.title:focus { border-color: var(--border); background: #fff }
  .nb-editor, .nb-preview {
    flex: 1; min-height: 0; overflow: auto; padding: 16px;
  }
  .nb-editor textarea {
    width: 100%; height: 100%; min-height: 360px; resize: none;
    border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; background: #fff;
  }
  .nb-preview .md {
    max-width: 820px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 24px; line-height: 1.55;
  }
  .nb-preview .md h1 { font-size: 22px; margin: 0 0 12px }
  .nb-preview .md h2 { font-size: 16px; margin: 20px 0 8px }
  .nb-preview .md h3 { font-size: 14px; margin: 16px 0 6px }
  .nb-preview .md p { margin: 0 0 10px }
  .nb-preview .md ul, .nb-preview .md ol { margin: 0 0 12px; padding-left: 1.4rem }
  .nb-preview .md code {
    font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--hover);
    color: var(--fg); padding: 1px 5px; border-radius: 4px;
  }
  .nb-preview .md pre {
    background: #f1f5f9; color: var(--fg); padding: 12px; border-radius: 8px;
    border: 1px solid var(--border);
    overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace;
  }
  .nb-preview .md pre code {
    background: transparent; color: inherit; padding: 0; border-radius: 0;
  }
  .nb-preview .md a.doc-link, .nb-preview .md a.page-link {
    color: #0f766e; font-weight: 600; text-decoration: underline;
  }
  .nb-preview .md table { border-collapse: collapse; width: 100%; margin: 0 0 12px; font-size: 13px }
  .nb-preview .md th, .nb-preview .md td {
    border: 1px solid var(--border); padding: 6px 8px; text-align: left;
  }
  .nb-dirty { color: var(--warn); font-size: 12px; font-weight: 600 }
  .nb-doc {
    border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
  }
  .nb-doc .doc-head { flex-shrink: 0 }
  .nb-doc .doc-body { flex: 1; min-height: 0; overflow: auto }
  .nb-doc .preview-frame { width: 100%; height: 100%; min-height: 360px; border: 0; background: #111 }
  .nb-doc .preview-img { max-width: 100%; height: auto; display: block; margin: 0 auto }
  .nb-doc-empty {
    padding: 24px; color: var(--muted); font-size: 13px; line-height: 1.45;
  }

  .explorer {
    display: grid; grid-template-columns: 1fr; height: 100%; min-height: 0; background: var(--bg);
  }
  .explorer.has-preview {
    grid-template-columns: minmax(260px, 38%) minmax(0, 1fr);
  }
  .explorer-main {
    min-width: 0; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel);
  }
  .explorer.has-preview .explorer-main {
    border-right: 1px solid var(--border);
  }
  .explorer-head {
    flex-shrink: 0; padding: 16px 18px 14px;
    border-bottom: 1px solid #cbd5e1;
    display: flex; flex-direction: column; gap: 12px;
    background: #f8fafc;
  }
  .explorer-nav {
    flex-shrink: 0; padding: 10px 18px;
    border-bottom: 1px solid #cbd5e1;
    background: #fff;
    overflow: hidden; min-width: 0;
  }
  .explorer-browse {
    display: flex; align-items: center;
  }
  .explorer-browse .seg {
    display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .explorer-browse .seg button {
    border: 0; border-radius: 0; background: #fff; padding: 8px 14px;
    font-size: 13px; font-weight: 600; color: var(--muted-strong);
  }
  .explorer-browse .seg button.active { background: var(--ink); color: #fff }
  .explorer-search {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.55rem;
    align-items: center;
  }
  .explorer-search .search-icon {
    display: grid; place-items: center;
    width: 2.55rem; height: 2.55rem; flex-shrink: 0;
    border: 0; padding: 0; cursor: pointer;
    border-radius: 12px; background: #e8eef6; color: #2563eb;
  }
  .explorer-search .search-icon:hover { background: #dbe7f5 }
  .explorer-search.is-searching .search-icon {
    background: #ffe566; color: #5c4500;
  }
  .explorer-search.is-searching .search-icon:hover { background: #ffef9a }
  .explorer-search .search-icon svg { width: 1.35rem; height: 1.35rem; display: block }
  .explorer-search input {
    width: 100%; min-width: 0;
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
    padding: 0.75rem 0.85rem; font: 500 0.95rem/1.2 inherit; color: var(--fg);
    outline: none;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .explorer-search input:focus {
    border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .explorer-search.is-searching input {
    background: #fff3a3; border-color: #e0c44a;
    box-shadow: 0 0 0 3px rgba(224, 196, 74, 0.35);
  }
  .explorer-search.is-searching input:focus {
    border-color: #c9a820; box-shadow: 0 0 0 3px rgba(224, 196, 74, 0.5);
  }
  .explorer-search .search-clear-btn {
    border: 1px solid #e0c44a; background: #fff8d1; color: #5c4500;
    border-radius: 10px; padding: 0 0.85rem; align-self: stretch;
    font: 650 0.82rem inherit; cursor: pointer; white-space: nowrap;
  }
  .explorer-search .search-clear-btn:hover { background: #ffef9a }
  .explorer-search .search-clear-btn[hidden] { display: none !important }
  .search-result-meta {
    font-size: 12px; color: var(--muted-strong); padding: 0 4px;
  }
  .explorer-stage {
    view-transition-name: explorer-stage;
    height: 100%; min-height: 0;
  }
  @supports (view-transition-name: none) {
    ::view-transition-old(explorer-stage),
    ::view-transition-new(explorer-stage) {
      animation-duration: 0.28s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }
    ::view-transition-old(explorer-stage) {
      animation-name: explorer-vt-out;
    }
    ::view-transition-new(explorer-stage) {
      animation-name: explorer-vt-in;
    }
    @keyframes explorer-vt-out {
      to { opacity: 0; transform: translateX(-12px); }
    }
    @keyframes explorer-vt-in {
      from { opacity: 0; transform: translateX(14px); }
    }
  }
  .facet-banner {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 12px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .facet-banner strong { font-weight: 650; color: var(--fg) }
  .facet-banner .facet-banner-copy {
    min-width: 0; flex: 1 1 auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted-strong);
  }
  .facet-banner .facet-banner-count {
    flex: 0 0 auto; color: var(--muted-strong); font-variant-numeric: tabular-nums;
  }
  .search-match-strip {
    flex: 0 0 auto; background: #fffbeb; border-bottom: 1px solid #fde68a;
    padding: 10px 14px; color: var(--fg);
  }
  .search-match-strip .search-match-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #a16207; margin-bottom: 4px;
  }
  .search-match-snip {
    margin: 0; font: 13.5px/1.5 Georgia, "Times New Roman", serif;
  }
  .search-match-snip + .search-match-snip { margin-top: 6px }
  .preview-stack {
    display: flex; flex-direction: column; height: 100%; min-height: 0;
  }
  .preview-stack .preview-media {
    flex: 1; min-height: 0; background: #111;
  }
  .preview-stack .preview-media .preview-frame,
  .preview-stack .preview-media .preview-img {
    width: 100%; height: 100%; min-height: 0;
  }
  .explorer-trail {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    width: 100%; min-width: 0;
  }
  .explorer-trail .entity-back-btn { flex: 0 0 auto; align-self: flex-start }
  .crumbs {
    display: flex; align-items: center; flex-wrap: nowrap; gap: 6px;
    min-width: 0; width: 100%; font-size: 13px; color: var(--muted-strong); line-height: 1.3;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
  }
  .crumbs a {
    flex: 0 1 auto; max-width: 10rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer; color: var(--fg); font-weight: 650;
    text-decoration: underline; text-decoration-color: #cbd5e1;
    text-underline-offset: 2px;
  }
  .crumbs a:hover { text-decoration-color: var(--fg) }
  .crumbs .crumb-sep { flex: 0 0 auto; color: var(--muted); font-weight: 500; user-select: none }
  .crumbs .crumb-ellipsis { flex: 0 0 auto; color: var(--muted-strong); font-weight: 700; letter-spacing: 0.04em }
  .crumbs .crumb-here {
    flex: 0 1 auto; max-width: 12rem; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink); font-weight: 750;
  }
  .explorer-list {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); overflow: hidden; position: relative; z-index: 0;
  }
  .file-list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1 }
  .file-list li {
    display: block; padding: 12px 18px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .file-list li:hover { background: var(--hover) }
  .file-list li.active {
    background: #e8eef7;
    box-shadow: inset 3px 0 0 var(--ink);
  }
  .file-list .file-name {
    font-size: 14px; font-weight: 600; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file-list .file-path {
    margin-top: 2px; font-size: 12px; color: var(--muted-strong);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file-list .file-snip {
    margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--muted-strong);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .badge {
    font-size: 10px; text-transform: uppercase; color: var(--muted-strong);
    font-weight: 700; margin-right: 6px;
  }
  .bates { font-size: 12px; color: var(--fg); font-weight: 600 }
  .meta { color: var(--muted-strong); font-size: 12px }
  .doc-pane {
    min-height: 0; display: flex; flex-direction: column; background: var(--bg);
  }
  .doc-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted-strong); padding: 24px; text-align: center;
  }
  .doc-head {
    background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 16px 0;
  }
  .doc-title-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap }
  .doc-title-row h1 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; min-width: 160px }
  .doc-actions { display: flex; gap: 8px; flex-wrap: wrap }
  .tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto }
  .doc-body { flex: 1; min-height: 0; overflow: auto; padding: 16px }
  .doc-body.is-preview {
    padding: 0; overflow: hidden; background: #111;
  }
  .panel-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; max-width: 960px;
  }
  .panel-card:has(.doc-prose) {
    border: 0; background: transparent; border-radius: 0; padding: 8px 12px 24px; max-width: none;
  }
  .preview-frame {
    width: 100%; height: 100%; min-height: 360px;
    border: 0; border-radius: 0; background: #111; display: block;
  }
  .doc-body.is-preview .preview-frame {
    height: 100%; min-height: 0;
  }
  .preview-img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: #111;
  }
  .doc-body:not(.is-preview) .preview-frame {
    height: calc(100vh - 180px);
  }
  .doc-body:not(.is-preview) .preview-img {
    max-height: calc(100vh - 200px); width: auto; margin: 0 auto;
  }
  .text-body {
    white-space: pre-wrap; word-break: break-word;
    font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace; margin: 0;
  }
  .doc-prose {
    margin: 0; max-width: 40rem;
    font: 15px/1.65 Georgia, "Times New Roman", serif;
    color: var(--fg); white-space: pre-wrap; word-break: break-word;
  }
  mark.search-hit {
    background: #fef08a; color: inherit; padding: 0 0.12em; border-radius: 2px;
  }
  table.meta-table { width: 100%; border-collapse: collapse; font-size: 13px }
  table.meta-table th, table.meta-table td {
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top;
  }
  table.meta-table th { width: 160px; color: var(--muted-strong); font-weight: 600 }
  .entity-list, .tag-list { display: flex; flex-direction: column; gap: 8px }
  .tag-list { flex-direction: row; flex-wrap: wrap; gap: 8px }
  .entity-row {
    display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 10px;
    align-items: center;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: inherit; font: inherit; text-align: left;
    width: 100%; cursor: pointer;
  }
  button.entity-row:hover {
    background: var(--hover); border-color: #94a3b8;
  }
  .entity-type {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: var(--muted-strong); align-self: start; padding-top: 2px;
  }
  .entity-row .entity-main { min-width: 0 }
  .entity-row .entity-main .entity-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .facet-count {
    flex: 0 0 auto; font-size: 12px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--muted-strong);
    white-space: nowrap;
  }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0; padding: 6px 10px 6px 12px;
    background: var(--hover); color: var(--fg); border-radius: 999px;
    border: 1px solid transparent; font: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button.tag-chip:hover {
    border-color: #94a3b8; background: #e8eef7;
  }
  .tag-chip .facet-count {
    padding: 1px 7px; border-radius: 999px; background: #fff;
    border: 1px solid var(--border); font-size: 11px;
  }
  .hits-pane {
    padding: 12px 20px; border-top: 1px solid var(--border); overflow: auto; max-height: 36%;
    background: #f8fafc;
  }
  .hit {
    padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; cursor: pointer; background: var(--panel);
  }
  .hit:hover { border-color: #94a3b8 }
  .err { color: var(--danger); padding: 16px }
  .placeholder { color: var(--muted-strong); padding: 16px }
  @media (max-width: 900px) {
    header .inner { padding: 8px 16px }
    .home-wrap { padding: 16px }
    .case-shell { grid-template-columns: 1fr }
    .case-nav { border-right: 0; border-bottom: 1px solid var(--border) }
    .case-nav-list { flex-direction: row; flex-wrap: wrap }
    .explorer, .explorer.has-preview { grid-template-columns: 1fr }
    .explorer.has-preview .explorer-main { border-right: 0; border-bottom: 1px solid var(--border); max-height: 42vh }
    .explorer-head { padding: 12px 14px 10px }
  }
</style>
</head>
<body>
<header class="app-bar">
  <div class="inner">
    <button type="button" class="brand" id="btnHome">MARSHAL</button>
  </div>
</header>
<main id="main"></main>

<div class="case-rename-modal" id="caseRenameModal" hidden>
  <div class="case-rename-backdrop" data-case-rename-dismiss="1"></div>
  <div class="case-rename-card" role="dialog" aria-modal="true" aria-labelledby="caseRenameTitle">
    <div class="case-rename-head">
      <h2 id="caseRenameTitle">Rename case</h2>
      <button type="button" class="case-rename-close" aria-label="Close" data-case-rename-dismiss="1">&times;</button>
    </div>
    <div class="case-rename-body">
      <input id="caseRenameInput" type="text" autocomplete="off" aria-label="Case name" />
      <p class="case-rename-status" id="caseRenameStatus" hidden></p>
    </div>
    <div class="case-rename-actions">
      <button type="button" class="ghost" data-case-rename-dismiss="1">Cancel</button>
      <button type="button" class="primary" id="caseRenameSave">Save</button>
    </div>
  </div>
</div>

<div class="case-rename-modal" id="csliPinModal" hidden>
  <div class="case-rename-backdrop" data-csli-pin-dismiss="1"></div>
  <div class="case-rename-card pin-card" role="dialog" aria-modal="true" aria-labelledby="csliPinTitle">
    <div class="case-rename-head">
      <h2 id="csliPinTitle">Pin location</h2>
      <button type="button" class="case-rename-close" aria-label="Close" data-csli-pin-dismiss="1">&times;</button>
    </div>
    <div class="case-rename-body">
      <p class="pin-meta" id="csliPinCoords"></p>
      <label for="csliPinLabel">Label</label>
      <input id="csliPinLabel" type="text" autocomplete="off" placeholder="e.g. Hope Manor shooting" />
      <label for="csliPinNote">Note</label>
      <textarea id="csliPinNote" placeholder="Address, report #, source…"></textarea>
      <div class="pin-when-row">
        <div>
          <label for="csliPinDate">Event date</label>
          <input id="csliPinDate" type="date" />
        </div>
        <div>
          <label for="csliPinTime">Event time</label>
          <input id="csliPinTime" type="time" step="1" />
        </div>
      </div>
      <p class="pin-meta">Pin appears on this date in the timeline and on the map.</p>
      <p class="case-rename-status" id="csliPinStatus" hidden></p>
    </div>
    <div class="case-rename-actions">
      <button type="button" class="ghost danger" id="csliPinDelete" hidden>Delete</button>
      <span style="flex:1"></span>
      <button type="button" class="ghost" data-csli-pin-dismiss="1">Cancel</button>
      <button type="button" class="primary" id="csliPinSave">Save pin</button>
    </div>
  </div>
</div>

<div class="case-rename-modal" id="csliPhoneRenameModal" hidden>
  <div class="case-rename-backdrop" data-csli-phone-rename-dismiss="1"></div>
  <div class="case-rename-card" role="dialog" aria-modal="true" aria-labelledby="csliPhoneRenameTitle">
    <div class="case-rename-head">
      <h2 id="csliPhoneRenameTitle">Rename phone</h2>
      <button type="button" class="case-rename-close" aria-label="Close" data-csli-phone-rename-dismiss="1">&times;</button>
    </div>
    <div class="case-rename-body">
