<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Marshal</title>
<style>
  :root { --bg:#f4f4f1; --fg:#1a1a1a; --muted:#666; --border:#ddd9d2; --hover:#ebeae4; --accent:#1f4b3a; --panel:#fff; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  header h1{margin:0;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
  select,button,input{font:inherit;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .search-row{display:flex;gap:8px;flex:1;min-width:280px;align-items:center}
  .search-row input[type=search]{flex:1}
  .crumbs{padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;flex-wrap:wrap;gap:6px}
  .crumbs a{color:var(--accent);cursor:pointer;text-decoration:none}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,42%) 1fr}
  .list-pane,.preview-pane{min-height:0;overflow:auto;background:var(--panel)}
  .list-pane{border-right:1px solid var(--border)}
  ul{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
  li:hover,li.active{background:var(--hover)}
  .badge{font-size:10px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-right:8px}
  .bates{font-size:12px;color:var(--accent);font-weight:600}
  .meta{color:var(--muted);font-size:12px}
  .hits{border-top:1px solid var(--border)}
  .hit{padding:12px;border-bottom:1px solid var(--border)}
  .hit a{color:var(--accent)}
  .err{padding:16px;color:#b42318}
  .placeholder{padding:20px;color:var(--muted)}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Marshal</h1>
    <div id="status" class="meta">Loading…</div>
  </div>
  <div class="search-row">
    <select id="caseSelect"></select>
    <input id="q" type="search" placeholder="Keyword or semantic search…"/>
    <select id="mode">
      <option value="hybrid">hybrid</option>
      <option value="keyword">keyword</option>
      <option value="semantic">semantic</option>
    </select>
    <button id="btnSearch" class="primary" type="button">Search</button>
    <button id="btnBrowse" type="button">Browse</button>
  </div>
</header>
<nav class="crumbs" id="crumbs"></nav>
<div class="layout">
  <section class="list-pane">
    <ul id="list"></ul>
    <div id="hits" class="hits" hidden></div>
    <div id="empty" class="placeholder" hidden>Empty.</div>
    <div id="err" class="err" hidden></div>
  </section>
  <section class="preview-pane">
    <div class="placeholder" id="preview">Select a file or run a search. Bates labels show when ingested.</div>
  </section>
</div>
<script>
const qs = new URLSearchParams(location.search);
const state = { cases: [], caseId: qs.get("case_id") ? Number(qs.get("case_id")) : null, path: qs.get("path") || "", selected: null };

function fmtSize(n){ if(!n) return ""; if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(1)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function esc(s){ return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }

async function api(path){
  const res = await fetch(path);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.detail || data.error || res.statusText);
  return data;
}

async function loadCases(){
  const data = await api("/api/cases");
  state.cases = data.cases || [];
  const sel = document.getElementById("caseSelect");
  sel.innerHTML = "";
  for(const c of state.cases){
    const opt = document.createElement("option");
    opt.value = String(c.id);
    opt.textContent = c.display_name;
    sel.append(opt);
  }
  if(!state.caseId && (data.active?.id || state.cases[0]?.id)) state.caseId = data.active?.id || state.cases[0].id;
  if(state.caseId) sel.value = String(state.caseId);
  sel.onchange = () => { state.caseId = Number(sel.value); state.path=""; loadDir(""); };
}

function renderCrumbs(crumbs){
  const el = document.getElementById("crumbs");
  el.innerHTML = "";
  const root = document.createElement("a"); root.textContent = "Case root"; root.onclick = () => loadDir(""); el.append(root);
  for(const c of crumbs||[]){
    const sep = document.createElement("span"); sep.className="meta"; sep.textContent=" / "; el.append(sep);
    const a = document.createElement("a"); a.textContent=c.name; a.onclick=()=>loadDir(c.path); el.append(a);
  }
}

async function loadDir(path){
  document.getElementById("hits").hidden = true;
  document.getElementById("list").hidden = false;
  document.getElementById("err").hidden = true;
  document.getElementById("status").textContent = "Loading…";
  try{
    const data = await api(`/api/files/list?case_id=${state.caseId}&path=${encodeURIComponent(path||"")}`);
    state.path = data.path || "";
    document.getElementById("status").textContent = data.case_name || "";
    renderCrumbs(data.breadcrumbs);
    const list = document.getElementById("list");
    list.innerHTML = "";
    document.getElementById("empty").hidden = (data.entries||[]).length > 0;
    for(const e of data.entries||[]){
      const li = document.createElement("li");
      li.innerHTML = `<div><span class="badge">${e.type}</span>${esc(e.name)}
        ${e.bates?`<div class="bates">${esc(e.bates)}</div>`:""}</div>
        <div class="meta">${e.type==="file"?fmtSize(e.size):""}</div>`;
      li.onclick = () => {
        if(e.type==="dir") loadDir(e.path);
        else {
          state.selected = e;
          document.getElementById("preview").innerHTML =
            `<p><strong>${esc(e.name)}</strong></p>
             ${e.bates?`<p class="bates">Bates: ${esc(e.bates)}</p>`:""}
             <p class="meta">${esc(e.path)}</p>
             <p><a href="${esc(e.open_url)}" target="_blank">Open</a> ·
                <a href="${esc(e.download_url)}" target="_blank">Download</a></p>`;
        }
      };
      list.append(li);
    }
    const url = new URL(location.href);
    url.searchParams.set("case_id", String(state.caseId));
    if(state.path) url.searchParams.set("path", state.path); else url.searchParams.delete("path");
    history.replaceState(null,"",url);
  }catch(e){
    document.getElementById("err").hidden=false;
    document.getElementById("err").textContent = e.message || String(e);
  }
}

async function runSearch(){
  const q = document.getElementById("q").value.trim();
  if(!q) return;
  document.getElementById("list").hidden = true;
  document.getElementById("hits").hidden = false;
  document.getElementById("status").textContent = "Searching…";
  const mode = document.getElementById("mode").value;
  try{
    const data = await api(`/api/search?q=${encodeURIComponent(q)}&case_id=${state.caseId}&mode=${encodeURIComponent(mode)}`);
    document.getElementById("status").textContent = `${data.hits?.length||0} hits · ${mode}`;
    const box = document.getElementById("hits");
    box.innerHTML = "";
    for(const h of data.hits||[]){
      const div = document.createElement("div");
      div.className = "hit";
      div.innerHTML = `<div class="bates">${esc(h.bates||h.name||"")}</div>
        <div class="meta">${esc(h.rel_path)}</div>
        <p>${esc(h.snippet||"")}</p>
        <a href="${esc(h.open_url)}" target="_blank">Open</a>`;
      box.append(div);
    }
    if(!(data.hits||[]).length) box.innerHTML = `<div class="placeholder">No hits.</div>`;
  }catch(e){
    document.getElementById("err").hidden=false;
    document.getElementById("err").textContent = e.message || String(e);
  }
}

document.getElementById("btnSearch").onclick = runSearch;
document.getElementById("btnBrowse").onclick = () => loadDir(state.path||"");
document.getElementById("q").addEventListener("keydown", (e)=>{ if(e.key==="Enter") runSearch(); });

(async function init(){
  try{
    await loadCases();
    await loadDir(state.path);
  }catch(e){
    document.getElementById("err").hidden=false;
    document.getElementById("err").textContent = e.message || String(e);
  }
})();
</script>
</body>
</html>
