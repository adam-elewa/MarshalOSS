<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Marshal</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --muted: #94a3b8;
    --muted-strong: #64748b;
    --border: #e2e8f0;
    --hover: #f1f5f9;
    --panel: #fff;
    --ink: #020617;
    --danger: #b42318;
    --warn: #b45309;
    --ok: #166534;
  }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body {
    font: 14px/1.45 Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
  }
  a { color: var(--fg); text-decoration: none }
  a:hover { text-decoration: underline }

  header.app-bar { background: var(--panel); border-bottom: 1px solid var(--border) }
  header .inner {
    max-width: 90rem; margin: 0 auto; padding: 8px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  header .brand {
    font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
    cursor: pointer; border: 0; background: none; padding: 0; color: var(--fg);
  }

  select, button, input {
    font: inherit; border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; background: #fff; color: var(--fg);
  }
  button { cursor: pointer }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink) }
  button.ghost { background: transparent }
  button.tab {
    border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    background: transparent; padding: 10px 14px; color: var(--muted-strong); font-weight: 600;
  }
  button.tab.active { color: var(--fg); border-bottom-color: var(--ink) }
  button.linkish {
    border: 0; background: transparent; padding: 0; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  button.linkish:hover { text-decoration: underline }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column }

  .home-wrap { flex: 1; overflow: auto; padding: 20px 32px 40px }
  .cases-grid {
    max-width: 90rem; margin: 0 auto; display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); align-items: stretch;
  }
  .case-tile {
    display: flex; flex-direction: column; width: 100%; max-width: 24rem;
    overflow: hidden; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    padding: 0; text-align: left; cursor: pointer; transition: box-shadow 0.15s ease;
  }
  .case-tile:hover { box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1) }
  .case-tile .body { flex: 1; display: flex; flex-direction: column; padding: 20px 24px }
  .case-tile .title-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .case-tile h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--fg); min-width: 0 }
  .case-tile .grow { flex: 1 }
  .case-rename-pen {
    flex: 0 0 auto; border: 0; background: transparent; color: var(--muted-strong);
    cursor: pointer; padding: 2px; border-radius: 4px; line-height: 0;
  }
  .case-rename-pen:hover { color: var(--fg); background: var(--hover) }
  .case-rename-pen svg { width: 14px; height: 14px; display: block }
  .case-rename-modal[hidden] { display: none !important }
  .case-rename-modal {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    padding: 1.25rem;
  }
  .case-rename-backdrop {
    position: absolute; inset: 0; background: rgba(15, 23, 42, 0.42);
  }
  .case-rename-card {
    position: relative; z-index: 1; width: min(24rem, 100%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18); padding: 1rem 1.1rem 1.05rem;
  }
  .case-rename-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    margin-bottom: 0.85rem;
  }
  .case-rename-head h2 {
    margin: 0; font-size: 15px; font-weight: 650; color: var(--fg);
  }
  .case-rename-close {
    border: 0; background: transparent; color: var(--muted-strong);
    font-size: 1.35rem; line-height: 1; cursor: pointer; padding: 0.1rem 0.35rem;
  }
  .case-rename-close:hover { color: var(--fg) }
  .case-rename-body { display: grid; gap: 0.35rem }
  .case-rename-body input {
    width: 100%; padding: 0.55rem 0.7rem; border-radius: 8px;
  }
  .case-rename-status {
    margin: 0.55rem 0 0; font-size: 12px; color: var(--danger); min-height: 1.1em;
  }
  .case-rename-actions {
    display: flex; justify-content: flex-end; gap: 0.45rem; margin-top: 1rem;
  }
  .case-tile .view-bar {
    display: flex; align-items: center; justify-content: center;
    background: #020617; color: #fff; padding: 16px; font-size: 14px; font-weight: 500;
  }
  .case-tile:hover .view-bar { background: #000 }
  .empty-cases {
    max-width: 36rem; margin: 24px auto 0; border: 1px solid #fde68a;
    background: #fffbeb; border-radius: 12px; padding: 24px;
  }
  .empty-cases h2 { margin: 0; color: #78350f; font-size: 16px }
  .empty-cases p { margin: 8px 0 0; color: #92400e; font-size: 14px; line-height: 1.5 }

  .case-shell {
    display: grid; grid-template-columns: 15rem 1fr; height: 100%; min-height: 0;
  }
  .case-nav {
    border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .case-nav-head { border-bottom: 1px solid var(--border); padding: 16px }
  .case-nav-head .all {
    font-size: 11px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); cursor: pointer;
    border: 0; background: none; padding: 0;
  }
  .case-nav-head .all:hover { color: var(--muted-strong) }
  .case-nav-head h1 { margin: 8px 0 0; font-size: 14px; font-weight: 600; line-height: 1.35 }
  .case-nav-list { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px }
  .case-nav-list button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 0; border-radius: 8px; padding: 8px 12px; text-align: left;
    background: transparent; color: #334155; font-size: 14px;
  }
  .case-nav-list button:hover { background: var(--hover) }
  .case-nav-list button.active { background: var(--ink); color: #fff }
  .case-nav-list .nav-ico { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85 }
  .case-content { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg) }
  .bwc-host { flex: 1; min-height: 0; display: flex; flex-direction: column }
  .bwc-host iframe { flex: 1; width: 100%; border: 0; background: #f3f5f7 }

  .overview { flex: 1; overflow: auto; padding: 28px 32px 40px }
  .overview-intro {
    max-width: 56rem; margin-bottom: 4px;
  }
  .overview-intro h1 {
    margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.03em;
  }
  .overview-tiles {
    display: grid; gap: 14px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width: 56rem;
    margin-top: 20px;
  }
  .overview-tile {
    aspect-ratio: 1.15 / 1;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
    text-align: left; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 18px 12px; cursor: pointer; color: var(--fg);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .overview-tile:hover {
    border-color: #94a3b8; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08); transform: translateY(-1px);
  }
  .overview-tile.active {
    border-color: var(--ink); border-width: 2px;
    box-shadow: 0 0 0 3px rgba(2, 6, 23, 0.16), 0 8px 22px rgba(15, 23, 42, 0.14);
  }
  .overview-tile.warn.active {
    border-color: #d97706; border-width: 2px;
    box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.22), 0 8px 22px rgba(15, 23, 42, 0.12);
  }
  .overview-tile .tile-top { min-width: 0; width: 100% }
  .overview-tile .tile-label {
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2;
    color: var(--fg);
  }
  .overview-tile.warn .tile-label { color: #b45309 }
  .overview-tile .tile-stat { margin-top: 8px }
  .overview-tile .tile-value {
    font-size: 32px; font-weight: 700; letter-spacing: -0.045em; line-height: 1;
    color: var(--fg);
  }
  .overview-tile .tile-blurb {
    margin: 0; font-size: 13.5px; font-weight: 500; line-height: 1.35; color: var(--fg);
  }
  .overview-detail {
    max-width: 72rem; margin-top: 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 16px 14px;
  }
  .overview-detail .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .overview-detail .panel-head h2 {
    margin: 0; font-size: 15px; font-weight: 650;
  }
  .overview-detail .panel-blurb {
    margin: 0 0 12px; font-size: 13px; line-height: 1.45; color: var(--muted-strong);
  }
  .files-detail {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0; min-height: 140px; overflow: hidden; border-radius: 12px;
    border: 1px solid var(--border);
  }
  .files-detail-cta {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 28px 20px; border: 0; border-radius: 0;
    background: var(--ink); color: #fff; cursor: pointer; text-align: center;
    font: inherit; width: 100%; height: 100%;
    transition: background 0.15s ease;
  }
  .files-detail-cta:hover { background: #000 }
  .files-detail-cta .cta-label {
    font-size: 15px; font-weight: 650; letter-spacing: -0.01em;
  }
  .files-detail-cta .cta-ico {
    width: 22px; height: 22px; opacity: 0.9;
  }
  .files-detail-copy {
    display: flex; align-items: center; padding: 24px 22px;
    background: #f8fafc; color: var(--muted-strong);
    font-size: 14px; line-height: 1.5;
  }
  .files-detail-copy p { margin: 0 }
  @media (max-width: 700px) {
    .files-detail { grid-template-columns: 1fr }
  }
  .attention-split {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 42%);
    gap: 12px; align-items: stretch; min-height: 360px;
  }
  .attention-list { min-width: 0; min-height: 0; display: flex; flex-direction: column }
  .attention-preview {
    min-width: 0; min-height: 0; border: 1px solid var(--border); border-radius: 10px;
    background: #f8fafc; display: flex; flex-direction: column; overflow: hidden;
  }
  .attention-preview .ap-head {
    flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: var(--panel); font-size: 13px; font-weight: 650;
  }
  .attention-preview .ap-head-text { min-width: 0 }
  .attention-preview .ap-head .meta {
    font-weight: 500; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ap-actions, .doc-actions {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .dl-icon-btn,
  .open-icon-btn,
  .attention-preview .ap-dl,
  .attention-preview .ap-open {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px; text-decoration: none;
  }
  .dl-icon-btn,
  .attention-preview .ap-dl {
    border: 1px solid #a7f3d0; background: #ecfdf5; color: #047857;
  }
  .dl-icon-btn:hover,
  .attention-preview .ap-dl:hover { background: #d1fae5; color: #065f46; border-color: #6ee7b7 }
  .open-icon-btn,
  .attention-preview .ap-open {
    border: 1px solid #93c5fd; background: #eff6ff; color: #2563eb;
  }
  .open-icon-btn:hover,
  .attention-preview .ap-open:hover { background: #dbeafe; color: #1d4ed8; border-color: #60a5fa }
  .dl-icon-btn svg,
  .open-icon-btn svg,
  .attention-preview .ap-dl svg,
  .attention-preview .ap-open svg { width: 16px; height: 16px }
  .attention-preview .ap-body { flex: 1; min-height: 0; overflow: auto }
  .attention-preview .preview-frame { width: 100%; height: 100%; min-height: 320px; border: 0; background: #111 }
  .attention-preview .preview-img { max-width: 100%; height: auto; display: block; margin: 0 auto }
  .attention-preview .ap-empty {
    padding: 24px 16px; color: var(--muted-strong); font-size: 13px; line-height: 1.45;
  }
  .manifest-table tr.active { background: #e8eef7 }
  @media (max-width: 900px) {
    .overview { padding: 20px 16px 32px }
    .overview-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) }
    .attention-split, .entity-split { grid-template-columns: 1fr }
    .entity-cols.has-docs { grid-template-columns: 1fr }
  }
  .warn-ico {
    display: inline-flex; width: 16px; height: 16px; color: #d97706; flex-shrink: 0;
    vertical-align: -2px; margin-right: 6px;
  }
  .manifest-table td.file-cell {
    max-width: 420px;
  }
  .manifest-table td.file-cell .file-main {
    display: flex; align-items: flex-start; gap: 6px;
  }
  .manifest-table td.file-cell .path-text {
    min-width: 0; word-break: break-word;
  }
  .manifest-foot {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted-strong);
  }
  .manifest-pager {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .manifest-pager button {
    padding: 5px 10px; font-size: 12px;
  }
  .manifest-pager button:disabled {
    opacity: 0.45; cursor: not-allowed;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .stat .label { font-size: 12px; color: var(--muted-strong); font-weight: 500 }
  .stat .value { margin-top: 6px; font-size: 20px; font-weight: 650; letter-spacing: -0.02em }
  .accordion {
    max-width: 1100px; margin-top: 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .acc-item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .acc-head {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border: 0; border-radius: 0; background: transparent;
    text-align: left; cursor: pointer; color: var(--fg);
  }
  .acc-head:hover { background: var(--hover) }
  .acc-head .chev {
    width: 16px; height: 16px; flex-shrink: 0; color: var(--muted-strong);
    transition: transform 0.15s ease;
  }
  .acc-item.open .acc-head .chev { transform: rotate(90deg) }
  .acc-head .acc-title {
    flex: 1; min-width: 0; font-size: 14px; font-weight: 650;
  }
  .acc-head .acc-meta {
    font-size: 12px; color: var(--muted-strong); white-space: nowrap;
  }
  .acc-head .acc-warn { color: var(--warn); font-weight: 600 }
  .acc-body {
    display: none; padding: 0 16px 16px;
    border-top: 1px solid var(--border);
  }
  .acc-item.open .acc-body { display: block; padding-top: 14px }
  .section-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .section-head h2 { margin: 0; font-size: 13px; font-weight: 650; color: var(--muted-strong) }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; background: var(--hover); cursor: pointer;
  }
  .chip:hover { border-color: #94a3b8; background: #e2e8f0 }
  .chip .n { color: var(--muted-strong); font-weight: 600 }
  .entity-stage {
    view-transition-name: entity-stage;
  }
  .entity-split {
    display: grid; grid-template-columns: minmax(220px, 34%) minmax(0, 1fr);
    gap: 12px; align-items: stretch; min-height: 420px;
  }
  .entity-docs-pane {
    min-width: 0; min-height: 0; display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    background: var(--panel); max-height: 520px;
  }
  .entity-docs-pane .entity-toolbar {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-bottom: 1px solid var(--border); background: #f8fafc;
  }
  .entity-back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); background: var(--panel); color: var(--fg);
    border-radius: 8px; padding: 5px 10px 5px 8px; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 650; line-height: 1;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .entity-back-btn:hover { background: var(--hover); border-color: #94a3b8 }
  .entity-back-btn svg { width: 14px; height: 14px; flex-shrink: 0 }
  .entity-toolbar .entity-context {
    min-width: 0; font-size: 12px; color: var(--muted-strong);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entity-toolbar .entity-context strong { color: var(--fg); font-weight: 650 }
  .entity-docs-pane .entity-col-list { flex: 1; min-height: 0; overflow: auto }
  .entity-cols {
    display: grid; grid-template-columns: minmax(10rem, 14rem) minmax(0, 1fr);
    gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    min-height: 0; background: var(--panel);
  }
  .entity-cols.has-docs {
    grid-template-columns: minmax(9rem, 12rem) minmax(0, 1fr) minmax(0, 1.15fr);
  }
  .entity-cols.has-docs-2 {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  }
  .entity-cols.tags-only {
    grid-template-columns: minmax(0, 1fr);
  }
  .tag-alpha {
    display: flex; flex-wrap: wrap; gap: 2px; align-items: center;
    padding: 8px 10px; border-bottom: 1px solid var(--border); background: #f8fafc;
  }
  .tag-alpha button {
    min-width: 22px; height: 24px; padding: 0 4px; border: 0; border-radius: 5px;
    background: transparent; color: var(--muted-strong); font: inherit; font-size: 11px;
    font-weight: 650; cursor: pointer; line-height: 1;
  }
  .tag-alpha button:hover:not(:disabled) { background: var(--hover); color: var(--fg) }
  .tag-alpha button.active { background: var(--ink); color: #fff }
  .tag-alpha button:disabled { opacity: 0.28; cursor: default }
  .tag-alpha .tag-alpha-all {
    margin-right: 4px; padding: 0 7px; font-size: 10px; letter-spacing: 0.04em;
  }
  @supports (view-transition-name: none) {
    ::view-transition-old(entity-stage),
    ::view-transition-new(entity-stage) {
      animation-duration: 0.32s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }
    ::view-transition-old(entity-stage) {
      animation-name: entity-vt-out;
    }
    ::view-transition-new(entity-stage) {
      animation-name: entity-vt-in;
    }
    @keyframes entity-vt-out {
      to { opacity: 0; transform: scale(0.985); }
    }
    @keyframes entity-vt-in {
      from { opacity: 0; transform: scale(1.015); }
    }
  }
  .entity-col {
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }
  .entity-col + .entity-col { border-left: 1px solid var(--border) }
  .entity-col-head {
    flex-shrink: 0; padding: 8px 12px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-strong);
    border-bottom: 1px solid var(--border); background: #f8fafc;
  }
  .entity-col-list {
    list-style: none; margin: 0; padding: 4px; overflow: visible; flex: 0 0 auto;
  }
  .entity-col-foot {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; padding: 6px 8px; border-top: 1px solid var(--border);
    background: #f8fafc; font-size: 11px; color: var(--muted-strong);
    position: relative; z-index: 1;
  }
  .entity-col-foot .manifest-pager { gap: 4px }
  .entity-col-foot .manifest-pager button { padding: 4px 8px; font-size: 11px }
  .entity-col-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; border: 0; background: transparent; text-align: left;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--fg); font: inherit;
  }
  .entity-col-item:hover { background: var(--hover) }
  .entity-col-item.active {
    background: #e8eef7; font-weight: 650;
  }
  .entity-col-item .label {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entity-col-item .n {
    flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--muted-strong);
  }
  .entity-col-item .chev {
    flex: 0 0 auto; width: 12px; height: 12px; color: var(--muted);
  }
  .entity-col-empty {
    padding: 16px 12px; color: var(--muted-strong); font-size: 13px;
  }

  /* Notebook — raw wiki (tree | page | optional discovery side viewer) */

  .entity-list, .tag-list { display: flex; flex-direction: column; gap: 8px }

<body>
<header class="app-bar">
  <div class="inner">
    <button type="button" class="brand" id="btnHome">MARSHAL</button>
  </div>
</header>
<main id="main"></main>

<div class="case-rename-modal" id="caseRenameModal" hidden>
  <div class="case-rename-backdrop" data-case-rename-dismiss="1"></div>
  <div class="case-rename-card" role="dialog" aria-modal="true" aria-labelledby="caseRenameTitle">
    <div class="case-rename-head">
      <h2 id="caseRenameTitle">Rename case</h2>
      <button type="button" class="case-rename-close" aria-label="Close" data-case-rename-dismiss="1">&times;</button>
    </div>
    <div class="case-rename-body">
      <input id="caseRenameInput" type="text" autocomplete="off" aria-label="Case name" />
      <p class="case-rename-status" id="caseRenameStatus" hidden></p>
    </div>
    <div class="case-rename-actions">
      <button type="button" class="ghost" data-case-rename-dismiss="1">Cancel</button>
      <button type="button" class="primary" id="caseRenameSave">Save</button>
    </div>
  </div>
</div>

<script>
const state = {
  route: { name: "home" },
  cases: [],
  active: null,
  caseId: null,
  caseMeta: null,
  module: "overview",
  overview: null,
  manifestFilter: "unprocessed", // unprocessed | low_confidence
  manifestPage: 1,
  entityBrowseType: null, // null = type list; string = drill into that type
  entityTypePage: 1,
  entityNamePage: 1,
  entityDocPage: 1,
  overviewEntity: null, // { entity, entity_type } selected in overview
  overviewEntityFiles: [],
  overviewEntityLoading: false,
  overviewTag: null, // tag string selected in overview
  overviewTagFiles: [],
  overviewTagLoading: false,
  tagPage: 1,
  tagDocPage: 1,
  tagLetter: null, // null = all | "A".."Z" | "#"
  overviewFocus: "files", // null | attention | entities | tags | files
  overviewDocPath: null,
  overviewDoc: null,
  overviewOpen: {}, // section id -> bool; default collapsed
  browseMode: "categories", // categories | folders
  category: null, // category id when drilling in
  path: "",
  entries: [],
  breadcrumbs: [],
  selectedPath: null,
  doc: null,
  tab: "preview",
  hits: null,
  facet: null, // { tag?, entity?, entity_type? }
  notebookPages: [],
  notebookPath: "Home",
  notebookPage: null,
  notebookDraftTitle: "",
  notebookDraftBody: "",
  notebookDirty: false,
  notebookMode: "preview", // edit | preview
  notebookExpanded: {}, // path -> bool for tree twisties
  notebookDocPath: null, // discovery file open in side viewer
  notebookDoc: null,
  notebookDocTab: "preview",
  err: null,
};

function esc(s) {
  return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function fmtSize(n) {
  if (n == null || n === "") return "—";
  n = Number(n);
  if (!Number.isFinite(n)) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function fmtNum(n) {
  if (n == null) return "—";
  return Number(n).toLocaleString();
}
/** Viewer label: essex_county / New_Jersey → Essex County / New Jersey */
function prettyLabel(s) {
  return String(s ?? "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/\b([a-zA-Z])/g, (ch) => ch.toUpperCase());
}
function prettyType(s) {
  return prettyLabel(s);
}
function fmtConf(score) {
  if (score == null || score === "") return "—";
  const n = Number(score);
  if (!Number.isFinite(n)) return "—";
  return (n * 100).toFixed(0) + "%";
}
function confClass(score) {
  if (score == null || score === "") return "";
  const n = Number(score);
  if (n < 0.72) return "low";
  if (n >= 0.85) return "high";
  return "";
}
async function api(path) {
  const res = await fetch(path);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = data.detail;
    const msg = typeof detail === "string" ? detail
      : Array.isArray(detail) ? detail.map(d => d.msg || JSON.stringify(d)).join("; ")
      : (data.error || res.statusText);
    throw new Error(msg);
  }
  return data;
}

function parseHash() {
  const h = (location.hash || "#/").replace(/^#/, "") || "/";
  const [pathPart, queryPart] = h.split("?");
  const parts = pathPart.split("/").filter(Boolean);
  const qs = new URLSearchParams(queryPart || "");
  if (parts[0] === "cases" && parts[1]) {
    const caseId = Number(parts[1]);
    const docPath = qs.get("doc") || null;
    const tab = qs.get("tab") || "preview";
    const folder = qs.get("path") || "";
    const tag = qs.get("tag") || null;
    const entity = qs.get("entity") || null;
    const entity_type = qs.get("entity_type") || null;
    const browseMode = qs.get("browse") === "folders" ? "folders" : "categories";
    const category = qs.get("category") || null;
    const notebookPath = qs.get("page") || "Home";
    const view = qs.get("view") || "overview";
    const hasFacet = !!(tag || entity || entity_type);
    let module = "overview";
    if (view === "notebook") module = "notebook";
    else if (view === "bwc" || view === "bodycam") module = "bwc";
    else if (view === "explorer" || docPath || folder || category || hasFacet) module = "explorer";
    const facet = hasFacet ? { tag, entity, entity_type } : null;
    return {
      name: "case", caseId, module, docPath, tab, folder, facet, browseMode, category, notebookPath,
    };
  }
  return { name: "home" };
}

function setHash(route) {
  if (route.name === "home") {
    history.replaceState(null, "", "#/");
    return;
  }
  const qs = new URLSearchParams();
  qs.set("view", route.module || "overview");
  if (route.module === "explorer") {
    const browseMode = route.browseMode || "categories";
    if (browseMode === "folders") qs.set("browse", "folders");
    else qs.set("browse", "categories");
    if (browseMode === "folders" && route.folder) qs.set("path", route.folder);
    if (browseMode === "categories" && route.category) qs.set("category", route.category);
    if (route.docPath) qs.set("doc", route.docPath);
    if (route.tab && route.tab !== "preview") qs.set("tab", route.tab);
    if (route.facet?.tag) qs.set("tag", route.facet.tag);
    if (route.facet?.entity) qs.set("entity", route.facet.entity);
    if (route.facet?.entity_type) qs.set("entity_type", route.facet.entity_type);
  }
  if (route.module === "notebook") {
    qs.set("page", route.notebookPath || state.notebookPath || "Home");
  }
  history.replaceState(null, "", `#/cases/${route.caseId}?${qs.toString()}`);
}

function navigate(route) {
  state.route = route;
  setHash(route);
  render();
  loadForRoute();
}

async function loadForRoute() {
  state.err = null;
  try {
    if (state.route.name === "home") {
      const data = await api("/api/cases");
      state.cases = data.cases || [];
      state.active = data.active || null;
      state.doc = null;
      state.hits = null;
      state.overview = null;
      state.facet = null;
      render();
      return;
    }

    state.caseId = state.route.caseId;
    state.module = state.route.module || "overview";
    state.path = state.route.folder || "";
    state.tab = state.route.tab || "preview";
    state.selectedPath = state.route.docPath || null;
    state.facet = state.route.facet || null;
    state.browseMode = state.route.browseMode || "categories";
    state.category = state.route.category || null;
    state.notebookPath = state.route.notebookPath || state.notebookPath || "Home";

    const casesData = await api("/api/cases");
    state.cases = casesData.cases || [];
    state.active = casesData.active || null;
    state.caseMeta = state.cases.find(c => c.id === state.caseId) || null;

    if (state.module === "overview") {
      const ov = await api(`/api/cases/${state.caseId}/overview`);
      state.overview = ov;
      if (!state.caseMeta) state.caseMeta = ov.case;
      state.doc = null;
      render();
      return;
    }

    if (state.module === "notebook") {
      await loadNotebook(state.notebookPath, false);
      render();
      return;
    }

    if (state.facet) {
      const params = new URLSearchParams({ case_id: String(state.caseId) });
      if (state.facet.tag) params.set("tag", state.facet.tag);
      if (state.facet.entity) params.set("entity", state.facet.entity);
      if (state.facet.entity_type) params.set("entity_type", state.facet.entity_type);
      const data = await api(`/api/files/by-facet?${params}`);
      state.entries = data.entries || [];
      state.breadcrumbs = [];
      if (!state.caseMeta) state.caseMeta = data.case;
    } else if (state.browseMode === "folders") {
      const dir = await api(`/api/files/list?case_id=${state.caseId}&path=${encodeURIComponent(state.path)}`);
      if (!state.caseMeta) state.caseMeta = dir.case || null;
      state.entries = dir.entries || [];
      state.breadcrumbs = dir.breadcrumbs || [];
      state.path = dir.path || state.path;
    } else {
      const params = new URLSearchParams({ case_id: String(state.caseId) });
      if (state.category) params.set("category", state.category);
      const data = await api(`/api/files/categories?${params}`);
      if (!state.caseMeta) state.caseMeta = data.case;
      state.entries = data.entries || [];
      state.breadcrumbs = state.category
        ? [{ name: data.category_label || state.category, path: state.category }]
        : [];
    }

    if (state.selectedPath) {
      await loadDoc(state.selectedPath, false);
    } else {
      state.doc = null;
    }
    render();
  } catch (e) {
    state.err = e.message || String(e);
    render();
  }
}

/** Clean full-frame PDF embed (hide Chrome/Edge thumbnail sidebar + toolbar). */
function pdfEmbedUrl(url) {
  if (!url) return url;
  const base = String(url).split("#")[0];
  return `${base}#toolbar=0&navpanes=0&scrollbar=0&view=FitH`;
}

function relativize(url) {
  if (!url) return url;
  try {
    const u = new URL(url, location.origin);
    return u.pathname + u.search;
  } catch {
    return url;
  }
}

async function loadDoc(relPath, push) {
  state.selectedPath = relPath;
  state.hits = null;
  state.module = "explorer";
  if (push !== false) {
    state.route = {
      name: "case",
      caseId: state.caseId,
      module: "explorer",
      browseMode: state.browseMode || "categories",
      category: state.facet ? null : state.category,
      folder: state.facet || state.browseMode !== "folders" ? "" : state.path,
      docPath: relPath,
      tab: state.tab || "preview",
      facet: state.facet,
    };
    setHash(state.route);
  }
  try {
    const data = await api(
      `/api/files/detail?case_id=${state.caseId}&path=${encodeURIComponent(relPath)}`
    );
    state.doc = data.file;
    state.doc.raw_url = relativize(state.doc.raw_url);
    state.doc.open_url = relativize(state.doc.open_url);
    state.doc.download_url = relativize(state.doc.download_url);
    if (!state.route.tab || state.route.tab === "preview") {
      if (!state.doc.text && state.doc.kind === "other") state.tab = "metadata";
      else state.tab = "preview";
    } else {
      state.tab = state.route.tab;
    }
  } catch (e) {
    const entry = state.entries.find(x => (x.path || x.rel_path) === relPath && (x.type === "file" || !x.type || x.type === "file"));
    state.doc = {
      name: entry?.name || relPath.split("/").pop(),
      rel_path: relPath,
      bates: entry?.bates || null,
      mime: entry?.mime || null,
      size: entry?.size,
      kind: "other",
      meta: {},
      entities: [],
      tags: [],
      text: "",
      chunks: [],
      chunk_count: 0,
      open_url: relativize(entry?.open_url),
      raw_url: relativize(entry?.raw_url || entry?.open_url),
      download_url: relativize(entry?.download_url),
      _not_ingested: true,
      error: e.message,
    };
    state.tab = "preview";
  }
  render();
}

async function runSearch() {

  const q = (qEl && qEl.value || "").trim();

      `/api/search?q=${encodeURIComponent(q)}&case_id=${state.caseId}&mode=${encodeURIComponent(mode)}`
    );

    render();
  } catch (e) {

async function loadNotebook(path, push) {
  const list = await api(`/api/notebook/pages?case_id=${state.caseId}`);
  state.notebookPages = list.pages || [];
  if (!state.caseMeta) state.caseMeta = list.case;
  const target = path || "Home";
  let page;
  try {
    const data = await api(`/api/notebook/page?case_id=${state.caseId}&path=${encodeURIComponent(target)}`);
    page = data.page;
  } catch {
    page = { path: target, title: target.split("/").pop(), body: "", id: null };
  }
  state.notebookPath = page.path;
  state.notebookPage = page;
  state.notebookDraftTitle = page.title || "";
  state.notebookDraftBody = page.body || "";
  state.notebookDirty = false;
  if (push !== false) {
    state.route = {
      name: "case",
      caseId: state.caseId,
      module: "notebook",
      notebookPath: page.path,
    };
    setHash(state.route);
  }
}

async function saveNotebook() {
  const res = await fetch("/api/notebook/page", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      case_id: state.caseId,
      path: state.notebookPath,
      title: state.notebookDraftTitle,
      body: state.notebookDraftBody,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || res.statusText);
  state.notebookPage = data.page;
  state.notebookDirty = false;
  const list = await api(`/api/notebook/pages?case_id=${state.caseId}`);
  state.notebookPages = list.pages || [];
  render();
}

async function deleteNotebookPage() {
  if (!state.notebookPath || state.notebookPath === "Home") {
    alert("Home page cannot be deleted.");
    return;
  }
  if (!confirm(`Delete notebook page “${state.notebookPath}”?`)) return;
  const res = await fetch(
    `/api/notebook/page?case_id=${state.caseId}&path=${encodeURIComponent(state.notebookPath)}`,
    { method: "DELETE" }
  );
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  await loadNotebook("Home", true);
  render();
}

    if (doc.kind === "pdf" && doc.raw_url) {
      body = `<iframe class="preview-frame" src="${esc(pdfEmbedUrl(doc.raw_url))}" title="${esc(doc.name)}"></iframe>`;
    } else if (doc.kind === "image" && doc.raw_url) {
      body = `<img class="preview-img" src="${esc(doc.raw_url)}" alt="${esc(doc.name)}"/>`;
    } else if ((doc.kind === "video" || doc.kind === "audio") && doc.raw_url) {
      const tag = doc.kind === "video" ? "video" : "audio";
      body = `<${tag} class="preview-frame" controls src="${esc(doc.raw_url)}"></${tag}>`;
    } else if (doc.text) {
      body = `<div class="panel-card"><pre class="text-body">${esc(doc.text.slice(0, 8000))}${doc.text.length > 8000 ? "\n…" : ""}</pre></div>`;
    } else if (doc.open_url || doc.raw_url) {
      body = `<div class="panel-card">
        <p>${doc._not_ingested ? "File is on disk but not fully ingested yet." : "No inline preview for this type."}</p>
        <p>${doc.download_url ? `<a href="${esc(doc.download_url)}" download target="_blank" rel="noopener">Download</a>` : ""}</p>
        ${doc.error ? `<p class="err">${esc(doc.error)}</p>` : ""}
      </div>`;
    } else {
      body = `<div class="placeholder">Nothing to preview.</div>`;
    }
  } else if (tab === "text") {
    body = doc.text
      ? `<div class="panel-card"><pre class="text-body">${esc(doc.text)}</pre></div>`
      : `<div class="panel-card placeholder">No extracted text.</div>`;
  } else {
    const rows = [
      ["Name", doc.name],
      ["Path", doc.rel_path],
      ["Bates", doc.bates],
      ["MIME", doc.mime],
      ["Size", fmtSize(doc.size)],
      ["Kind", doc.kind],
    ];
    body = `<div class="panel-card"><table class="meta-table">
      ${rows.filter(([, v]) => v != null && v !== "").map(([k, v]) =>
        `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`
      ).join("")}
    </table></div>`;
  }
  return `
    <aside class="nb-doc">
      <div class="doc-head">
        <div class="doc-title-row">
          <div>
            <h1>${esc(doc.name)}</h1>
            ${doc.bates ? `<div class="bates">${esc(doc.bates)}</div>` : ""}
            <div class="meta">${esc(doc.rel_path)}</div>

          </div>
        </div>
        <div class="tabs">${tabBtns}</div>
      </div>
      <div class="doc-body">${body}</div>
    </aside>
  `;
}

/** Minimal Markdown + wiki links → HTML (no external deps). */
function renderMarkdown(src) {
  let text = String(src || "");
  // fenced code
  const fences = [];
  text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
    const i = fences.length;
    fences.push(`<pre><code>${esc(code.replace(/^\n/, ""))}</code></pre>`);
    return `\u0000FENCE${i}\u0000`;
  });
  // wiki doc / page links before generic markdown links
  text = text.replace(/\[\[doc:([^\]|]+)(?:\|([^\]]+))?\]\]/gi, (_, path, label) => {
    const lab = label || path.split("/").pop();
    return `<a class="doc-link" href="#" data-doc="${esc(path.trim())}">${esc(lab.trim())}</a>`;
  });
  text = text.replace(/\[\[page:([^\]|]+)(?:\|([^\]]+))?\]\]/gi, (_, path, label) => {
    const lab = label || path.split("/").pop();
    return `<a class="page-link" href="#" data-page="${esc(path.trim())}">${esc(lab.trim())}</a>`;
  });
  // markdown links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, lab, url) =>
    `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(lab)}</a>`
  );
  // tables (simple)
  text = text.replace(/(^|\n)((?:\|.+\|\n)+)/g, (m, pre, block) => {
    const rows = block.trim().split("\n").filter(Boolean);
    if (rows.length < 2) return m;
    const parseRow = (r) => r.split("|").slice(1, -1).map(c => c.trim());
    const head = parseRow(rows[0]);
    const bodyRows = rows.slice(2).map(parseRow);
    let html = "<table><thead><tr>" + head.map(h => `<th>${esc(h)}</th>`).join("") + "</tr></thead><tbody>";
    for (const r of bodyRows) html += "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>";
    html += "</tbody></table>";
    return pre + html;
  });
  // headings / lists / paragraphs — line based
  const lines = text.split("\n");
  const out = [];
  let inUl = false, inOl = false;
  const closeLists = () => {
    if (inUl) { out.push("</ul>"); inUl = false; }
    if (inOl) { out.push("</ol>"); inOl = false; }
  };
  const inline = (s) => {
    // Protect existing HTML anchors from escaping
    const slots = [];
    let t = String(s).replace(/<a\b[^>]*>[\s\S]*?<\/a>/gi, (m) => {
      slots.push(m);
      return `\u0000A${slots.length - 1}\u0000`;
    });
    t = esc(t)
      .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
    t = t.replace(/\u0000A(\d+)\u0000/g, (_, i) => slots[Number(i)]);
    return t;
  };
  for (const line of lines) {
    if (line.startsWith("\u0000FENCE")) {
      closeLists();
      const i = Number(line.replace(/\u0000FENCE(\d+)\u0000/, "$1"));
      out.push(fences[i] || "");
      continue;
    }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) {
      closeLists();
      const n = h[1].length;
      out.push(`<h${n}>${inline(h[2])}</h${n}>`);
      continue;
    }
    const ul = /^[-*]\s+(.*)$/.exec(line);
    if (ul) {
      if (inOl) { out.push("</ol>"); inOl = false; }
      if (!inUl) { out.push("<ul>"); inUl = true; }
      out.push(`<li>${inline(ul[1])}</li>`);
      continue;
    }
    const ol = /^(\d+)\.\s+(.*)$/.exec(line);
    if (ol) {
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (!inOl) { out.push("<ol>"); inOl = true; }
      out.push(`<li>${inline(ol[2])}</li>`);
      continue;
    }
    closeLists();
    if (!line.trim()) { out.push(""); continue; }
    if (line.startsWith("<table") || line.startsWith("<pre")) {
      out.push(line);
    } else {
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  closeLists();
  return `<div class="md">${out.join("\n")}</div>`;
}

let caseRenameId = null;
let caseRenamePrev = "";
let caseRenameBusy = false;

function closeCaseRenameModal() {
  const modal = document.getElementById("caseRenameModal");
  if (modal) modal.hidden = true;
  caseRenameId = null;
  caseRenamePrev = "";
  caseRenameBusy = false;
  const status = document.getElementById("caseRenameStatus");
  if (status) {
    status.hidden = true;
    status.textContent = "";
  }
}

function openCaseRenameModal(caseId) {
  const current = (state.cases || []).find(c => c.id === caseId)
    || (state.caseMeta && state.caseMeta.id === caseId ? state.caseMeta : null);
  const prev = (current && (current.display_name || current.slug)) || "";
  const modal = document.getElementById("caseRenameModal");
  const input = document.getElementById("caseRenameInput");
  const status = document.getElementById("caseRenameStatus");
  if (!modal || !input) return;
  caseRenameId = caseId;
  caseRenamePrev = prev;
  input.value = prev;
  if (status) {
    status.hidden = true;
    status.textContent = "";
  }
  modal.hidden = false;
  requestAnimationFrame(() => {
    input.focus();
    input.select();
  });
}

async function saveCaseRename() {
  if (caseRenameBusy || caseRenameId == null) return;
  const input = document.getElementById("caseRenameInput");
  const status = document.getElementById("caseRenameStatus");
  const name = String(input && input.value || "").trim();
  if (!name) {
    if (status) {
      status.hidden = false;
      status.textContent = "Enter a case name.";
    }
    return;
  }
  if (name === caseRenamePrev) {
    closeCaseRenameModal();
    return;
  }
  caseRenameBusy = true;
  if (status) {
    status.hidden = false;
    status.style.color = "var(--muted-strong)";
    status.textContent = "Saving…";
  }
  try {
    const res = await fetch(`/api/cases/${caseRenameId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ display_name: name }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.error || res.statusText);
    const updated = data.case;
    if (updated) {
      state.cases = (state.cases || []).map(c => (c.id === updated.id ? updated : c));
      if (state.caseMeta && state.caseMeta.id === updated.id) state.caseMeta = updated;
    }
    closeCaseRenameModal();
    render();
  } catch (err) {
    if (status) {
      status.hidden = false;
      status.style.color = "var(--danger)";
      status.textContent = err.message || String(err);
    }
    caseRenameBusy = false;
  }
}

function wireCaseRenameModal() {
  const modal = document.getElementById("caseRenameModal");
  if (!modal || modal.dataset.wired) return;
  modal.dataset.wired = "1";
  modal.addEventListener("click", (ev) => {
    if (ev.target.closest && ev.target.closest("[data-case-rename-dismiss]")) {
      closeCaseRenameModal();
    }
  });
  const save = document.getElementById("caseRenameSave");
  if (save) save.addEventListener("click", () => saveCaseRename());
  const input = document.getElementById("caseRenameInput");
  if (input) {
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        saveCaseRename();
      } else if (ev.key === "Escape") {
        ev.preventDefault();
        closeCaseRenameModal();
      }
    });
  }
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && modal && !modal.hidden) closeCaseRenameModal();
  });
}

function renameCase(caseId) {
  openCaseRenameModal(caseId);
}

function statusLabel(status) {
  const raw = String(status || "unknown");
  const key = raw.toLowerCase();
  if (key === "skipped_not_covered" || key === "skipped-not-covered") {
    return "File Type Not Supported";
  }
  if (key === "skipped") return "Skipped";
  if (key === "ready") return "Ready";
  if (key === "pending") return "Pending";
  if (key === "error") return "Error";
  return raw.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

function statusPill(status) {
  const raw = String(status || "unknown");
  const cls = raw.replace(/[^a-z0-9_]/gi, "_").toLowerCase();
  return `<span class="status-pill ${esc(cls)}">${esc(statusLabel(raw))}</span>`;
}
